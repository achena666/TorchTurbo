name: CI / PR

# Sole required check: gate.
# select does static checks + planning on one runner; the three lanes run in
# parallel and depend only on select. A skipped lane must carry a reason,
# otherwise gate fails -- that is what keeps lanes from being disabled silently.
#
# Job keys are numbered because the graph orders sibling jobs by key: that is
# what pins cpu-unit -> npu-unit -> model-unit top to bottom.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Run everything (same as the ci:full label)'
        required: false
        default: false
        type: boolean

# A new push cancels the old run; model-unit is the expensive part.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read          # gate timing reads created_at / run_started_at

jobs:
  # Static checks and planning share one runner: they are strictly sequential,
  # so step failure already means "no plan". The trailing always() step reports
  # which stage broke, since a red job alone cannot tell them apart.
  select:
    name: Lint_Select
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 20
    outputs:
      e2e: ${{ steps.pick.outputs.e2e }}
      stage: ${{ steps.stage.outputs.stage }}
      cpu_unit_run: ${{ steps.pick.outputs.cpu_unit_run }}
      npu_unit_run: ${{ steps.pick.outputs.npu_unit_run }}
      npu_model_run: ${{ steps.pick.outputs.npu_model_run }}
      cpu_unit_files: ${{ steps.pick.outputs.cpu_unit_files }}
      image: ${{ steps.image.outputs.image }}
      summary: ${{ steps.pick.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # merge-base needs history

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: static checks
        id: static
        run: |
          set -uo pipefail
          python -m pip install --quiet pyyaml
          python3 scripts/ci/check_static.py

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      # Binary instead of docker run: hadolint/hadolint is amd64 only, while
      # CI_CPU_RUNNER defaults to an arm64 host.
      - name: hadolint
        run: |
          set -uo pipefail
          case "$(uname -m)" in
            aarch64|arm64) HARCH=arm64 ;;
            x86_64|amd64)  HARCH=x86_64 ;;
            *) echo "::error::unsupported arch $(uname -m)"; exit 1 ;;
          esac
          curl -sSfL -o /tmp/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-$HARCH"
          chmod +x /tmp/hadolint
          /tmp/hadolint --failure-threshold error docker/npu/Dockerfile_aarch64

      - name: resolve plan
        id: pick
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          FORCE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.force_all }}
        run: |
          set -uo pipefail

          # Label semantics live here only; jobs never re-interpret them.
          EXTRA=()
          case ",${LABELS}," in
            *,ci:full,*)     EXTRA+=(--force-all --e2e-all) ;;
            *,ci:e2e,*)      EXTRA+=(--e2e-force) ;;
            *,ci:skip-npu,*) EXTRA+=(--no-npu) ;;
          esac
          [ "${FORCE_INPUT}" = "true" ] && EXTRA+=(--force-all --e2e-all)

          # An empty diff means "not enough information" -> full run (fail-open).
          python3 scripts/ci/affected.py --changed-from git \
            --dump-changed /tmp/changed.txt \
            "${EXTRA[@]}" --explain --output /tmp/sel.json --github-output "$GITHUB_OUTPUT"

          wc -l < /tmp/changed.txt

          # The selector is gated too: a silent algorithm regression would
          # quietly drop test coverage.
          python3 scripts/ci/affected.py --self-test

      # The image ref is resolved, not hardcoded: vars.BASE_IMAGE_TAG wins,
      # otherwise the pinned base tag.
      - name: resolve image
        id: image
        env:
          OVERRIDE: ${{ vars.BASE_IMAGE_TAG }}
        run: |
          set -uo pipefail
          REF=$(python3 scripts/ci/image.py resolve --override "$OVERRIDE" \
            --fallback 'swr.cn-north-12.myhuaweicloud.com/ascend/torchturbo_npu:base-latest')
          echo "image=$REF" >> "$GITHUB_OUTPUT"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Plan

          | item | value |
          |---|---|---|
          | mode | \`${{ steps.pick.outputs.mode }}\` |
          | lanes | \`${{ steps.pick.outputs.cpu_unit_run }} / ${{ steps.pick.outputs.npu_unit_run }} / ${{ steps.pick.outputs.npu_model_run }}\` |
          | e2e | \`${{ steps.pick.outputs.e2e }}\` |
          | image | \`$REF\` |
          | summary | \`${{ steps.pick.outputs.summary }}\` |

          <details><summary>changed files</summary>

          \`\`\`
          $(head -100 /tmp/changed.txt || true)
          \`\`\`
          </details>
          EOF

      # Must be last and always(): earlier steps stop on failure, and job
      # outputs are still published when the job fails.
      - name: record stage
        id: stage
        if: always()
        run: |
          set -uo pipefail
          if [ "${{ job.status }}" = "cancelled" ]; then
            echo "stage=cancelled" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.static.outcome }}" != "success" ]; then
            echo "stage=static" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.pick.outcome }}" != "success" ]; then
            echo "stage=select" >> "$GITHUB_OUTPUT"
          else
            echo "stage=ok" >> "$GITHUB_OUTPUT"
          fi

  # One call, one job: each lane file declares exactly one job, and the CPU
  # lane is not sharded. No matrix anywhere, so the graph stays one box per lane.
  l1_cpu_unit:
    name: '1. cpu-unit'
    needs: select
    if: |
      always() && needs.select.result == 'success' &&
      needs.select.outputs.cpu_unit_run == 'true'
    uses: ./.github/workflows/ci-tests-cpu.yml
    with:
      runner_label: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
      test_files: ${{ needs.select.outputs.cpu_unit_files }}
      timeout_minutes: 40

  l2_npu_unit:
    name: '2. npu-unit'
    needs: select
    # Fork PRs get no secrets, and passing secrets to fork code is RCE.
    if: |
      always() && needs.select.result == 'success' &&
      needs.select.outputs.npu_unit_run == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/ci-tests-npu.yml
    with:
      image: ${{ needs.select.outputs.image }}
      runner_label: ${{ vars.CI_NPU_RUNNER || 'linux-aarch64-a3-800i-2' }}
      test_files: '[]'
      timeout_minutes: 40
    secrets:
      SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
      SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}

  l3_model_unit:
    name: '3. model-unit'
    needs: select
    if: |
      always() && needs.select.result == 'success' &&
      needs.select.outputs.npu_model_run == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/ci-tests-model.yml
    with:
      runner_label: ${{ vars.CI_E2E_RUNNER || 'linux-aarch64-a3-800i-8' }}
      image: ${{ needs.select.outputs.image }}
      profiles: ${{ needs.select.outputs.e2e }}
      framework: lf
      train_seq_len: '1024'
      train_dataset: 'gsm8k'
      train_finetuning_type: 'full'
      timeout_minutes: 45
      train_timeout_minutes: 25
      fetch_timeout_seconds: 600
    secrets:
      SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
      SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}

  # Sole required check. Rules live in scripts/ci/gate.py so PR and full runs
  # cannot drift apart.
  #
  # select is a direct dependency: when planning fails the lanes skip
  # immediately (their if requires select to succeed) and gate still runs,
  # reporting the result in seconds instead of minutes.
  gate:
    name: gate
    needs: [select, l1_cpu_unit, l2_npu_unit, l3_model_unit]
    if: always()
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4        # gate.py lives in scripts/ci

      - name: timing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/gate.py timing

      - name: judge
        env:
          R_SEL: ${{ needs.select.result }}
          SEL_STAGE: ${{ needs.select.outputs.stage }}
          R_CPU_UNIT: ${{ needs.l1_cpu_unit.result }}
          R_NPU_UNIT: ${{ needs.l2_npu_unit.result }}
          R_NPU_MODEL: ${{ needs.l3_model_unit.result }}
          CPU_UNIT_RUN: ${{ needs.select.outputs.cpu_unit_run }}
          NPU_UNIT_RUN: ${{ needs.select.outputs.npu_unit_run }}
          NPU_MODEL_RUN: ${{ needs.select.outputs.npu_model_run }}
          SKIP_REASON: ${{ needs.l3_model_unit.outputs.skip_reason }}
          STRICT: ${{ contains(github.event.pull_request.labels.*.name, 'ci:e2e:strict') }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          SUMMARY: ${{ needs.select.outputs.summary }}
        run: python3 scripts/ci/gate.py judge --mode pr
