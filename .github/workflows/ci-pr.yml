name: CI

# One entry point, two modes, one job per lane.
#
#   mode=pr     pull request gate; selection from the diff, sole required check: gate
#   mode=full   everything; selection forced, no sharding
#
# Lanes are inlined, not called as reusable workflows: a `uses:` job always
# displays as "<caller name> / <callee name>", which cannot be collapsed into
# the single label we want on the graph. Job keys carry an l1_/l2_/l3_ prefix
# because the graph orders sibling jobs by key -- that is what keeps cpu-unit
# first, npu-unit second, npu-model last.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      mode:
        description: 'pr = select from the diff, full = run everything'
        required: true
        default: 'pr'
        type: choice
        options:
          - pr
          - full
      force_all:
        description: 'pr only: run everything (same as the ci:full label)'
        required: false
        default: false
        type: boolean
      with_e2e:
        description: 'pr: one cheapest profile; full: every profile'
        required: false
        default: false
        type: boolean
      # Smoke switch: one dir / file / node id instead of the whole selection.
      # '-' keeps the normal selection. Takes precedence over everything else
      # in pytest.sh, which is what makes a flow check take minutes, not hours.
      test_path:
        description: "unit lanes only: dir / file / node id; '-' = normal selection"
        required: false
        default: '-'
        type: string

# PR runs cancel the previous run of the same PR. Full runs get a per-run group
# on purpose: a shared group with cancel-in-progress: false still cancels
# *pending* jobs, and repeated dispatches left the queue stuck at pending
# forever. No shared group, no queue, nothing to get stuck.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('full-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  actions: read          # gate timing reads created_at / run_started_at

env:
  # Two triggers, one body: pull_request is always pr mode.
  # Named CI_MODE because MODE is what pytest.sh reads (cpu / npu).
  CI_MODE: ${{ github.event_name == 'pull_request' && 'pr' || inputs.mode }}

jobs:
  # Static checks and planning share one runner: they are strictly sequential,
  # so step failure already means "no plan". The trailing always() step reports
  # which stage broke, since a red job alone cannot tell them apart.
  select:
    name: Lint_Select
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 20
    outputs:
      e2e: ${{ steps.pick.outputs.e2e }}
      stage: ${{ steps.stage.outputs.stage }}
      cpu_unit_run: ${{ steps.pick.outputs.cpu_unit_run }}
      npu_unit_run: ${{ steps.pick.outputs.npu_unit_run }}
      npu_model_run: ${{ steps.pick.outputs.npu_model_run }}
      cpu_unit_files: ${{ steps.pick.outputs.cpu_unit_files }}
      image: ${{ steps.image.outputs.image }}
      summary: ${{ steps.pick.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # merge-base needs history

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: static checks
        id: static
        run: |
          set -uo pipefail
          python -m pip install --quiet pyyaml
          python3 scripts/ci/check_static.py

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      # Binary instead of docker run: hadolint/hadolint is amd64 only, while
      # CI_CPU_RUNNER defaults to an arm64 host.
      - name: hadolint
        run: |
          set -uo pipefail
          case "$(uname -m)" in
            aarch64|arm64) HARCH=arm64 ;;
            x86_64|amd64)  HARCH=x86_64 ;;
            *) echo "::error::unsupported arch $(uname -m)"; exit 1 ;;
          esac
          curl -sSfL -o /tmp/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-$HARCH"
          chmod +x /tmp/hadolint
          /tmp/hadolint --failure-threshold error docker/npu/Dockerfile_aarch64

      - name: resolve plan
        id: pick
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          FORCE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.force_all }}
          # PRs must never get e2e for free: only an explicit dispatch or label does.
          WITH_E2E: ${{ github.event_name == 'workflow_dispatch' && inputs.with_e2e }}
        run: |
          set -uo pipefail

          # Label semantics live here only; jobs never re-interpret them.
          EXTRA=()
          if [ "${CI_MODE}" = "full" ]; then
            EXTRA+=(--force-all)
            [ "${WITH_E2E}" = "true" ] && EXTRA+=(--e2e-all)
          else
            case ",${LABELS}," in
              *,ci:full,*)     EXTRA+=(--force-all --e2e-all) ;;
              *,ci:e2e,*)      EXTRA+=(--e2e-force) ;;
              *,ci:skip-npu,*) EXTRA+=(--no-npu) ;;
            esac
            # force_all means "all unit tests", not "all e2e as well": the
            # 8-card lane is the expensive part and stays opt-in.
            [ "${FORCE_INPUT}" = "true" ] && EXTRA+=(--force-all)
            # One cheapest profile only: enough to prove the lane works.
            [ "${WITH_E2E}" = "true" ] && EXTRA+=(--e2e-force)
          fi

          # An empty diff means "not enough information" -> full run (fail-open).
          python3 scripts/ci/affected.py --changed-from git \
            --dump-changed /tmp/changed.txt \
            "${EXTRA[@]}" --explain --output /tmp/sel.json --github-output "$GITHUB_OUTPUT"

          wc -l < /tmp/changed.txt

          # The selector is gated too: a silent algorithm regression would
          # quietly drop test coverage.
          python3 scripts/ci/affected.py --self-test

      # The image ref is resolved, not hardcoded: vars.BASE_IMAGE_TAG wins,
      # otherwise the pinned base tag.
      - name: resolve image
        id: image
        env:
          OVERRIDE: ${{ vars.BASE_IMAGE_TAG }}
        run: |
          set -uo pipefail
          REF=$(python3 scripts/ci/image.py resolve --override "$OVERRIDE" \
            --fallback 'swr.cn-north-12.myhuaweicloud.com/ascend/torchturbo_npu:base-latest')
          echo "image=$REF" >> "$GITHUB_OUTPUT"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Plan

          | item | value |
          |---|---|---|
          | mode | \`${CI_MODE}\` |
          | lanes | \`${{ steps.pick.outputs.cpu_unit_run }} / ${{ steps.pick.outputs.npu_unit_run }} / ${{ steps.pick.outputs.npu_model_run }}\` |
          | e2e | \`${{ steps.pick.outputs.e2e }}\` |
          | image | \`$REF\` |
          | summary | \`${{ steps.pick.outputs.summary }}\` |

          <details><summary>changed files</summary>

          \`\`\`
          $(head -100 /tmp/changed.txt || true)
          \`\`\`
          </details>
          EOF

      # Must be last and always(): earlier steps stop on failure, and job
      # outputs are still published when the job fails.
      - name: record stage
        id: stage
        if: always()
        run: |
          set -uo pipefail
          if [ "${{ job.status }}" = "cancelled" ]; then
            echo "stage=cancelled" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.static.outcome }}" != "success" ]; then
            echo "stage=static" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.pick.outcome }}" != "success" ]; then
            echo "stage=select" >> "$GITHUB_OUTPUT"
          else
            echo "stage=ok" >> "$GITHUB_OUTPUT"
          fi

  # Bare metal, no sharding: one job, one box. Sharding would put one box per
  # shard on the graph, and 5 shards was slower end to end than one job.
  l1_cpu_unit:
    name: cpu-unit-tests
    needs: select
    if: |
      always() && needs.select.result == 'success' &&
      needs.select.outputs.cpu_unit_run == 'true'
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 40

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        env:
          TEST_FILES: ${{ needs.select.outputs.cpu_unit_files }}
          RESULT_JSON: /tmp/ci-result.json
        run: |
          set -uo pipefail
          python3 scripts/ci/result.py init --file "$RESULT_JSON" \
            kind=pytest model_type=pytest-cpu-unit mode=cpu \
            runner_label="${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}"

          START=$(date +%s)
          # Install torch first: the extras below declare torch deps, and
          # resolving them together pulls a full CUDA build.
          python -m pip install torch 2>&1 | tee /tmp/turbo.log
          RC=${PIPESTATUS[0]}
          # Same extras as the container lane, otherwise the same test is green
          # on one lane and red on the other.
          if [ "$RC" -eq 0 ]; then
            python -m pip install --no-build-isolation -e ".[test]" 2>&1 | tee -a /tmp/turbo.log
            RC=${PIPESTATUS[0]}
          fi
          # Print the real version: transformers arrives transitively, so
          # without this line drift only shows up as a batch of red tests.
          python -c "import transformers; print('transformers =', transformers.__version__)" || true

          python3 scripts/ci/result.py phase --file "$RESULT_JSON" \
            --name 'install' --seconds "$(( $(date +%s) - START ))" --rc "$RC"
          exit "$RC"

      - name: pytest
        env:
          MODE: cpu
          TEST_FILES: ${{ needs.select.outputs.cpu_unit_files }}
          TEST_PATH: ${{ inputs.test_path }}
          RESULT_JSON: /tmp/ci-result.json
        run: bash scripts/ci/pytest.sh

      - name: summary
        if: always()
        env:
          RESULT_JSON: /tmp/ci-result.json
        run: |
          set -uo pipefail
          python3 scripts/ci/result.py report --file "$RESULT_JSON" \
            --train-log /tmp/pytest.log --junit /tmp/pytest.xml >> "$GITHUB_STEP_SUMMARY" || true
          python3 scripts/ci/result.py notice --file "$RESULT_JSON" \
            --model-type pytest-cpu-unit || true

  # Containerised; once it starts, the whole lane runs (the operator and image
  # surface is repo-wide, so running only the selected files proves nothing).
  l2_npu_unit:
    name: npu-unit-tests
    needs: select
    # Fork PRs get no secrets, and passing secrets to fork code is RCE.
    if: |
      always() && needs.select.result == 'success' &&
      needs.select.outputs.npu_unit_run == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.CI_NPU_RUNNER || 'linux-aarch64-a3-800i-2' }}
    timeout-minutes: 40

    container:
      image: ${{ needs.select.outputs.image }}
      credentials:
        username: ${{ secrets.SWR_USERNAME }}
        password: ${{ secrets.SWR_PASSWORD }}
      options: --user root

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # Build the result file before anything can fail, so a run that dies in
      # this step still renders a summary.
      - name: preflight
        env:
          RESULT_JSON: /tmp/ci-result.json
        run: |
          set -uo pipefail
          python3 scripts/ci/result.py init --file "$RESULT_JSON" \
            kind=pytest model_type=pytest-npu-unit mode=npu \
            runner_label="${{ vars.CI_NPU_RUNNER || 'linux-aarch64-a3-800i-2' }}" \
            image="${{ needs.select.outputs.image }}"

          # Snapshot torch before installing; a swapped torch turns every test
          # red and looks like a code bug.
          python3 scripts/ci/env.py capture --file /tmp/torch-before.json || true

          uname -m; nproc; free -h | head -2; df -h / | tail -1; python -V

      - name: npu self-check
        env:
          RESULT_JSON: /tmp/ci-result.json
        run: |
          set -uo pipefail
          # Glob instead of `ls | wc -l`: shellcheck SC2012 flags ls parsing.
          shopt -s nullglob
          davinci=(/dev/davinci*)
          if [ "${#davinci[@]}" -eq 0 ]; then
            echo "::error::no /dev/davinci*, NPUs not mapped into the pod"
            exit 1
          fi
          echo "davinci count: ${#davinci[@]}"
          npu-smi info 2>/dev/null | head -12 || true
          START=$(date +%s); set +e
          python3 scripts/ci/env.py verify
          RC=$?
          python3 scripts/ci/result.py phase --file "$RESULT_JSON" \
            --name 'npu self-check' --seconds "$(( $(date +%s) - START ))" --rc "$RC"
          exit "$RC"

      - name: install
        env:
          RESULT_JSON: /tmp/ci-result.json
        run: |
          set -uo pipefail
          START=$(date +%s)
          # --no-build-isolation: [build-system].requires contains torch, and
          # pip would otherwise download a full torch just to run setuptools.
          python -m pip install --no-cache-dir --no-build-isolation -e ".[test]" 2>&1 \
            | tee /tmp/turbo.log
          RC=${PIPESTATUS[0]}
          ELAPSED=$(( $(date +%s) - START ))
          python -c "import transformers; print('transformers =', transformers.__version__)" || true
          [ "$RC" -eq 0 ] && { python3 scripts/ci/env.py check --file /tmp/torch-before.json || RC=1; }
          python3 scripts/ci/result.py phase --file "$RESULT_JSON" \
            --name 'install' --seconds "$ELAPSED" --rc "$RC"
          exit "$RC"

      - name: pytest
        env:
          MODE: npu
          TEST_FILES: '[]'
          TEST_PATH: ${{ inputs.test_path }}
          RESULT_JSON: /tmp/ci-result.json
        run: bash scripts/ci/pytest.sh

      - name: summary
        if: always()
        env:
          RESULT_JSON: /tmp/ci-result.json
        run: |
          set -uo pipefail
          python3 scripts/ci/result.py report --file "$RESULT_JSON" \
            --train-log /tmp/pytest.log --junit /tmp/pytest.xml >> "$GITHUB_STEP_SUMMARY" || true
          python3 scripts/ci/result.py notice --file "$RESULT_JSON" \
            --model-type pytest-npu-unit || true

  # N profiles in one job. A matrix would put one box per profile on the graph,
  # so the loop lives in train.sh lane instead.
  l3_npu_model:
    name: npu-model-tests
    needs: select
    if: |
      always() && needs.select.result == 'success' &&
      needs.select.outputs.npu_model_run == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.CI_E2E_RUNNER || 'linux-aarch64-a3-800i-8' }}
    # fromJSON is not needed here (no inputs), but keep the literal in sync with
    # the lane timeout below.
    timeout-minutes: 45
    outputs:
      skip_reason: ${{ steps.lane.outputs.skip_reason }}

    container:
      image: ${{ needs.select.outputs.image }}
      credentials:
        username: ${{ secrets.SWR_USERNAME }}
        password: ${{ secrets.SWR_PASSWORD }}
      options: --user root

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # 20 s to detect "no NPU" beats discovering it after installing deps.
      - name: npu and stack self-check
        run: bash scripts/ci/train.sh probe

      # prepare / install / run / report per profile, aggregated into one rc.
      - name: train
        id: lane
        timeout-minutes: 25
        env:
          E2E_PROFILES: ${{ needs.select.outputs.e2e }}
          FRAMEWORK: lf
          RUNNER_LABEL: ${{ vars.CI_E2E_RUNNER || 'linux-aarch64-a3-800i-8' }}
          IMAGE: ${{ needs.select.outputs.image }}
          SEQ_LEN: '4096'
          DATASET_IN: 'gsm8k'
          FINETUNING_TYPE: 'full'
          FETCH_TIMEOUT: '600'
          DIAG: 'true'
          RESULT_JSON: /tmp/ci-result.json
        run: bash scripts/ci/train.sh lane

      # Cleanup removes derived config and half a checkpoint, so it runs last.
      # timeout-minutes only kills the process: a killed training leaves child
      # processes holding cards and HBM, which makes the next job fail for
      # unrelated reasons.
      - name: cleanup
        if: always()
        continue-on-error: true
        run: python3 scripts/ci/env.py cleanup

  # Sole required check. Rules live in scripts/ci/gate.py so pr and full modes
  # cannot drift apart.
  #
  # select is a direct dependency: when planning fails the lanes skip
  # immediately (their if requires select to succeed) and gate still runs,
  # reporting the result in seconds instead of minutes.
  gate:
    name: gate
    needs: [select, l1_cpu_unit, l2_npu_unit, l3_npu_model]
    if: always()
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4        # gate.py lives in scripts/ci

      - name: timing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/gate.py timing

      - name: judge
        env:
          R_SEL: ${{ needs.select.result }}
          SEL_STAGE: ${{ needs.select.outputs.stage }}
          R_CPU_UNIT: ${{ needs.l1_cpu_unit.result }}
          R_NPU_UNIT: ${{ needs.l2_npu_unit.result }}
          R_NPU_MODEL: ${{ needs.l3_npu_model.result }}
          CPU_UNIT_RUN: ${{ needs.select.outputs.cpu_unit_run }}
          NPU_UNIT_RUN: ${{ needs.select.outputs.npu_unit_run }}
          NPU_MODEL_RUN: ${{ needs.select.outputs.npu_model_run }}
          SKIP_REASON: ${{ needs.l3_npu_model.outputs.skip_reason }}
          STRICT: ${{ contains(github.event.pull_request.labels.*.name, 'ci:e2e:strict') }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          SUMMARY: ${{ needs.select.outputs.summary }}
        run: python3 scripts/ci/gate.py judge --mode "$CI_MODE"
