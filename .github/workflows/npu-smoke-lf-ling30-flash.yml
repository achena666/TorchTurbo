name: NPU Smoke (Ling-3.0-flash trimmed)

# Ling-3.0-flash 的实验台。跟 npu-smoke-lf.yml 的差别只在模型获取：
# flash 全量是 255 GB / 24 个 shard，8 卡上既下不完也训不动，所以这里只取前 N 层。
#
# 为什么裁层是安全的：加载器遍历 model.named_parameters() 反查 index.json 拿文件名
# （checkpoint/weight_loader.py:317），模型只建了前 N 层，第 N 层之后的 shard 不会
# 进 files_needed，永远不会被 open；load_state_dict 也是 strict=False。
#
# 为什么默认 6 层：flash 的 layer_group_size=6、first_k_dense_replace=2，
# 6 层恰好是一个完整周期 —— L0,L1 是 dense+KDA，L2~L5 是 MoE（L5 是那 1 层 MLA）。
# 少一层就漏掉 MLA，多一层只是重复。
#
# 不改仓库里任何其他文件：model_map.tsv 仍把 bailing_hybrid 指向 tiny，flash 的
# repo 在本文件里单独指定；启动脚本、sft.yaml、src/ 全部原样使用。

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'Runner label (must match Settings -> Actions -> Runners)'
        required: true
        default: 'linux-aarch64-a3-800i-2'
        type: choice
        options:
          - linux-aarch64-a3-800i-2
          - linux-aarch64-a3-800i-4
          - linux-aarch64-a3-800i-8
          - linux-aarch64-a3-800i-16
      image:
        description: 'L1 base image; pin with repo@sha256:... for strict reproducibility'
        required: true
        default: 'swr.cn-north-12.myhuaweicloud.com/ascend/torchturbo_npu:base-latest'
      model_type:
        description: '模型：@register_model 的名字，映射表见 .github/workflows/model_map.tsv'
        required: true
        default: 'bailing_hybrid'
        type: choice
        # 只列在 lf 或 swift 下真有启动脚本的；其余 model_type 会在 ② 直接报错。
        options:
          - bailing_hybrid
          - qwen3_5
          - qwen3_5_moe
          - qwen3_5_moe_text
          - qwen4_exp
      framework:
        description: '训练框架；决定用 lf_* 还是 swift_* 启动脚本'
        required: true
        default: 'lf'
        type: choice
        options:
          - lf
          - swift
      # ---- 训练 stage 参数（训练固定执行，没有开关） ----
      train_model_path:
        description: '可选：显式指定模型目录；留空则下载 inclusionAI/Ling-3.0-flash 并裁剪'
        required: false
        default: ''
        type: string
      # 只训练前 N 层。0 = 不裁剪，此时必须同时给 train_model_path。
      train_layers:
        description: '只保留前 N 层（flash 建议 6：一个完整的 KDA/MLA + dense/MoE 周期）'
        required: true
        default: '6'
        type: string
      train_seq_len:
        description: 'cutoff_len'
        required: true
        default: '1024'
        type: string
      # 冒烟用的小数据集。和启动脚本里各自的默认值（science / wikipedia_en /
      # orca_rlhf）区分开：science.jsonl 有 2.6 GiB，而且它的 conversations[].info
      # 里 test_case / instruction_constrain 前几十 MB 全是 null，datasets 会用首块
      # 把 schema 锁成 null，后面遇到字符串就报
      # "Couldn't cast array of type string to null"。gsm8k 只有 2.7 MB、带 parquet，
      # 不会踩 schema 推断和下载这两个坑。
      train_dataset:
        description: '数据集名（必须是 dataset/dataset_info.json 里的 key）'
        required: true
        default: 'gsm8k'
        type: string
      train_finetuning_type:
        description: '微调方式'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - lora
      # 仓库里的 sft.yaml 是按满卡（如 sp2/ep8 = 16 卡）写的。CI 的 pod 卡数不一定够，
      # 所以默认 auto：按实际卡数收敛 sp/ep，生成一份派生配置，不改仓库里的 yaml。
      train_sp_size:
        description: '序列并行度；“auto” = 按卡数收敛（不整除则减半）'
        required: false
        default: 'auto'
        type: string
      train_ep_size:
        description: '专家并行度；“auto” = min(yaml 值, 卡数/sp)'
        required: false
        default: 'auto'
        type: string

# Separate group from npu-smoke.yml, but still serialized per pool: NPUs cannot be shared.
concurrency:
  group: npu-smoke-lf-${{ inputs.runner_label }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  # hf-mirror 在 pod 内可达（200），huggingface.co 是 503，必须走镜像。
  HF_ENDPOINT: 'https://hf-mirror.com'
  HF_HOME: '/root/.cache/huggingface'
  # HF_HOME 在共享 SFS 上，但 trust_remote_code 的代码副本不该放那儿：多个 pod
  # 并发写同一个目录会留下半截 .py，而 transformers 只按 exists() 判缓存，之后
  # 所有 run 都读坏文件。放到 pod 本地的 /tmp（与 / 同 overlay，随 pod 销毁）。
  HF_MODULES_CACHE: '/tmp/hf-modules'
  # 默认都是 10 s（constants.py:37）。元数据请求在镜像忙时常超 10 s，而
  # 下载的超时是 httpx 的单次 read 超时：网络停顿 > 10 s 就 httpx.ReadTimeout，
  # 且 http_get 的 retry_on_exceptions=() 不会重试，只能靠外层循环从头再来。
  HF_HUB_ETAG_TIMEOUT: '30'
  HF_HUB_DOWNLOAD_TIMEOUT: '120'
  # hf_xet 装了就会走 Xet CAS 通道，但 CAS 域名（cas-server.xethub.hf.co）
  # 不走 HF_ENDPOINT，镜像站不代理它。实测下 3.5 GB 的 science.jsonl 只收到
  # 1.5 GB 就报 "File size mismatch"，直接炸掉训练。关掉后回退成普通 HTTP
  # GET，走 hf-mirror，带 expected_size 校验。
  HF_HUB_DISABLE_XET: '1'
  # 映射表里 bailing_hybrid 指向 tiny，这里单独指定 flash，不改 model_map.tsv。
  FLASH_REPO: 'inclusionAI/Ling-3.0-flash'

jobs:
  lf-env:
    name: lf-env (${{ inputs.model_type }}/${{ inputs.framework }} on ${{ inputs.runner_label }})
    runs-on: ${{ inputs.runner_label }}

    # Image pull (~30 min) + torchturbo (~1 min) + deps (~20 min) + a full-epoch SFT.
    # The last one dominates and is unbounded, hence the generous ceiling; step ⑤ carries
    # its own limit so a hung training run cannot eat the whole budget.
    timeout-minutes: 300

    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ secrets.SWR_USERNAME }}
        password: ${{ secrets.SWR_PASSWORD }}
      options: --user root

    defaults:
      run:
        shell: bash

    steps:
      - name: ① Checkout
        uses: actions/checkout@v4

      - name: ② 先行校验 + model_type → 启动脚本映射
        id: resolve
        env:
          MODEL_TYPE: ${{ inputs.model_type }}
          FRAMEWORK: ${{ inputs.framework }}
        run: |
          set -uo pipefail
          MAP=.github/workflows/model_map.tsv
          test -f "$MAP" || { echo "::error::missing $MAP"; exit 1; }

          # 先确认这个 model_type 真的能跑，再去拉镜像装依赖；否则白等几十分钟。
          # 列：1=model_type  2=run_dir  3=lf 脚本  4=swift 脚本  5=hf_repo
          ROW=$(awk -v m="$MODEL_TYPE" '$1==m && $0 !~ /^\s*#/ {print; exit}' "$MAP")
          if [ -z "$ROW" ]; then
            echo "::error::model_type '$MODEL_TYPE' 不在 $MAP 里；可选项："
            awk '$0 !~ /^\s*#/ && NF {printf "  %s\n", $1}' "$MAP"
            exit 1
          fi
          set -- $ROW
          RUN_DIR=$2
          case "$FRAMEWORK" in
            lf)    LAUNCHERS=$3 ;;
            swift) LAUNCHERS=$4 ;;
            *)     echo "::error::未知 framework '$FRAMEWORK'（只支持 lf / swift）"; exit 1 ;;
          esac
          REPO=${5:--}
          echo "model_type=$MODEL_TYPE framework=$FRAMEWORK run_dir=$RUN_DIR launchers=$LAUNCHERS repo=$REPO"

          # 1) run_dir 必须真实存在
          if [ "$RUN_DIR" = "-" ] || [ ! -d "scripts/runs/$RUN_DIR" ]; then
            echo "::error::$MODEL_TYPE 没有可用的 run_dir：scripts/runs/$RUN_DIR"
            ls -1 scripts/runs | sed 's/^/             /'
            exit 1
          fi

          # 2) 当前 framework 的 launchers 非空，且至少一个文件真实存在
          if [ "$LAUNCHERS" = "-" ] || [ -z "$LAUNCHERS" ]; then
            echo "::error::$MODEL_TYPE 在 $FRAMEWORK 下没有启动脚本（第 3/4 列为 '-'）"
            echo "            同一行：run_dir=$RUN_DIR lf=[$3] swift=[$4]"
            exit 1
          fi
          TRAIN=""
          for l in $(echo "$LAUNCHERS" | tr ',' ' '); do
            [ -f "scripts/runs/$RUN_DIR/$l" ] && { TRAIN="scripts/runs/$RUN_DIR/$l"; break; }
          done
          if [ -z "$TRAIN" ]; then
            echo "::error::$MODEL_TYPE/$FRAMEWORK 的 launchers 一个都不存在：$LAUNCHERS"
            ls -1 "scripts/runs/$RUN_DIR" | sed 's/^/             /'
            exit 1
          fi

          # 3) 注册表漂移：映射表必须覆盖代码里 @register_model 的全部名字。
          #    只用标准库，不依赖三方包（这张表要在装依赖之前就能读）。
          #    sys.exit(1) 必须真正终止 step —— 下面还有别的命令。
          python3 - "$MAP" <<'PY' || exit 1
          import glob, re, sys

          registered = set()
          for path in glob.glob("src/torchturbo/models/*/model.py"):
              src = open(path, encoding="utf-8").read()
              registered.update(re.findall(r'@register_model\(\s*["\']([^"\']+)["\']', src))

          mapped = set()
          for line in open(sys.argv[1], encoding="utf-8"):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              mapped.add(line.split()[0])

          missing = sorted(registered - mapped)
          unknown = sorted(mapped - registered)
          print(f"registered={len(registered)} mapped={len(mapped)}")
          if missing:
              print("::error::注册了但映射表未收录:", ", ".join(missing))
          if unknown:
              print("::warning::映射表里有未注册的名字:", ", ".join(unknown))
          sys.exit(1 if missing else 0)
          PY

          # 4) 依赖安装脚本：优先按框架选，退回到通用的 install_lf_deps.sh
          INSTALL=""
          for c in "scripts/runs/$RUN_DIR/install_${FRAMEWORK}_deps.sh" \
                   "scripts/runs/$RUN_DIR/install_lf_deps.sh"; do
            [ -f "$c" ] && { INSTALL="$c"; break; }
          done
          if [ -z "$INSTALL" ]; then
            echo "::error::$MODEL_TYPE 没有可用的依赖安装脚本（scripts/runs/$RUN_DIR/install_*_deps.sh 都不存在）"
            ls -1 "scripts/runs/$RUN_DIR" | sed 's/^/             /'
            exit 1
          fi

          echo "校验通过：train=$TRAIN install=$INSTALL"

          printf 'run_dir=%s\ninstall_script=%s\ntrain_script=%s\nhf_repo=%s\n' \
            "$RUN_DIR" "$INSTALL" "$TRAIN" "$REPO" >> "$GITHUB_OUTPUT"

      - name: ③ Install torchturbo
        id: torchturbo
        run: |
          set -uo pipefail

          # ARG PIP_INDEX_URL 不固化进镜像，pod 里实际用的源取决于 pip 配置/环境变量。
          python -m pip config list 2>/dev/null || true
          env | grep -iE '^(PIP_|.*_PROXY=)' || true

          START=$(date +%s)
          # 不加 -q：Collecting/Downloading 行是“到底有没有重新下载”的唯一直接证据。
          # --no-build-isolation：否则 pip 会为了跑 setuptools 额外下一个完整 torch。
          python -m pip install --no-cache-dir --no-build-isolation -e ".[dev]" 2>&1 | tee /tmp/turbo.log
          RC=${PIPESTATUS[0]}
          ELAPSED=$(( $(date +%s) - START ))

          grep -E '^(Collecting|Downloading|Using cached|Installing collected|Requirement already satisfied)' \
            /tmp/turbo.log | sed 's/ (from .*//' || true

          printf 'elapsed=%s\nrc=%s\n' "$ELAPSED" "$RC" >> "$GITHUB_OUTPUT"
          echo "::notice::torchturbo install took ${ELAPSED}s (rc=${RC})"
          exit "$RC"

      - name: ④ Install deps (${{ inputs.model_type }} / ${{ inputs.framework }})
        id: lf_deps
        env:
          INSTALL_SCRIPT: ${{ steps.resolve.outputs.install_script }}
        run: |
          set -uo pipefail
          test -f "$INSTALL_SCRIPT" || { echo "::error::missing $INSTALL_SCRIPT"; exit 1; }
          cat "$INSTALL_SCRIPT"

          START=$(date +%s)
          bash "$INSTALL_SCRIPT" 2>&1 | tee /tmp/lf-deps.log
          RC=${PIPESTATUS[0]}
          ELAPSED=$(( $(date +%s) - START ))

          printf 'elapsed=%s\nrc=%s\n' "$ELAPSED" "$RC" >> "$GITHUB_OUTPUT"
          echo "::notice::${INSTALL_SCRIPT} took ${ELAPSED}s (rc=${RC})"

          # 装完实际落了什么版本。故意放在计时区间外，且永不致命。
          python - <<'PROBE' > /tmp/after.txt 2>&1 || true
          import importlib
          names = "torch torch_npu numpy triton fla fla_npu transformers llamafactory deepspeed omegaconf pytest".split()
          for n in names:
              try:
                  print(f"{n}={getattr(importlib.import_module(n), '__version__', 'unknown')}")
              except Exception as e:
                  print(f"{n}=MISSING({type(e).__name__})")
          PROBE
          cat /tmp/after.txt

          exit "$RC"

      # 校验已在 ② 保证 train_script 存在，所以这里不再用 if 跳过，直接往下执行。
      - name: ⑤ Train (${{ inputs.model_type }} / ${{ inputs.framework }})
        id: train
        timeout-minutes: 240
        env:
          MODEL_HINT: ${{ inputs.train_model_path }}
          HF_REPO: ${{ steps.resolve.outputs.hf_repo }}
          SP_IN: ${{ inputs.train_sp_size }}
          EP_IN: ${{ inputs.train_ep_size }}
          SEQ_LEN: ${{ inputs.train_seq_len }}
          FINETUNING_TYPE: ${{ inputs.train_finetuning_type }}
          RUNNER_LABEL: ${{ inputs.runner_label }}
          MODEL_TYPE: ${{ inputs.model_type }}
          TRAIN_SCRIPT: ${{ steps.resolve.outputs.train_script }}
          DATASET_IN: ${{ inputs.train_dataset }}
          LAYERS_IN: ${{ inputs.train_layers }}
        run: |
          set -uo pipefail
          set +e

          # 卡数直接取 runner 标签的尾缀（-2 / -4 / -8），避免与 yaml 里的 sp_size 不匹配。
          NPUS_PER_NODE="${RUNNER_LABEL##*-}"
          case "$NPUS_PER_NODE" in
            ''|*[!0-9]*) NPUS_PER_NODE=2 ;;
          esac
          export NPUS_PER_NODE
          echo "cards=${NPUS_PER_NODE} (from ${RUNNER_LABEL})"

          # --- 卷身份：前几次 run 落到过两份不同的 SFS，命中与否取决于它 ---
          uuid=$(findmnt -nT /root/.cache -o SOURCE 2>/dev/null | sed -n '1p' | cut -d. -f1)
          echo "sfs_uuid=${uuid:-?}"

          # --- 模型目录探测 ---------------------------------------------------
          # 目录 inode 大小说明不了任何问题（实测 22~499 字节），hub 形态的
          # snapshots/<sha>/ 里还全是软链，所以统一用「config.json + safetensors 总量」
          # 判定，并顺带把 bytes/shards 带出来复用。-L 必须加，否则 du 只数软链本身。
          probe() {
            [ -f "$1/config.json" ] || return 1
            _b=$(timeout 180 du -sbL "$1" 2>/dev/null | awk '{print $1}')
            _s=$(timeout 120 find "$1" -maxdepth 2 -name '*.safetensors' 2>/dev/null | wc -l)
            [ "${_b:-0}" -gt 3000000000 ] 2>/dev/null && [ "${_s:-0}" -gt 0 ] || return 1
            echo "${_b} ${_s}"
          }

          # --- 模型：flash 裁剪下载 -------------------------------------
          # 先把层数定下来，后面算 shard 清单和派生配置都要用。
          LAYERS="${LAYERS_IN:-6}"
          case "$LAYERS" in ''|*[!0-9]*) LAYERS=6 ;; esac
          if [ -z "$MODEL_HINT" ] && [ "$LAYERS" = 0 ] ; then
            echo "::error::train_layers=0 表示不裁剪，必须同时给 train_model_path"
            exit 1
          fi

          MODEL=""; BYTES=0; SHARDS=0; HIT=no

          if [ -n "$MODEL_HINT" ] ; then
            MODEL="$MODEL_HINT"
            r=$(probe "$MODEL") || { echo "::error::train_model_path 不完整：$MODEL"; exit 1; }
            BYTES=${r% *}; SHARDS=${r#* }; HIT=yes; LAYERS=0
            echo "use explicit model: $MODEL"
          else
            MODEL="/root/.cache/models/$(basename "$FLASH_REPO")-L${LAYERS}"
            # 标记文件记录这次裁剪的口径；层数改了就得重下，不能复用旧目录。
            MARK="$MODEL/.trim"
            if [ -f "$MARK" ] && [ "$(cat "$MARK")" = "repo=${FLASH_REPO} layers=${LAYERS}" ] \
               && r=$(probe "$MODEL") ; then
              BYTES=${r% *}; SHARDS=${r#* }; HIT=yes
              echo "HIT  $MODEL  bytes=$BYTES shards=$SHARDS"
            fi
          fi

          if [ "$HIT" != yes ] ; then
            echo "::notice::model MISS on sfs=${uuid:-?}; trimming $FLASH_REPO to $LAYERS layers"
            rm -f "$MARK"
            cat > /tmp/flash_trim.py <<'PY'
          import json
          import os
          from pathlib import Path

          from huggingface_hub import snapshot_download

          repo = os.environ["REPO_ID"]
          dst = Path(os.environ["MODEL_DIR"])
          layers = int(os.environ["LAYERS"])
          dst.mkdir(parents=True, exist_ok=True)

          # ① 小文件：配置、tokenizer、trust_remote_code 要用的 .py。
          #    index.json 决定第 ② 步下哪几个 shard。
          snapshot_download(
              repo_id=repo,
              local_dir=dst,
              allow_patterns=[
                  "config.json",
                  "model.safetensors.index.json",
                  "generation_config.json",
                  "special_tokens_map.json",
                  "tokenizer*.json",
                  "*.py",
              ],
          )
          weight_map = json.loads(
              (dst / "model.safetensors.index.json").read_text()
          )["weight_map"]

          # ② 按层算 shard 清单。非层张量（word_embeddings / norm / lm_head）必带；
          #    层号 >= layers 的张量全部跳过，它们所在的 shard 也就不下。
          need = set()
          for name, shard in weight_map.items():
              if name.startswith("model.layers.") and int(name.split(".")[2]) >= layers:
                  continue
              need.add(shard)
          all_shards = set(weight_map.values())
          print(f"{layers} layers -> need {len(need)}/{len(all_shards)} shards", flush=True)
          for s in sorted(need):
              print("  ", s, flush=True)

          snapshot_download(repo_id=repo, local_dir=dst, allow_patterns=sorted(need))

          # ③ 裁层。建几层完全由 num_hidden_layers 决定（modeling_*.py:1324）。
          #    MTP 层建在 layers[num_hidden_layers]，全量 ckpt 里是 layers[42]，
          #    裁完编号对不上，只能关掉；对应的 mtp.enabled 在派生配置里置 false。
          cfg_path = dst / "config.json"
          cfg = json.loads(cfg_path.read_text())
          cfg["num_hidden_layers"] = layers
          cfg["num_nextn_predict_layers"] = 0
          cfg_path.write_text(json.dumps(cfg, indent=2) + "\n")
          print(f"config: num_hidden_layers={layers} num_nextn_predict_layers=0",
                flush=True)
          PY
            ok=no
            for attempt in 1 2 3 ; do
              echo "--- download attempt ${attempt}/3 ---"
              if REPO_ID="$FLASH_REPO" MODEL_DIR="$MODEL" LAYERS="$LAYERS" \
                 python /tmp/flash_trim.py ; then
                ok=yes; break
              fi
              W=$(( attempt * 30 ))
              echo "attempt ${attempt} failed; retrying in ${W}s"
              sleep "$W"
            done
            if [ "$ok" != yes ] ; then
              echo "::error::裁剪下载 $FLASH_REPO 连续失败 3 次（镜像侧 5xx 时重跑即可）"
              exit 1
            fi
            printf 'repo=%s layers=%s\n' "$FLASH_REPO" "$LAYERS" > "$MARK"
            r=$(probe "$MODEL") || { echo "::error::model incomplete at $MODEL"; exit 1; }
            BYTES=${r% *}; SHARDS=${r#* }
          fi
          export LAYERS
          echo "model: $MODEL  bytes=$BYTES shards=$SHARDS  layers=${LAYERS}"

          # --- 并行策略 ----------------------------------------------
          # 仓库里的 yaml（bailing_v3/sft.yaml 是 sp2/ep8，要 16 卡）不能改，所以这里
          # 按实际卡数收敛成一份派生配置写到 /tmp，再用 TT_CONFIG 指过去：其余字段
          # （mtp / z_loss / mf...）原样保留。
          test -f "$TRAIN_SCRIPT" || { echo "::error::missing $TRAIN_SCRIPT"; exit 1; }
          D=$(dirname "$TRAIN_SCRIPT")
          # 取脚本里 TT_CONFIG 的默认表达式，把 $(dirname "$0") / ${SCRIPT_DIR} 展开。
          SRC=$(sed -n 's/^TT_CONFIG=\${TT_CONFIG:-\(.*\)}$/\1/p' "$TRAIN_SCRIPT" | head -1)
          SRC=$(printf '%s' "$SRC" | sed -e "s|\$(dirname \"\$0\")|$D|g" \
                                        -e "s|\${SCRIPT_DIR}|$D|g" -e 's|^"||; s|"$||')
          [ -f "$SRC" ] || SRC=""
          [ -n "$SRC" ] || echo "::warning::$TRAIN_SCRIPT 没有配套 yaml，将生成最小配置"

          # 读 yaml 里的 sp/ep 作基准（缺省 1/1）。
          read -r SP EP < <(python3 - "$SRC" <<'PY' 2>/dev/null || echo '1 1'
          import sys, yaml
          pp = ((yaml.safe_load(open(sys.argv[1], encoding="utf-8")) or {})
                  .get("engine_config", {}) or {}).get("parallel_plan", {}) or {}
          print(pp.get("sp_size", 1), pp.get("ep_size", 1))
          PY
          )
          W=$NPUS_PER_NODE
          [ "$SP_IN" = "auto" ] || SP=$(( SP_IN + 0 ))
          [ "$EP_IN" = "auto" ] || EP=$(( EP_IN + 0 ))
          OLD="sp=${SP} ep=${EP}"
          # sp 必须整除 world；ep 与 sp 不能超过 world 且必须整除 world。
          while [ "$SP" -gt 1 ] && [ $(( W % SP )) -ne 0 ]; do SP=$(( SP / 2 )); done
          [ "$SP" -ge 1 ] 2>/dev/null || SP=1
          MAX_EP=$(( W / SP )); [ "$MAX_EP" -lt 1 ] && MAX_EP=1
          [ "$EP" -gt "$MAX_EP" ] && EP=$MAX_EP
          while [ "$EP" -gt 1 ] && [ $(( W % EP )) -ne 0 ]; do EP=$(( EP / 2 )); done
          [ "$EP" -ge 1 ] 2>/dev/null || EP=1

          TT=""
          if [ -n "$SRC" ] ; then
            TT="/tmp/tt_${MODEL_TYPE}.yaml"
            python3 - "$SRC" "$TT" "$SP" "$EP" <<'PY'
          import os
          import sys

          import yaml

          src, dst, sp, ep = sys.argv[1], sys.argv[2], int(sys.argv[3]), int(sys.argv[4])
          doc = yaml.safe_load(open(src, encoding="utf-8")) or {}
          eng = doc.setdefault("engine_config", {}) or {}
          pp = eng.setdefault("parallel_plan", {}) or {}
          pp["sp_size"], pp["ep_size"] = sp, ep
          # 裁层后 MTP 层不存在（config 里 num_nextn_predict_layers=0），
          # 这里必须一起关掉，否则 backend 还会去取 mtp_logits。
          if int(os.environ.get("LAYERS", "0") or 0) > 0:
              mtp = eng.setdefault("mtp", {}) or {}
              mtp["enabled"] = False
              eng["mtp"] = mtp
          with open(dst, "w", encoding="utf-8") as f:
              yaml.safe_dump(doc, f, sort_keys=False, allow_unicode=True)
          PY
          else
            TT="/tmp/tt_${MODEL_TYPE}.yaml"
            { printf 'engine_config:\n  parallel_plan:\n    sp_size: %s\n    ep_size: %s\n' "$SP" "$EP"
              if [ "${LAYERS:-0}" -gt 0 ] ; then printf '  mtp:\n    enabled: false\n' ; fi
            } > "$TT"
          fi
          echo "train script: $TRAIN_SCRIPT"
          echo "cards=$W  parallel: ${OLD} -> sp=$SP ep=$EP  (tt_config=$TT)"

          # 启动脚本都是 DATASET=${DATASET:-<各自的默认>}，所以从外面指定即可，
          # 不用改 scripts/runs 下的上游文件。
          export DATASET="$DATASET_IN"
          export MODEL NPUS_PER_NODE SEQ_LEN FINETUNING_TYPE TT_CONFIG="$TT"
          # 只读地复用启动脚本里的同一套表达式，仅用于下面的盘监控。
          OUT="${OUTPUT_DIR:-/tmp/tblf-sft/$(basename "$MODEL")}"
          echo "dataset=$DATASET  output=$OUT"

          # torchrun 会把子进程的 stderr 重定向并按 [rankN]: 前缀转发，子进程退出时
          # 末尾几行常常被丢掉 —— 上次丢掉的正好是异常类型和消息，只留下 traceback
          # 的帧和 ^ 光标。用 sitecustomize 在每个 python 进程里装 excepthook，
          # 把完整 traceback 写到文件，之后无论怎么截断都还能拿到。
          #
          # 顺便解决训练后的落盘问题。上次（run 41961230370）187 步跑完、HF 导出和
          # native 都写完之后才炸在 `_save_checkpoint` 里：
          #   if not self.args.save_only_model:
          #       self._save_optimizer_and_scheduler(...)      # trainer.py:3068
          # AdamW 的 exp_avg/exp_avg_sq 是 fp32 的 2 × 4 × 7.9B ≈ 63 GB，/tmp 与 /
          # 是同一个 50 GB overlay，装不下。
          #
          # 这里把 _save_checkpoint 整个改成 no-op。裁到 6 层后模型是 26.7 GB
          # （13.35 B 参数，按 safetensors header 实测），而流程会写两份：
          # 训练结束时的 checkpoint-187/huggingface 和 run_sft 里随后的
          # trainer.save_model()，内容完全相同，两份就是 53 GB，超了 50 GB。
          # 关掉前者，只留后者，落盘降到 ~27 GB。
          #
          # inject 点选在 _save_checkpoint 而不是 __init__，就不会触发 trainer 初始化
          # 时对 load_best_model_at_end / FSDP SHARDED_STATE_DICT 的那些兼容性检查。
          # 启动脚本会 export PYTHONPATH=$REPO_ROOT/src:$PYTHONPATH，前缀得以保留。
          mkdir -p /tmp/ttcatch
          cat > /tmp/ttcatch/sitecustomize.py <<'PY'
          import faulthandler
          import importlib.abc
          import os
          import sys
          import traceback

          _path = os.environ.get("TT_TRACEBACK_FILE", "/tmp/tt_traceback.log")


          def _hook(exc_type, exc, tb):
              try:
                  with open(_path, "a", encoding="utf-8") as f:
                      f.write(f"\n===== excepthook pid={os.getpid()} =====\n")
                      traceback.print_exception(exc_type, exc, tb, file=f)
              except Exception:
                  pass
              if sys.__excepthook__ is not None:
                  sys.__excepthook__(exc_type, exc, tb)


          sys.excepthook = _hook
          try:
              faulthandler.enable(open(_path + ".fault", "a"))
          except Exception:
              pass


          def _install(module):
              """中间 checkpoint 全跳过，只留最终 trainer.save_model() 的一份 HF 权重。"""
              # 取刚执行完的模块对象本身：此刻父包 __init__ 还没跑完，
              # `from transformers import Trainer` 可能拿不到属性。
              Trainer = getattr(module, "Trainer", None)
              if Trainer is None:
                  from transformers import Trainer      # pragma: no cover

              if getattr(Trainer, "_tt_skip_ckpt", False):
                  return

              def _save_checkpoint(self, model, trial=None):
                  step = getattr(self.state, "global_step", "?")
                  print(
                      f"[ttcatch] checkpoint at step {step} skipped; "
                      "the final save_model exports the single HF copy",
                      flush=True,
                  )

              Trainer._save_checkpoint = _save_checkpoint
              Trainer._tt_skip_ckpt = True
              print("[ttcatch] checkpoint patch on: final HF export only", flush=True)


          class _After:
              def __init__(self, loader):
                  self._loader = loader

              def create_module(self, spec):
                  return self._loader.create_module(spec)

              def exec_module(self, module):
                  self._loader.exec_module(module)
                  try:
                      _install(module)
                  except Exception as exc:      # 装不上就退回原行为，别弄坏训练
                      print(f"[ttcatch] patch failed: {exc}", flush=True)


          class _Finder(importlib.abc.MetaPathFinder):
              """只在 transformers.trainer 加载完成后动手，避免过早 import。"""

              def find_spec(self, fullname, path=None, target=None):
                  if fullname != "transformers.trainer":
                      return None
                  for finder in sys.meta_path:
                      if finder is self:
                          continue
                      spec = finder.find_spec(fullname, path, target)
                      if spec is not None and spec.loader is not None:
                          spec.loader = _After(spec.loader)
                          return spec
                  return None


          sys.meta_path.insert(0, _Finder())
          PY
          # 不要写成 ":/tmp/ttcatch:$PYTHONPATH" 那种带空段的写法：空段等于把 cwd
          # （仓库根）塞进 sys.path，容易让同名目录抢先被导入。
          export PYTHONPATH="/tmp/ttcatch${PYTHONPATH:+:$PYTHONPATH}"

          START=$(date +%s)
          # 启动脚本里是 `torchrun ... | tee $LOG_FILE`。trainer 异常退出时，它 fork
          # 的数据集子进程（datasets 的 Pool）会变成孤儿继续占着管道写端，tee 永远
          # 等不到 EOF，脚本就不返回 —— run 41954189913 就这样挂了 40+ min。
          # 启动脚本属于上游仓，这里不改它，改成在外面做看门狗。
          #
          # 判定方式：脚本的直接子进程只有 torchrun 和 tee 两个。trainer 一死就只剩
          # tee，而这个状态会一直保持。注意不能按 cmdline 找 trainer —— 池子里的孤儿
          # 是 fork 出来的，命令行和 trainer 完全相同。
          : > /tmp/train.log
          if command -v setsid >/dev/null 2>&1 && command -v pgrep >/dev/null 2>&1 ; then
            setsid bash "$TRAIN_SCRIPT" > /tmp/train.log 2>&1 &
            WATCHDOG=yes
          else
            bash "$TRAIN_SCRIPT" > /tmp/train.log 2>&1 &
            WATCHDOG=no
          fi
          TRAINPID=$!
          tail -f /tmp/train.log &
          TAILPID=$!

          STUCK=0
          while kill -0 "$TRAINPID" 2>/dev/null ; do
            BUSY=0
            for _p in $(pgrep -P "$TRAINPID" 2>/dev/null) ; do
              [ "$(cat /proc/"$_p"/comm 2>/dev/null)" = tee ] || BUSY=$(( BUSY + 1 ))
            done
            if [ "$BUSY" = 0 ] ; then
              STUCK=$(( STUCK + 1 ))          # 连续 15 s 只剩下 tee
            else
              STUCK=0
            fi
            [ "$STUCK" -ge 3 ] && break
            sleep 5
          done
          if [ "$WATCHDOG" = yes ] && kill -0 "$TRAINPID" 2>/dev/null ; then
            echo "::warning::trainer 已退出但 $TRAIN_SCRIPT 被孤儿子进程卡在 tee 上，清理进程组"
            kill -TERM -"$TRAINPID" 2>/dev/null
            sleep 10
            kill -KILL -"$TRAINPID" 2>/dev/null
            wait "$TRAINPID" 2>/dev/null
            RC=1
          else
            wait "$TRAINPID" ; RC=$?
          fi
          sleep 2
          kill "$TAILPID" 2>/dev/null
          wait "$TAILPID" 2>/dev/null
          ELAPSED=$(( $(date +%s) - START ))

          LAST=$(grep -oE "'loss': [0-9.]+" /tmp/train.log | tail -1)
          echo "::notice::train rc=${RC} in ${ELAPSED}s; hit=${HIT}; ${LAST:-no loss logged}"

          # 训练后看盘：ckpt 目录有多大、还剩多少空间、真正写下了哪些子目录。
          # 上次就是在这里才需要这些数字。
          df -h "$OUT" | sed 's/^/  df: /'
          du -sh "$OUT" 2>/dev/null | sed 's/^/  used: /'
          for d in "$OUT"/checkpoint-* ; do
            [ -d "$d" ] || continue
            echo "  ckpt $(basename "$d")"
            du -sh "$d"/* 2>/dev/null | sed 's/^/    /'
          done
          if [ -s /tmp/tt_traceback.log ] ; then
            echo "--- 捕获到的 Python 异常（torchrun 转发时会截断） ---"
            tail -40 /tmp/tt_traceback.log
          fi

          printf 'rc=%s\nelapsed=%s\ncache_hit=%s\nsfs_uuid=%s\nshards=%s\nmodel_size=%s\nsp_size=%s\nep_size=%s\nlayers=%s\noutput_dir=%s\n' \
            "$RC" "$ELAPSED" "$HIT" "${uuid:-?}" "$SHARDS" "$(( BYTES / 1048576 )) MiB" "$SP" "$EP" "$LAYERS" "$OUT" >> "$GITHUB_OUTPUT"
          exit "$RC"


      - name: ⑥ Summary
        if: always()
        env:
          MODEL_TYPE: ${{ inputs.model_type }}
          FRAMEWORK: ${{ inputs.framework }}
          TRAIN_DATASET: ${{ inputs.train_dataset }}
          TRAIN_LAYERS: ${{ steps.train.outputs.layers }}
          RUN_DIR: ${{ steps.resolve.outputs.run_dir }}
          INSTALL_SCRIPT: ${{ steps.resolve.outputs.install_script }}
          RESOLVED_TRAIN: ${{ steps.resolve.outputs.train_script }}
          TORCHTURBO_S: ${{ steps.torchturbo.outputs.elapsed }}
          TORCHTURBO_RC: ${{ steps.torchturbo.outputs.rc }}
          LF_DEPS_S: ${{ steps.lf_deps.outputs.elapsed }}
          LF_DEPS_RC: ${{ steps.lf_deps.outputs.rc }}
          TRAIN_S: ${{ steps.train.outputs.elapsed }}
          TRAIN_RC: ${{ steps.train.outputs.rc }}
          TRAIN_HIT: ${{ steps.train.outputs.cache_hit }}
          TRAIN_SFS: ${{ steps.train.outputs.sfs_uuid }}
          TRAIN_SHARDS: ${{ steps.train.outputs.shards }}
          TRAIN_SIZE: ${{ steps.train.outputs.model_size }}
          TRAIN_SP: ${{ steps.train.outputs.sp_size }}
          TRAIN_EP: ${{ steps.train.outputs.ep_size }}
          TRAIN_OUT: ${{ steps.train.outputs.output_dir }}
        run: |
          set -uo pipefail
          TOTAL=$(( ${TORCHTURBO_S:-0} + ${LF_DEPS_S:-0} + ${TRAIN_S:-0} ))
          fmt() { awk -v s="${1:-0}" 'BEGIN{printf "%d min %02d s", s/60, s%60}'; }

          {
            echo "## ${MODEL_TYPE} / ${FRAMEWORK} on \`${{ inputs.runner_label }}\`"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| image | \`${{ inputs.image }}\` |"
            echo "| run_dir | \`${RUN_DIR}\` |"
            echo "| install / train | \`${INSTALL_SCRIPT}\` / \`${RESOLVED_TRAIN:-<none>}\` |"
            echo "| model cache | **${TRAIN_HIT:-?}** (sfs \`${TRAIN_SFS:-?}\`) |"
            echo "| layers | \`${TRAIN_LAYERS:-0}\` (0 = 不裁剪) |"
            echo "| dataset | \`${TRAIN_DATASET:-?}\` |"
            echo "| shards / size | ${TRAIN_SHARDS:-?} / ${TRAIN_SIZE:-?} |"
            echo "| parallel (sp/ep) | \`${TRAIN_SP:-?}/${TRAIN_EP:-?}\` |"
            echo "| output_dir | \`${TRAIN_OUT:-?}\` |"
            echo ""
            echo "| phase | seconds | human | rc |"
            echo "|---|---|---|---|"
            echo "| ③ torchturbo \`-e .[dev]\` | \`${TORCHTURBO_S:-n/a}\` | $(fmt "${TORCHTURBO_S}") | \`${TORCHTURBO_RC:-n/a}\` |"
            echo "| ④ \`${INSTALL_SCRIPT}\` | \`${LF_DEPS_S:-n/a}\` | $(fmt "${LF_DEPS_S}") | \`${LF_DEPS_RC:-n/a}\` |"
            echo "| ⑤ train | \`${TRAIN_S:-n/a}\` | $(fmt "${TRAIN_S}") | \`${TRAIN_RC:-n/a}\` |"
            echo "| **total** | \`${TOTAL}\` | **$(fmt "${TOTAL}")** | |"
            echo ""
            echo "### model_type → 启动脚本映射（model_type / run_dir / lf / swift / hf_repo）"
            echo ""
            echo '```'
            grep -v '^\s*#' .github/workflows/model_map.tsv 2>/dev/null | sed '/^\s*$/d' || echo "(map missing)"
            echo '```'
            echo ""
            echo "### Versions after install"
            echo ""
            echo '```'
            cat /tmp/after.txt 2>/dev/null || echo "(probe failed)"
            echo '```'
            echo ""
            echo "### 训练尾部"
            echo ""
            echo '```'
            tail -40 /tmp/train.log 2>/dev/null || echo "(no train log)"
            echo '```'
            echo ""
            echo "### Python 异常（excepthook 捕获，torchrun 转发会截断）"
            echo ""
            echo '```'
            tail -60 /tmp/tt_traceback.log 2>/dev/null || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 注解是唯一匿名可读的输出通道，关键数字也放这里。
          echo "::notice title=smoke ${MODEL_TYPE}::sfs=${TRAIN_SFS:-?} cache_hit=${TRAIN_HIT:-?} shards=${TRAIN_SHARDS:-?} size=${TRAIN_SIZE:-?} train_s=${TRAIN_S:-n/a} train_rc=${TRAIN_RC:-n/a}"
          if [ "${TRAIN_RC:-1}" != "0" ]; then
            echo "::error title=train failed::rc=${TRAIN_RC:-n/a}; see the train tail in the job summary"
          fi
