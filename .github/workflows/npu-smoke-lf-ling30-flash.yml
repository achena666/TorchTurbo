name: NPU Smoke (Ling-3.0-flash trimmed)

# Ling-3.0-flash 的实验台。跟 npu-smoke-lf.yml 的唯一差别是模型获取：全量是 255 GB /
# 24 个 shard，8 卡既下不完也训不动，所以这里只取前 N 层。
#
# 为什么裁层是安全的：加载器遍历 model.named_parameters() 反查 index.json 拿文件名
# （checkpoint/weight_loader.py:317），模型只建了前 N 层，第 N 层之后的 shard 不会进
# files_needed。但 index.json 本身必须一起裁 —— BaseWeightConverter 构造时的
# CheckpointInfo 会把 weight_map 里每个文件都 open 一遍读 header，跟建了几层无关。
# 两件事都在 scripts/ci/flash_trim.py 里做。
#
# 为什么默认 6 层：flash 的 layer_group_size=6、first_k_dense_replace=2，6 层恰好是
# 一个完整周期 —— L0,L1 是 dense+KDA，L2~L5 是 MoE（L5 是那 1 层 MLA）。少一层就漏
# 掉 MLA，多一层只是重复。
#
# 注意 trim_layers=0 表示不裁剪，会真的去下 255 GB；这里默认 6。

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'Runner label (must match Settings -> Actions -> Runners)'
        required: true
        default: 'linux-aarch64-a3-800i-8'
        type: choice
        options:
          - linux-aarch64-a3-800i-2
          - linux-aarch64-a3-800i-4
          - linux-aarch64-a3-800i-8
          - linux-aarch64-a3-800i-16
      image:
        description: 'L1 base image; pin with repo@sha256:... for strict reproducibility'
        required: true
        default: 'swr.cn-north-12.myhuaweicloud.com/ascend/torchturbo_npu:base-latest'
      model_type:
        description: '模型：@register_model 的名字，映射表见 .github/workflows/model_map.tsv'
        required: true
        default: 'bailing_hybrid'
        type: choice
        options:
          - bailing_hybrid
          - qwen3_5
          - qwen3_5_moe
          - qwen3_5_moe_text
          - qwen4_exp
      framework:
        description: '训练框架；决定用 lf_* 还是 swift_* 启动脚本'
        required: true
        default: 'lf'
        type: choice
        options:
          - lf
          - swift
      train_layers:
        description: '只保留前 N 层；0 = 不裁剪（会下载完整 255 GB，慎用）'
        required: true
        default: 6
        type: number
      train_model_path:
        description: '可选：显式指定模型目录；留空则裁剪下载 inclusionAI/Ling-3.0-flash'
        required: false
        default: ''
        type: string
      train_seq_len:
        description: 'cutoff_len'
        required: true
        default: '1024'
        type: string
      train_dataset:
        description: '数据集名（必须是 dataset/dataset_info.json 里的 key）'
        required: true
        default: 'gsm8k'
        type: string
      train_finetuning_type:
        description: '微调方式'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - lora
      train_sp_size:
        description: '序列并行度；“auto” = 按卡数收敛（不整除则减半）'
        required: false
        default: 'auto'
        type: string
      train_ep_size:
        description: '专家并行度；“auto” = min(yaml 值, 卡数/sp)'
        required: false
        default: 'auto'
        type: string
      diag:
        description: '装 scripts/ci/diag（异常捕获 + NaN 定位）'
        required: false
        default: true
        type: boolean

concurrency:
  group: npu-smoke-lf-flash-${{ inputs.runner_label }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  flash:
    name: flash-l${{ inputs.train_layers }} (${{ inputs.model_type }}/${{ inputs.framework }} on ${{ inputs.runner_label }})
    uses: ./.github/workflows/ci-npu-sft.yml
    with:
      runner_label: ${{ inputs.runner_label }}
      image: ${{ inputs.image }}
      model_type: ${{ inputs.model_type }}
      framework: ${{ inputs.framework }}
      train_model_path: ${{ inputs.train_model_path }}
      # 映射表把 bailing_hybrid 指向 tiny，这里显式改成 flash。
      hf_repo_override: 'inclusionAI/Ling-3.0-flash'
      trim_layers: ${{ inputs.train_layers }}
      train_seq_len: ${{ inputs.train_seq_len }}
      train_dataset: ${{ inputs.train_dataset }}
      train_finetuning_type: ${{ inputs.train_finetuning_type }}
      train_sp_size: ${{ inputs.train_sp_size }}
      train_ep_size: ${{ inputs.train_ep_size }}
      diag: ${{ inputs.diag }}
    secrets:
      SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
      SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
