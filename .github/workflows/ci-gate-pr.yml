name: CI · PR 门禁

# PR 只留一个 required check：gate。
# 三条泳道并行，谁该跑由改动路径决定：
#
#   L0 静态     语法 / workflow 解析 / 映射表漂移    永远跑，几十秒
#   L1 CPU      affected 选中的用例（或全量分片）    gh 托管 arm64，裸机
#   L2a NPU     需要 torch_npu 的那批用例            只有碰了 ops / 镜像 / 依赖才起
#   L2b E2E     一个族内小模型跑一步                 只有路径命中才起
#
# 时间不追求极限（目标 25 min / 告警 35 min / 硬上限 45 min），
# 但**跳过必须带原因**：L2 没跑却没记录原因 -> gate 判红，
# 否则「慢慢把 L2 关掉」会被当成正常。

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      force_all:
        description: '按全量跑（等同打 ci:full 标签）'
        required: false
        default: false
        type: boolean

# 新 push 取消旧 run：E2E 最贵，旧结果已经没有意义。
concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read          # gate 的计时步骤要读 run 的 created_at / run_started_at

jobs:
  # ------------------------------------------------------------------ 选择
  select:
    name: 选择（select）
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.pick.outputs.mode }}
      npu: ${{ steps.pick.outputs.npu }}
      e2e: ${{ steps.pick.outputs.e2e }}
      test_files: ${{ steps.pick.outputs.test_files }}
      shard_list: ${{ steps.pick.outputs.shard_list }}
      ci_changed: ${{ steps.pick.outputs.ci_changed }}
      docker_changed: ${{ steps.pick.outputs.docker_changed }}
      image: ${{ steps.image.outputs.image }}
      summary: ${{ steps.pick.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # merge-base 需要历史

      - name: 算改动 + 选测试
        id: pick
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          FORCE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.force_all }}
        run: |
          set -uo pipefail

          # 标签语义只在这里出现一次，别散到各个 job 里。
          EXTRA=()
          case ",${LABELS}," in
            *,ci:full,*)     EXTRA+=(--force-all --e2e-all) ;;
            *,ci:e2e,*)      EXTRA+=(--e2e-force) ;;
            *,ci:skip-npu,*) EXTRA+=(--no-npu) ;;
          esac
          [ "${FORCE_INPUT}" = "true" ] && EXTRA+=(--force-all --e2e-all)

          # --changed-from git 自己算 merge-base diff；git 挂了会给空列表，
          # select() 把空列表当成「信息不足」直接全量（fail-open）。
          python3 scripts/ci/affected.py --changed-from git \
            --dump-changed /tmp/changed.txt \
            "${EXTRA[@]}" --explain --output /tmp/sel.json --github-output "$GITHUB_OUTPUT"

          echo "改动 $(wc -l < /tmp/changed.txt) 个文件"
          head -40 /tmp/changed.txt

          # L0 的两个 lint 只在相关文件变了才跑：它们各需要下载一次二进制 /
          # 拉一次镜像，日常 PR 不值得花这个时间。
          if grep -qE '^\.github/|^scripts/ci/' /tmp/changed.txt; then
            echo "ci_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "ci_changed=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^docker/npu/' /tmp/changed.txt; then
            echo "docker_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker_changed=false" >> "$GITHUB_OUTPUT"
          fi

          # 选择器自己也要被门禁：算法退化会静默少跑用例。
          python3 scripts/ci/affected.py --self-test

      # 镜像引用不写死在 workflow 里：由 image CI 每晚产出并发布成 artifact，
      # 这里读最新一份。用 GITHUB_TOKEN 的 actions:read 就够，
      # 不需要 PAT —— `gh variable set` 那条路对 GITHUB_TOKEN 是 403。
      # 镜像先用固定链接。nightly 产出的 base-image-ref artifact 解析链路已经就绪
      # （ci-image.yml 仍在发布），但这里**暂不消费** —— 「PR 悄悄换了一个镜像」
      # 是最难排查的一类问题，先把变量减到零。
      # 需要临时切换时设仓库变量 BASE_IMAGE_TAG，它优先于默认链接。
      - name: 解析镜像引用
        id: image
        env:
          OVERRIDE: ${{ vars.BASE_IMAGE_TAG }}
        run: |
          set -uo pipefail
          REF=$(python3 scripts/ci/image.py resolve \
            --override "$OVERRIDE" \
            --fallback 'swr.cn-north-12.myhuaweicloud.com/ascend/torchturbo_npu:base-latest')
          echo "image=$REF" >> "$GITHUB_OUTPUT"
          echo "镜像：$REF"
          {
            echo "## 选择结果"
            echo ""
            echo '| 项 | 值 |'
            echo '|---|---|'
            echo "| mode | \`${{ steps.pick.outputs.mode }}\` |"
            echo "| NPU | \`${{ steps.pick.outputs.npu }}\` |"
            echo "| E2E | \`${{ steps.pick.outputs.e2e }}\` |"
            echo "| 分片 | \`${{ steps.pick.outputs.shard_list }}\` |"
            echo "| 镜像 | \`$REF\` |"
            echo "| 摘要 | \`${{ steps.pick.outputs.summary }}\` |"
            echo ""
            echo "<details><summary>改动文件</summary>"
            echo ""
            echo '```'
            head -100 /tmp/changed.txt || true
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ L0
  l0:
    name: L0 静态检查
    needs: select
    if: always()
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 语法 / workflow / 映射表
        run: |
          set -uo pipefail
          python -m pip install --quiet pyyaml
          python3 scripts/ci/check_static.py

      # workflow 是近 300 次提交里改动最频繁的文件，写错了只能等下次跑起来才发现。
      - name: actionlint（只在 .github/ 或 scripts/ci/ 变更时）
        if: ${{ needs.select.outputs.ci_changed == 'true' }}
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      # Dockerfile_aarch64 是除 workflow 外最热的非测试文件（9 次），
      # 而 image CI 一次 4~5 h，语法错发现得太晚。
      - name: hadolint（只在 docker/npu/ 变更时）
        if: ${{ needs.select.outputs.docker_changed == 'true' }}
        run: docker run --rm -i hadolint/hadolint < docker/npu/Dockerfile_aarch64

  # ------------------------------------------------------------------ L1
  l1:
    name: L1 CPU（${{ matrix.shard }}）
    needs: select
    if: needs.select.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shard_list) }}
    uses: ./.github/workflows/ci-pytest.yml
    with:
      mode: cpu
      use_container: false
      runner_label: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
      test_files: ${{ needs.select.outputs.test_files }}
      shard: ${{ matrix.shard }}
      timeout_minutes: 40

  # ------------------------------------------------------------------ L2a
  l2a:
    name: L2a NPU 特性
    needs: select
    # fork PR 不起 L2：secrets 不给 fork，而「把 secrets 递到 fork 的代码上」
    # 等于把 RCE 送人（pull_request_target 就是这么出事的，已明确禁用）。
    # 要求 maintainer 把 commit 推进本仓分支再跑，见 docs/ci/README.md。
    if: |
      needs.select.result == 'success' && needs.select.outputs.npu == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/ci-pytest.yml
    with:
      mode: npu
      use_container: true
      image: ${{ needs.select.outputs.image }}
      runner_label: ${{ vars.CI_NPU_RUNNER || 'linux-aarch64-a3-800i-2' }}
      # NPU 泳道跑全量：这些文件本来就少（十来份），选中的子集没意义。
      test_files: '[]'
      timeout_minutes: 40
    secrets:
      SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
      SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}

  # ------------------------------------------------------------------ L2b
  l2b:
    name: L2b E2E（${{ matrix.profile.model_type }}）
    needs: select
    if: |
      needs.select.result == 'success' && needs.select.outputs.e2e != '[]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      # 串行：NPU 池的显存是共享的，并行 2 个的真实墙钟比串行更差。
      max-parallel: 1
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.select.outputs.e2e) }}
    uses: ./.github/workflows/ci-train.yml
    with:
      runner_label: ${{ vars.CI_E2E_RUNNER || 'linux-aarch64-a3-800i-8' }}
      image: ${{ needs.select.outputs.image }}
      model_type: ${{ matrix.profile.model_type }}
      framework: lf
      trim_layers: ${{ matrix.profile.layers }}
      train_seq_len: '1024'
      train_dataset: 'gsm8k'
      train_finetuning_type: 'full'
      timeout_minutes: 45
      train_timeout_minutes: 10
      fetch_timeout_seconds: 600
    secrets:
      SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
      SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}

  # ------------------------------------------------------------------ gate
  # ------------------------------------------------------------------ gate
  # 唯一的 required check。判定逻辑在 scripts/ci/gate.py ——
  # 与 ci-full 共用一份，否则「fork PR 的 L2 算不算合法跳过」这种规则
  # 会慢慢在两个文件里分叉。
  gate:
    name: gate
    needs: [select, l0, l1, l2a, l2b]
    if: always()
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 10
    steps:
      # 排队与执行分开报：只看总和无法区分「该扩容」和「该优化步骤」。
      - name: 计时
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/gate.py timing

      - name: 判定
        env:
          R_SEL: ${{ needs.select.result }}
          R_L0: ${{ needs.l0.result }}
          R_L1: ${{ needs.l1.result }}
          R_L2A: ${{ needs.l2a.result }}
          R_L2B: ${{ needs.l2b.result }}
          WANT_NPU: ${{ needs.select.outputs.npu }}
          WANT_E2E: ${{ needs.select.outputs.e2e }}
          SKIP_REASON: ${{ needs.l2b.outputs.skip_reason }}
          STRICT: ${{ contains(github.event.pull_request.labels.*.name, 'ci:e2e:strict') }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          SUMMARY: ${{ needs.select.outputs.summary }}
        run: python3 scripts/ci/gate.py judge --mode pr
