name: CI · PR 门禁

# PR 只留一个 required check：gate。
#
#   计划层（0 卡，同一个 runner）
#     Lint 静态   语法 / workflow 解析 / 映射表漂移
#     select      算改动 → 出计划（泳道开关 + 文件清单）
#
#   三条泳道（并行，各自 needs: select）
#     cpu-unit-tests   affected 选中的用例（或全量分片）  gh 托管 arm64，裸机
#     npu-unit-tests   需要 torch_npu 的那批用例           只有碰了 ops / 镜像 / 依赖才起
#     npu-model-tests  一个族内小模型跑一步                只有路径命中才起
#
# 时间不追求极限（目标 25 min / 告警 35 min / 硬上限 45 min），
# 但**跳过必须带原因**：NPU 泳道没跑却没记录原因 -> gate 判红，
# 否则「慢慢把 NPU 关掉」会被当成正常。

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      force_all:
        description: '按全量跑（等同打 ci:full 标签）'
        required: false
        default: false
        type: boolean

# 新 push 取消旧 run：E2E 最贵，旧结果已经没有意义。
concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read          # gate 的计时步骤要读 run 的 created_at / run_started_at

jobs:
  # ------------------------------------------- 静态检查 + 选择（同一个 job）
  # 两者**必须共用一个 runner**：
  #   · 它们本来就严格串行（静态没过就不该算计划），拆成两个 job 只是白占一个
  #     名额，还要多一次 checkout（而且这次是 fetch-depth: 0 的全量拉取）；
  #   · 合在一起后「静态没过就不算计划」是 step 的天然语义 —— 前一 step 失败，
  #     后面的直接不执行，既不需要 needs 也不需要 if。
  # 代价：job 红了只看 R_SEL 分不清倒在哪一步，所以最后一步（always）把
  # stage 写进输出，gate 靠它决定摘要该写「静态未通过」还是「计划未算出」。
  select:
    name: Lint_Select
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 20             # 原 15 + 10 的上限，实测各 ~10 s
    outputs:
      mode: ${{ steps.pick.outputs.mode }}
      npu: ${{ steps.pick.outputs.npu }}
      e2e: ${{ steps.pick.outputs.e2e }}
      # 失败阶段：ok / static / select / cancelled。
      stage: ${{ steps.stage.outputs.stage }}
      # l*_run 是决策层唯一需要下游读的东西：yaml 只读这几个布尔值，
      # 不自己拼路径规则。它们的值都在 scripts/ci/affected.py 里算。
      cpu_unit_run: ${{ steps.pick.outputs.cpu_unit_run }}
      npu_unit_run: ${{ steps.pick.outputs.npu_unit_run }}
      npu_model_run: ${{ steps.pick.outputs.npu_model_run }}
      cpu_unit_files: ${{ steps.pick.outputs.cpu_unit_files }}
      test_files: ${{ steps.pick.outputs.test_files }}
      shard_list: ${{ steps.pick.outputs.shard_list }}
      image: ${{ steps.image.outputs.image }}
      summary: ${{ steps.pick.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # merge-base 需要历史

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---- 静态检查：失败后下面的步骤全部不执行，这就是「lint 闸住计划」 ----
      - name: 语法 / workflow / 映射表 / 决策层契约
        id: static
        run: |
          set -uo pipefail
          python -m pip install --quiet pyyaml
          python3 scripts/ci/check_static.py

      # workflow 是近 300 次提交里改动最频繁的文件，写错了只能等下次跑起来才发现。
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      # Dockerfile_aarch64 是除 workflow 外最热的非测试文件（9 次），
      # 而 image CI 一次 4~5 h，语法错发现得太晚。
      # 用二进制而不是 docker run：hadolint/hadolint 镜像只有 amd64，
      # CI_CPU_RUNNER 默认是 arm64 托管机，跑起来只剩 exec format error。
      # --failure-threshold error：只拦「Dockerfile 解析不了」这类真实问题；
      # 钉版本（DL3008）之类的风格告警对自建镜像没有意义。
      # 两个都是秒级工具，所以无条件跑：为省 2 s 去复制一份 diff 判断，
      # 等于给选择器开第二个实现。
      - name: hadolint
        run: |
          set -uo pipefail
          case "$(uname -m)" in
            aarch64|arm64) HARCH=arm64 ;;
            x86_64|amd64)  HARCH=x86_64 ;;
            *) echo "::error::unsupported arch $(uname -m)"; exit 1 ;;
          esac
          curl -sSfL -o /tmp/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-$HARCH"
          chmod +x /tmp/hadolint
          /tmp/hadolint --failure-threshold error docker/npu/Dockerfile_aarch64

      # ---- 选择 ----
      - name: select
        id: pick
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          FORCE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.force_all }}
        run: |
          set -uo pipefail

          # 标签语义只在这里出现一次，别散到各个 job 里。
          EXTRA=()
          case ",${LABELS}," in
            *,ci:full,*)     EXTRA+=(--force-all --e2e-all) ;;
            *,ci:e2e,*)      EXTRA+=(--e2e-force) ;;
            *,ci:skip-npu,*) EXTRA+=(--no-npu) ;;
          esac
          [ "${FORCE_INPUT}" = "true" ] && EXTRA+=(--force-all --e2e-all)

          # --changed-from git 自己算 merge-base diff；git 挂了会给空列表，
          # select() 把空列表当成「信息不足」直接全量（fail-open）。
          python3 scripts/ci/affected.py --changed-from git \
            --dump-changed /tmp/changed.txt \
            "${EXTRA[@]}" --explain --output /tmp/sel.json --github-output "$GITHUB_OUTPUT"

          echo "改动 $(wc -l < /tmp/changed.txt) 个文件"
          head -40 /tmp/changed.txt

          # 选择器自己也要被门禁：算法退化会静默少跑用例。
          python3 scripts/ci/affected.py --self-test

      # 镜像引用不写死在 workflow 里：由 image CI 每晚产出并发布成 artifact，
      # 这里读最新一份。用 GITHUB_TOKEN 的 actions:read 就够，
      # 不需要 PAT —— `gh variable set` 那条路对 GITHUB_TOKEN 是 403。
      # 镜像先用固定链接。nightly 产出的 base-image-ref artifact 解析链路已经就绪
      # （ci-image.yml 仍在发布），但这里**暂不消费** —— 「PR 悄悄换了一个镜像」
      # 是最难排查的一类问题，先把变量减到零。
      # 需要临时切换时设仓库变量 BASE_IMAGE_TAG，它优先于默认链接。
      - name: 解析镜像引用
        id: image
        env:
          OVERRIDE: ${{ vars.BASE_IMAGE_TAG }}
        run: |
          set -uo pipefail
          REF=$(python3 scripts/ci/image.py resolve \
            --override "$OVERRIDE" \
            --fallback 'swr.cn-north-12.myhuaweicloud.com/ascend/torchturbo_npu:base-latest')
          echo "image=$REF" >> "$GITHUB_OUTPUT"
          echo "镜像：$REF"
          {
            echo "## 选择结果"
            echo ""
            echo '| 项 | 值 |'
            echo '|---|---|'
            echo "| mode | \`${{ steps.pick.outputs.mode }}\` |"
            echo "| cpu-unit / npu-unit / npu-model | \`${{ steps.pick.outputs.cpu_unit_run }} / ${{ steps.pick.outputs.npu_unit_run }} / ${{ steps.pick.outputs.npu_model_run }}\` |"
            echo "| E2E | \`${{ steps.pick.outputs.e2e }}\` |"
            echo "| 分片 | \`${{ steps.pick.outputs.shard_list }}\` |"
            echo "| 镜像 | \`$REF\` |"
            echo "| 摘要 | \`${{ steps.pick.outputs.summary }}\` |"
            echo ""
            echo "<details><summary>改动文件</summary>"
            echo ""
            echo '```'
            head -100 /tmp/changed.txt || true
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # 必须放最后且 always()：前面的 step 失败后不会再执行，而这一步正是
      # 用来告诉 gate「倒在哪一步」的。job 失败时 job outputs 仍然会传出。
      - name: 记录失败阶段
        id: stage
        if: always()
        run: |
          set -uo pipefail
          if [ "${{ job.status }}" = "cancelled" ]; then
            echo "stage=cancelled" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.static.outcome }}" != "success" ]; then
            echo "stage=static" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.pick.outcome }}" != "success" ]; then
            echo "stage=select" >> "$GITHUB_OUTPUT"
          else
            echo "stage=ok" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------ cpu-unit-tests
  cpu_unit_tests:
    name: cpu-unit-tests（${{ matrix.shard }}）
    # 第一道闸：计划没算出来（静态没过 / 选择器倒）就没有 CPU 子集可跑。
    needs: select
    # `cpu_unit_run` 为 false 时这个 job 本就不该存在（本次没选中 CPU 测试），
    # 与「上游挂了」是两回事 —— 区分靠 select 的输出（详见 docs/ci/README.md）。
    if: |
      always() && needs.select.result == 'success' &&
      needs.select.outputs.cpu_unit_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shard_list) }}
    uses: ./.github/workflows/ci-pytest.yml
    with:
      kind: cpu-unit
      runner_label: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
      # 用选中的 CPU 子集，不是全量 —— 这是选测真正生效的地方。
      test_files: ${{ needs.select.outputs.cpu_unit_files }}
      shard: ${{ matrix.shard }}
      timeout_minutes: 40

  # ------------------------------------------------------------ npu-unit-tests
  npu_unit_tests:
    name: npu-unit-tests
    # 三条泳道**并行**，各自只依赖 select：互不影响，CPU 红不会拖累 NPU。
    # 是否开卡完全由 select 的输出决定。
    needs: select
    # fork PR 不起 NPU：secrets 不给 fork，而「把 secrets 递到 fork 的代码上」
    # 等于把 RCE 送人（pull_request_target 就是这么出事的）。
    if: |
      always() && needs.select.result == 'success' &&
      needs.select.outputs.npu_unit_run == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/ci-pytest.yml
    with:
      kind: npu-unit
      image: ${{ needs.select.outputs.image }}
      runner_label: ${{ vars.CI_NPU_RUNNER || 'linux-aarch64-a3-800i-2' }}
      # 泳道内全跑：算子/镜像的影响是全仓的，只跑选中的几个等于没验。
      test_files: '[]'
      timeout_minutes: 40
    secrets:
      SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
      SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}

  # ----------------------------------------------------------- npu-model-tests
  npu_model_tests:
    name: npu-model-tests（${{ matrix.profile.model_type }}）
    # 与 cpu-unit / npu-unit 同级，同样只依赖 select。
    needs: select
    if: |
      always() && needs.select.result == 'success' &&
      needs.select.outputs.npu_model_run == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      # 串行：NPU 池的显存是共享的，并行 2 个的真实墙钟比串行更差。
      max-parallel: 1
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.select.outputs.e2e) }}
    uses: ./.github/workflows/ci-pytest.yml
    with:
      kind: npu-model
      runner_label: ${{ vars.CI_E2E_RUNNER || 'linux-aarch64-a3-800i-8' }}
      image: ${{ needs.select.outputs.image }}
      model_type: ${{ matrix.profile.model_type }}
      framework: lf
      trim_layers: ${{ matrix.profile.layers }}
      train_seq_len: '1024'
      train_dataset: 'gsm8k'
      train_finetuning_type: 'full'
      timeout_minutes: 45
      train_timeout_minutes: 10
      fetch_timeout_seconds: 600
    secrets:
      SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
      SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}

  # ------------------------------------------------------------------ gate
  # 唯一的 required check。判定逻辑在 scripts/ci/gate.py ——
  # 与 ci-full 共用一份，否则「fork PR 的 L2 算不算合法跳过」这种规则
  # 会慢慢在两个文件里分叉。
  #
  # **select 有一条直连这里的边**（needs 里第一个就是它），这是「提前结束」
  # 的通路：lint 静态没过 / 选择器算不出计划时，L1/L2a/L2b 的 if 全是假
  # （`needs.select.result == 'success'`），三个 job 立刻变成 skipped、一张卡
  # 都不开；gate 因为 `if: always()` 仍然会跑，等这三个 skipped 落地后直接给
  # 结论。整条链在 ~20 s 内结束，而不是 ~14 min。
  #
  # 两条通路是冗余的、也都需要：
  #   · `needs` 决定**时机**——gate 必须等齐四条边才能算总账；
  #   · 各泳道的 `if` 决定**要不要开卡**——只靠 needs 的话，select 失败会
  #     把下游「传染」成 skipped，但 `if: always()` 又会让它们照跑，两股力
  #     打架。所以显式写 `needs.select.result == 'success'`。
  gate:
    name: gate
    needs: [select, cpu_unit_tests, npu_unit_tests, npu_model_tests]
    if: always()
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 10
    steps:
      # 必须先检出：gate.py 在 scripts/ci/，没有仓库目录就是 ENOENT。
      - uses: actions/checkout@v4

      # 排队与执行分开报：只看总和无法区分「该扩容」和「该优化步骤」。
      - name: 计时
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/gate.py timing

      - name: 判定
        env:
          R_SEL: ${{ needs.select.result }}
          SEL_STAGE: ${{ needs.select.outputs.stage }}
          R_CPU_UNIT: ${{ needs.cpu_unit_tests.result }}
          R_NPU_UNIT: ${{ needs.npu_unit_tests.result }}
          R_NPU_MODEL: ${{ needs.npu_model_tests.result }}
          CPU_UNIT_RUN: ${{ needs.select.outputs.cpu_unit_run }}
          NPU_UNIT_RUN: ${{ needs.select.outputs.npu_unit_run }}
          NPU_MODEL_RUN: ${{ needs.select.outputs.npu_model_run }}
          SKIP_REASON: ${{ needs.npu_model_tests.outputs.skip_reason }}
          STRICT: ${{ contains(github.event.pull_request.labels.*.name, 'ci:e2e:strict') }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          SUMMARY: ${{ needs.select.outputs.summary }}
        run: python3 scripts/ci/gate.py judge --mode pr
