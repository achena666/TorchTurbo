name: CI / model-unit

# "Install a real training stack, then run one step" -- one job, N profiles.
# Called by ci-pr.yml / ci-full.yml, or dispatched on its own.
#
# Profiles are looped inside the job (train.sh lane), not expanded by a matrix:
# a matrix would put one box per profile in the graph.
#
# All orchestration lives in scripts/ci:
#   train.sh             prepare / probe / install / run / report / lane
#   model.py             probe / find / mark / fetch / trim
#   env.py               verify / capture / check / cleanup
#   parallel_plan.py     cards -> sp/ep
#   train_supervisor.sh  watchdog + process-group cleanup
#   diag/                exception capture and NaN probes
#   result.py            facts -> summary markdown
#
# Step timeouts are 3~4x the measured value: their job is to catch a hang, not
# to bound a slow but healthy run.

on:
  workflow_call:
    inputs:
      runner_label:
        description: 'Runner label; trailing number is the card count'
        required: true
        type: string
      image:
        description: 'Base image; use repo@sha256:... for an exact repro'
        required: true
        type: string
      profiles:
        description: 'JSON array of {model_type, layers}'
        required: true
        type: string
      framework:
        description: 'lf or swift'
        required: false
        default: 'lf'
        type: string
      train_model_path:
        description: 'Explicit model dir; empty = look up hf_repo'
        required: false
        default: ''
        type: string
      hf_repo_override:
        description: 'Override the hf_repo field of model_map.json'
        required: false
        default: ''
        type: string
      train_seq_len:
        required: false
        default: '1024'
        type: string
      train_dataset:
        required: false
        default: 'gsm8k'
        type: string
      train_finetuning_type:
        required: false
        default: 'full'
        type: string
      train_sp_size:
        description: 'auto = narrow the repo value to the card count'
        required: false
        default: 'auto'
        type: string
      train_ep_size:
        required: false
        default: 'auto'
        type: string
      diag:
        description: 'Put scripts/ci/diag on PYTHONPATH'
        required: false
        default: true
        type: boolean
      strict:
        description: 'true = model fetch timeout fails; false = skip and pass'
        required: false
        default: false
        type: boolean
      timeout_minutes:
        description: 'Job hard limit'
        required: false
        default: 45
        type: number
      train_timeout_minutes:
        description: 'Hard limit for the whole lane (install + train per profile)'
        required: false
        default: 25
        type: number
      fetch_timeout_seconds:
        description: 'Model fetch timeout; on timeout the profile is skipped'
        required: false
        default: 600
        type: number
    secrets:
      SWR_USERNAME:
        required: true
      SWR_PASSWORD:
        required: true
    outputs:
      skip_reason:
        description: 'Non-empty when nothing really trained'
        value: ${{ jobs.npu_model_tests.outputs.skip_reason }}

  workflow_dispatch:
    inputs:
      runner_label:
        description: 'Runner label (trailing number is the card count)'
        required: true
        default: 'linux-aarch64-a3-800i-8'
        type: choice
        options:
          - linux-aarch64-a3-800i-2
          - linux-aarch64-a3-800i-4
          - linux-aarch64-a3-800i-8
          - linux-aarch64-a3-800i-16
      image:
        description: 'Base image'
        required: false
        default: 'swr.cn-north-12.myhuaweicloud.com/ascend/torchturbo_npu:base-latest'
        type: string
      profiles:
        description: 'JSON array, e.g. [{"model_type":"qwen3_5","layers":0}]'
        required: true
        type: string
      framework:
        description: 'lf or swift'
        required: false
        default: 'lf'
        type: choice
        options:
          - lf
          - swift
      train_dataset:
        description: 'Dataset key from dataset/dataset_info.json'
        required: false
        default: 'gsm8k'
        type: string
      train_seq_len:
        description: 'cutoff_len'
        required: false
        default: '1024'
        type: string
      train_finetuning_type:
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - lora
      strict:
        description: 'true = model fetch timeout fails'
        required: false
        default: true
        type: boolean
      timeout_minutes:
        description: 'Job hard limit'
        required: false
        default: 120
        type: number

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  HF_ENDPOINT: 'https://hf-mirror.com'
  HF_HOME: '/root/.cache/huggingface'
  # HF_HOME sits on shared SFS; trust_remote_code copies must not, because
  # several pods writing one file leaves half a .py and transformers only
  # checks exists().
  HF_MODULES_CACHE: '/tmp/hf-modules'
  HF_HUB_ETAG_TIMEOUT: '30'
  HF_HUB_DOWNLOAD_TIMEOUT: '120'
  # hf_xet talks to cas-server.xethub.hf.co, which HF_ENDPOINT does not proxy,
  # and turns a transient read failure into a permanent size mismatch.
  HF_HUB_DISABLE_XET: '1'
  CI_SCRIPTS: ${{ github.workspace }}/scripts/ci
  RESULT_JSON: /tmp/ci-result.json

jobs:
  npu_model_tests:
    name: run
    runs-on: ${{ inputs.runner_label }}
    # fromJSON is required: a number input arrives as a string and GitHub
    # silently drops the whole job if timeout-minutes gets one.
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || 45) }}
    # No job-level concurrency: serial access to the NPU pool is provided by
    # the runner queue itself.
    outputs:
      skip_reason: ${{ steps.lane.outputs.skip_reason }}

    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ secrets.SWR_USERNAME }}
        password: ${{ secrets.SWR_PASSWORD }}
      options: --user root

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # 20 s to detect "no NPU" beats discovering it after installing deps.
      - name: npu and stack self-check
        run: bash "$CI_SCRIPTS/train.sh" probe

      # prepare / install / run / report per profile, aggregated into one rc.
      - name: train
        id: lane
        timeout-minutes: ${{ fromJSON(inputs.train_timeout_minutes || 25) }}
        env:
          E2E_PROFILES: ${{ inputs.profiles }}
          FRAMEWORK: ${{ inputs.framework }}
          MODEL_HINT: ${{ inputs.train_model_path }}
          REPO_IN: ${{ inputs.hf_repo_override }}
          SP_IN: ${{ inputs.train_sp_size }}
          EP_IN: ${{ inputs.train_ep_size }}
          SEQ_LEN: ${{ inputs.train_seq_len }}
          FINETUNING_TYPE: ${{ inputs.train_finetuning_type }}
          RUNNER_LABEL: ${{ inputs.runner_label }}
          IMAGE: ${{ inputs.image }}
          DATASET_IN: ${{ inputs.train_dataset }}
          DIAG: ${{ inputs.diag }}
          FETCH_TIMEOUT: ${{ inputs.fetch_timeout_seconds || 600 }}
          STRICT: ${{ inputs.strict }}
        run: bash "$CI_SCRIPTS/train.sh" lane

      # Cleanup removes derived config and half a checkpoint, so it runs last.
      # timeout-minutes only kills the process: a killed training leaves child
      # processes holding cards and HBM, which makes the next job fail for
      # unrelated reasons.
      - name: cleanup
        if: always()
        continue-on-error: true
        run: python3 "$CI_SCRIPTS/env.py" cleanup
