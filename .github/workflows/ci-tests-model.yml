name: CI / model tests

# "Install a real training stack, then run one step."
# Called by ci-tests.yml with kind=npu-model. No dispatch here on purpose: the
# single manual entry point stays ci-tests.yml, so the two default sets cannot
# drift apart.
#
# All orchestration lives in scripts/ci:
#   train.sh             prepare / probe / install / run / report
#   model.py             probe / find / mark / fetch / trim
#   env.py               verify / capture / check / cleanup
#   parallel_plan.py     cards -> sp/ep
#   train_supervisor.sh  watchdog + process-group cleanup
#   diag/                exception capture and NaN probes
#   result.py            facts -> summary markdown
#
# Step timeouts are 3~4x the measured value: their job is to catch a hang, not
# to bound a slow but healthy run.

on:
  workflow_call:
    inputs:
      runner_label:
        description: 'Runner label; trailing number is the card count'
        required: true
        type: string
      image:
        description: 'Base image; use repo@sha256:... for an exact repro'
        required: true
        type: string
      model_type:
        description: '@register_model name, key of model_map.json models'
        required: true
        type: string
      framework:
        description: 'lf or swift'
        required: true
        type: string
      train_model_path:
        description: 'Explicit model dir; empty = look up hf_repo'
        required: false
        default: ''
        type: string
      hf_repo_override:
        description: 'Override the hf_repo field of model_map.json'
        required: false
        default: ''
        type: string
      trim_layers:
        description: 'Keep the first N layers; 0 = full download'
        required: false
        default: 0
        type: number
      train_seq_len:
        required: false
        default: '1024'
        type: string
      train_dataset:
        required: false
        default: 'gsm8k'
        type: string
      train_finetuning_type:
        required: false
        default: 'full'
        type: string
      train_sp_size:
        description: 'auto = narrow the repo value to the card count'
        required: false
        default: 'auto'
        type: string
      train_ep_size:
        required: false
        default: 'auto'
        type: string
      diag:
        description: 'Put scripts/ci/diag on PYTHONPATH'
        required: false
        default: true
        type: boolean
      strict:
        description: 'true = model fetch timeout fails; false = skip and pass'
        required: false
        default: false
        type: boolean
      timeout_minutes:
        description: 'Job hard limit'
        required: false
        default: 45
        type: number
      train_timeout_minutes:
        description: 'Hard limit for one training step'
        required: false
        default: 10
        type: number
      fetch_timeout_seconds:
        description: 'Model fetch timeout; on timeout the lane is skipped'
        required: false
        default: 600
        type: number
    secrets:
      SWR_USERNAME:
        required: true
      SWR_PASSWORD:
        required: true
    outputs:
      skip_reason:
        description: 'Non-empty when this run did not really train'
        value: ${{ jobs.npu_model_tests.outputs.skip_reason }}

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  HF_ENDPOINT: 'https://hf-mirror.com'
  HF_HOME: '/root/.cache/huggingface'
  # HF_HOME sits on shared SFS; trust_remote_code copies must not, because
  # several pods writing one file leaves half a .py and transformers only
  # checks exists().
  HF_MODULES_CACHE: '/tmp/hf-modules'
  HF_HUB_ETAG_TIMEOUT: '30'
  HF_HUB_DOWNLOAD_TIMEOUT: '120'
  # hf_xet talks to cas-server.xethub.hf.co, which HF_ENDPOINT does not proxy,
  # and turns a transient read failure into a permanent size mismatch.
  HF_HUB_DISABLE_XET: '1'
  CI_SCRIPTS: ${{ github.workspace }}/scripts/ci
  RESULT_JSON: /tmp/ci-result.json

jobs:
  npu_model_tests:
    name: npu-model-tests (${{ inputs.model_type }}/${{ inputs.framework }} / ${{ inputs.runner_label }})
    runs-on: ${{ inputs.runner_label }}
    # fromJSON is required; see ci-tests.yml.
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || 45) }}
    # No job-level concurrency: serial access to the NPU pool is provided by
    # the runner queue itself.
    outputs:
      skip_reason: ${{ steps.run.outputs.skip_reason }}

    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ secrets.SWR_USERNAME }}
        password: ${{ secrets.SWR_PASSWORD }}
      options: --user root

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # First, so a run that dies here still has a result file.
      - name: resolve map and launch script
        id: resolve
        env:
          MODEL_TYPE: ${{ inputs.model_type }}
          FRAMEWORK: ${{ inputs.framework }}
          RUNNER_LABEL: ${{ inputs.runner_label }}
          IMAGE: ${{ inputs.image }}
          LAYERS: ${{ inputs.trim_layers }}
          DATASET: ${{ inputs.train_dataset }}
        run: bash "$CI_SCRIPTS/train.sh" prepare

      # 20 s to detect "no NPU" beats discovering it after installing deps.
      - name: npu and stack self-check
        run: bash "$CI_SCRIPTS/train.sh" probe

      # pip resolving deps can silently replace the self-built NPU torch with
      # the PyPI one, so the source is verified after every install.
      - name: install
        id: deps
        env:
          INSTALL_SCRIPT: ${{ steps.resolve.outputs.install_script }}
        run: bash "$CI_SCRIPTS/train.sh" install

      - name: train
        id: run
        timeout-minutes: ${{ fromJSON(inputs.train_timeout_minutes || 10) }}
        env:
          MODEL_HINT: ${{ inputs.train_model_path }}
          REPO_MAP: ${{ steps.resolve.outputs.hf_repo }}
          REPO_IN: ${{ inputs.hf_repo_override }}
          SP_IN: ${{ inputs.train_sp_size }}
          EP_IN: ${{ inputs.train_ep_size }}
          SEQ_LEN: ${{ inputs.train_seq_len }}
          FINETUNING_TYPE: ${{ inputs.train_finetuning_type }}
          RUNNER_LABEL: ${{ inputs.runner_label }}
          MODEL_TYPE: ${{ inputs.model_type }}
          TRAIN_SCRIPT: ${{ steps.resolve.outputs.train_script }}
          DATASET_IN: ${{ inputs.train_dataset }}
          LAYERS: ${{ inputs.trim_layers }}
          DIAG: ${{ inputs.diag }}
          FETCH_TIMEOUT: ${{ inputs.fetch_timeout_seconds || 600 }}
          STRICT: ${{ inputs.strict }}
        run: bash "$CI_SCRIPTS/train.sh" run

      # Summary before cleanup: cleanup removes derived config and half a checkpoint.
      - name: summary
        if: always()
        env:
          MODEL_TYPE: ${{ inputs.model_type }}
        run: bash "$CI_SCRIPTS/train.sh" report

      # timeout-minutes only kills the process. A killed training leaves child
      # processes holding cards, unreleased HBM and a partial checkpoint, which
      # makes the next job fail for unrelated reasons. Must be last and always().
      - name: cleanup
        if: always()
        continue-on-error: true
        run: python3 "$CI_SCRIPTS/env.py" cleanup
