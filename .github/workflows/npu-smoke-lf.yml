name: NPU Smoke (llamafactory env)

# Installs a real training stack on the L1 base image, then runs one SFT.
#
# This file is only the entry point: it declares the inputs and a concurrency group,
# and hands everything else to ci-npu-sft.yml. The install scripts are executed as
# they are -- no command is copied in -- so what CI runs is what training runs.
#
# The model comes from model_map.tsv column 5 unless train_model_path overrides it.
#
# Two recipes, same form:
#
#   全量（映射表里那个 tiny 模型）   train_layers = 0, hf_repo_override 留空
#   flash 前 6 层（一个周期）        train_layers = 6, hf_repo_override = inclusionAI/Ling-3.0-flash
#
# 6 层是有意义的：MTP 占 model.layers[num_hidden_layers]，裁剪之后它的 key 会落到
# 被别人占用的层号上，load_state_dict(strict=False) 会默默留一个随机初始化的 MTP
# 头，再乘 loss_scaling_factor=0.1 灌进 loss。所以 parallel_plan.py 在 layers>0 时
# 强制 mtp.enabled=false。train_layers=0 才是真的下 255 GB，别拿它当冒烟。

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'Runner label (must match Settings -> Actions -> Runners)'
        required: true
        default: 'linux-aarch64-a3-800i-2'
        type: choice
        options:
          - linux-aarch64-a3-800i-2
          - linux-aarch64-a3-800i-4
          - linux-aarch64-a3-800i-8
          - linux-aarch64-a3-800i-16
      image:
        description: 'L1 base image; pin with repo@sha256:... for strict reproducibility'
        required: true
        default: 'swr.cn-north-12.myhuaweicloud.com/ascend/torchturbo_npu:base-latest'
      model_type:
        description: '模型：@register_model 的名字，映射表见 .github/workflows/model_map.tsv'
        required: true
        default: 'bailing_hybrid'
        type: choice
        # 只列在 lf 或 swift 下真有启动脚本的；其余 model_type 会在 ② 直接报错。
        options:
          - bailing_hybrid
          - qwen3_5
          - qwen3_5_moe
          - qwen3_5_moe_text
          - qwen4_exp
      framework:
        description: '训练框架；决定用 lf_* 还是 swift_* 启动脚本'
        required: true
        default: 'lf'
        type: choice
        options:
          - lf
          - swift
      train_model_path:
        description: '可选：显式指定模型目录；留空则按映射表第 5 列的 hf_repo 探测/下载'
        required: false
        default: ''
        type: string
      hf_repo_override:
        description: '覆盖映射表第 5 列的 hf_repo（flash 配方：inclusionAI/Ling-3.0-flash）'
        required: false
        default: ''
        type: string
      train_layers:
        description: '只保留前 N 层，0 = 全量。flash 用 6（约一个周期）'
        required: false
        default: 0
        type: number
      train_seq_len:
        description: 'cutoff_len'
        required: true
        default: '1024'
        type: string
      # 冒烟用的小数据集。和启动脚本里各自的默认值（science / wikipedia_en /
      # orca_rlhf）区分开：science.jsonl 有 2.6 GiB，而且它的 conversations[].info
      # 里 test_case / instruction_constrain 前几十 MB 全是 null，datasets 会用首块
      # 把 schema 锁成 null，后面遇到字符串就报
      # "Couldn't cast array of type string to null"。gsm8k 只有 2.7 MB、带 parquet，
      # 不会踩 schema 推断和下载这两个坑。
      train_dataset:
        description: '数据集名（必须是 dataset/dataset_info.json 里的 key）'
        required: true
        default: 'gsm8k'
        type: string
      train_finetuning_type:
        description: '微调方式'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - lora
      # 仓库里的 sft.yaml 按满卡写（sp2/ep8 = 16 卡），pod 卡数不一定够。
      # auto = 按实际卡数收敛；派生配置写到 /tmp，仓库里的 yaml 不会被改。
      train_sp_size:
        description: '序列并行度；“auto” = 按卡数收敛（不整除则减半）'
        required: false
        default: 'auto'
        type: string
      train_ep_size:
        description: '专家并行度；“auto” = min(yaml 值, 卡数/sp)'
        required: false
        default: 'auto'
        type: string
      diag:
        description: '装 scripts/ci/diag（异常捕获 + NaN 定位）'
        required: false
        default: true
        type: boolean

# Serialized per runner pool: the NPUs cannot be shared. Declared here rather than in
# the called workflow, because concurrency cannot depend on a called workflow's inputs.
concurrency:
  group: npu-smoke-lf-${{ inputs.runner_label }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lf-env:
    name: lf-env (${{ inputs.model_type }}/${{ inputs.framework }} l${{ inputs.train_layers }} on ${{ inputs.runner_label }})
    uses: ./.github/workflows/ci-npu-sft.yml
    with:
      runner_label: ${{ inputs.runner_label }}
      image: ${{ inputs.image }}
      model_type: ${{ inputs.model_type }}
      framework: ${{ inputs.framework }}
      train_model_path: ${{ inputs.train_model_path }}
      hf_repo_override: ${{ inputs.hf_repo_override }}
      trim_layers: ${{ inputs.train_layers }}
      train_seq_len: ${{ inputs.train_seq_len }}
      train_dataset: ${{ inputs.train_dataset }}
      train_finetuning_type: ${{ inputs.train_finetuning_type }}
      train_sp_size: ${{ inputs.train_sp_size }}
      train_ep_size: ${{ inputs.train_ep_size }}
      diag: ${{ inputs.diag }}
    secrets:
      SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
      SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
