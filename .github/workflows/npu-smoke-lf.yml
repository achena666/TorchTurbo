name: NPU Smoke (llamafactory env)

# 在 L1 基础镜像上装 llamafactory 环境，然后按 model_type 真跑一次 SFT。
# 安装脚本原样执行、不把命令抄进来，所以 CI 测的就是训练真正会跑的那些命令。
#
# container.image 是必需的：基础镜像在私有 SWR，runner 必须把它当根文件系统拉下来。

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'Runner label (must match Settings -> Actions -> Runners)'
        required: true
        default: 'linux-aarch64-a3-800i-2'
        type: choice
        options:
          - linux-aarch64-a3-800i-2
          - linux-aarch64-a3-800i-4
          - linux-aarch64-a3-800i-8
          - linux-aarch64-a3-800i-16
      image:
        description: 'L1 base image; pin with repo@sha256:... for strict reproducibility'
        required: true
        default: 'swr.cn-north-12.myhuaweicloud.com/ascend/torchturbo_npu:base-latest'
      model_type:
        description: '模型：@register_model 的名字，映射表见 .github/workflows/model_map.tsv'
        required: true
        default: 'bailing_hybrid'
        type: choice
        # 只列在 lf 或 swift 下真有启动脚本的；其余 model_type 会在 ② 直接报错。
        options:
          - bailing_hybrid
          - qwen3_5
          - qwen3_5_moe
          - qwen3_5_moe_text
          - qwen4_exp
      framework:
        description: '训练框架；决定用 lf_* 还是 swift_* 启动脚本'
        required: true
        default: 'lf'
        type: choice
        options:
          - lf
          - swift
      # ---- 训练 stage 参数（训练固定执行，没有开关） ----
      train_model_path:
        description: '可选：显式指定模型目录；留空则按映射表第 5 列的 hf_repo 探测/下载'
        required: false
        default: ''
        type: string
      train_seq_len:
        description: 'cutoff_len'
        required: true
        default: '1024'
        type: string
      train_finetuning_type:
        description: '微调方式'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - lora
      # 仓库里的 sft.yaml 是按满卡（如 sp2/ep8 = 16 卡）写的。CI 的 pod 卡数不一定够，
      # 所以默认 auto：按实际卡数收敛 sp/ep，生成一份派生配置，不改仓库里的 yaml。
      train_sp_size:
        description: '序列并行度；“auto” = 按卡数收敛（不整除则减半）'
        required: false
        default: 'auto'
        type: string
      train_ep_size:
        description: '专家并行度；“auto” = min(yaml 值, 卡数/sp)'
        required: false
        default: 'auto'
        type: string

# Separate group from npu-smoke.yml, but still serialized per pool: NPUs cannot be shared.
concurrency:
  group: npu-smoke-lf-${{ inputs.runner_label }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  # hf-mirror 在 pod 内可达（200），huggingface.co 是 503，必须走镜像。
  HF_ENDPOINT: 'https://hf-mirror.com'
  HF_HOME: '/root/.cache/huggingface'
  # HF_HOME 在共享 SFS 上，但 trust_remote_code 的代码副本不该放那儿：多个 pod
  # 并发写同一个目录会留下半截 .py，而 transformers 只按 exists() 判缓存，之后
  # 所有 run 都读坏文件。放到 pod 本地的 /tmp（与 / 同 overlay，随 pod 销毁）。
  HF_MODULES_CACHE: '/tmp/hf-modules'
  # 默认都是 10 s（constants.py:37）。元数据请求在镜像忙时常超 10 s，而
  # 下载的超时是 httpx 的单次 read 超时：网络停顿 > 10 s 就 httpx.ReadTimeout，
  # 且 http_get 的 retry_on_exceptions=() 不会重试，只能靠外层循环从头再来。
  HF_HUB_ETAG_TIMEOUT: '30'
  HF_HUB_DOWNLOAD_TIMEOUT: '120'
  # hf_xet 装了就会走 Xet CAS 通道，但 CAS 域名（cas-server.xethub.hf.co）
  # 不走 HF_ENDPOINT，镜像站不代理它。实测下 3.5 GB 的 science.jsonl 只收到
  # 1.5 GB 就报 "File size mismatch"，直接炸掉训练。关掉后回退成普通 HTTP
  # GET，走 hf-mirror，带 expected_size 校验。
  HF_HUB_DISABLE_XET: '1'

jobs:
  lf-env:
    name: lf-env (${{ inputs.model_type }}/${{ inputs.framework }} on ${{ inputs.runner_label }})
    runs-on: ${{ inputs.runner_label }}

    # Image pull (~30 min) + torchturbo (~1 min) + deps (~20 min) + a full-epoch SFT.
    # The last one dominates and is unbounded, hence the generous ceiling; step ⑤ carries
    # its own limit so a hung training run cannot eat the whole budget.
    timeout-minutes: 300

    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ secrets.SWR_USERNAME }}
        password: ${{ secrets.SWR_PASSWORD }}
      options: --user root

    defaults:
      run:
        shell: bash

    steps:
      - name: ① Checkout
        uses: actions/checkout@v4

      - name: ② 先行校验 + model_type → 启动脚本映射
        id: resolve
        env:
          MODEL_TYPE: ${{ inputs.model_type }}
          FRAMEWORK: ${{ inputs.framework }}
        run: |
          set -uo pipefail
          MAP=.github/workflows/model_map.tsv
          test -f "$MAP" || { echo "::error::missing $MAP"; exit 1; }

          # 先确认这个 model_type 真的能跑，再去拉镜像装依赖；否则白等几十分钟。
          # 列：1=model_type  2=run_dir  3=lf 脚本  4=swift 脚本  5=hf_repo
          ROW=$(awk -v m="$MODEL_TYPE" '$1==m && $0 !~ /^\s*#/ {print; exit}' "$MAP")
          if [ -z "$ROW" ]; then
            echo "::error::model_type '$MODEL_TYPE' 不在 $MAP 里；可选项："
            awk '$0 !~ /^\s*#/ && NF {printf "  %s\n", $1}' "$MAP"
            exit 1
          fi
          set -- $ROW
          RUN_DIR=$2
          case "$FRAMEWORK" in
            lf)    LAUNCHERS=$3 ;;
            swift) LAUNCHERS=$4 ;;
            *)     echo "::error::未知 framework '$FRAMEWORK'（只支持 lf / swift）"; exit 1 ;;
          esac
          REPO=${5:--}
          echo "model_type=$MODEL_TYPE framework=$FRAMEWORK run_dir=$RUN_DIR launchers=$LAUNCHERS repo=$REPO"

          # 1) run_dir 必须真实存在
          if [ "$RUN_DIR" = "-" ] || [ ! -d "scripts/runs/$RUN_DIR" ]; then
            echo "::error::$MODEL_TYPE 没有可用的 run_dir：scripts/runs/$RUN_DIR"
            ls -1 scripts/runs | sed 's/^/             /'
            exit 1
          fi

          # 2) 当前 framework 的 launchers 非空，且至少一个文件真实存在
          if [ "$LAUNCHERS" = "-" ] || [ -z "$LAUNCHERS" ]; then
            echo "::error::$MODEL_TYPE 在 $FRAMEWORK 下没有启动脚本（第 3/4 列为 '-'）"
            echo "            同一行：run_dir=$RUN_DIR lf=[$3] swift=[$4]"
            exit 1
          fi
          TRAIN=""
          for l in $(echo "$LAUNCHERS" | tr ',' ' '); do
            [ -f "scripts/runs/$RUN_DIR/$l" ] && { TRAIN="scripts/runs/$RUN_DIR/$l"; break; }
          done
          if [ -z "$TRAIN" ]; then
            echo "::error::$MODEL_TYPE/$FRAMEWORK 的 launchers 一个都不存在：$LAUNCHERS"
            ls -1 "scripts/runs/$RUN_DIR" | sed 's/^/             /'
            exit 1
          fi

          # 3) 注册表漂移：映射表必须覆盖代码里 @register_model 的全部名字。
          #    只用标准库，不依赖三方包（这张表要在装依赖之前就能读）。
          #    sys.exit(1) 必须真正终止 step —— 下面还有别的命令。
          python3 - "$MAP" <<'PY' || exit 1
          import glob, re, sys

          registered = set()
          for path in glob.glob("src/torchturbo/models/*/model.py"):
              src = open(path, encoding="utf-8").read()
              registered.update(re.findall(r'@register_model\(\s*["\']([^"\']+)["\']', src))

          mapped = set()
          for line in open(sys.argv[1], encoding="utf-8"):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              mapped.add(line.split()[0])

          missing = sorted(registered - mapped)
          unknown = sorted(mapped - registered)
          print(f"registered={len(registered)} mapped={len(mapped)}")
          if missing:
              print("::error::注册了但映射表未收录:", ", ".join(missing))
          if unknown:
              print("::warning::映射表里有未注册的名字:", ", ".join(unknown))
          sys.exit(1 if missing else 0)
          PY

          # 4) 依赖安装脚本：优先按框架选，退回到通用的 install_lf_deps.sh
          INSTALL=""
          for c in "scripts/runs/$RUN_DIR/install_${FRAMEWORK}_deps.sh" \
                   "scripts/runs/$RUN_DIR/install_lf_deps.sh"; do
            [ -f "$c" ] && { INSTALL="$c"; break; }
          done
          if [ -z "$INSTALL" ]; then
            echo "::error::$MODEL_TYPE 没有可用的依赖安装脚本（scripts/runs/$RUN_DIR/install_*_deps.sh 都不存在）"
            ls -1 "scripts/runs/$RUN_DIR" | sed 's/^/             /'
            exit 1
          fi

          echo "校验通过：train=$TRAIN install=$INSTALL"

          printf 'run_dir=%s\ninstall_script=%s\ntrain_script=%s\nhf_repo=%s\n' \
            "$RUN_DIR" "$INSTALL" "$TRAIN" "$REPO" >> "$GITHUB_OUTPUT"

      - name: ③ Install torchturbo
        id: torchturbo
        run: |
          set -uo pipefail

          # ARG PIP_INDEX_URL 不固化进镜像，pod 里实际用的源取决于 pip 配置/环境变量。
          python -m pip config list 2>/dev/null || true
          env | grep -iE '^(PIP_|.*_PROXY=)' || true

          START=$(date +%s)
          # 不加 -q：Collecting/Downloading 行是“到底有没有重新下载”的唯一直接证据。
          # --no-build-isolation：否则 pip 会为了跑 setuptools 额外下一个完整 torch。
          python -m pip install --no-cache-dir --no-build-isolation -e ".[dev]" 2>&1 | tee /tmp/turbo.log
          RC=${PIPESTATUS[0]}
          ELAPSED=$(( $(date +%s) - START ))

          grep -E '^(Collecting|Downloading|Using cached|Installing collected|Requirement already satisfied)' \
            /tmp/turbo.log | sed 's/ (from .*//' || true

          printf 'elapsed=%s\nrc=%s\n' "$ELAPSED" "$RC" >> "$GITHUB_OUTPUT"
          echo "::notice::torchturbo install took ${ELAPSED}s (rc=${RC})"
          exit "$RC"

      - name: ④ Install deps (${{ inputs.model_type }} / ${{ inputs.framework }})
        id: lf_deps
        env:
          INSTALL_SCRIPT: ${{ steps.resolve.outputs.install_script }}
        run: |
          set -uo pipefail
          test -f "$INSTALL_SCRIPT" || { echo "::error::missing $INSTALL_SCRIPT"; exit 1; }
          cat "$INSTALL_SCRIPT"

          START=$(date +%s)
          bash "$INSTALL_SCRIPT" 2>&1 | tee /tmp/lf-deps.log
          RC=${PIPESTATUS[0]}
          ELAPSED=$(( $(date +%s) - START ))

          printf 'elapsed=%s\nrc=%s\n' "$ELAPSED" "$RC" >> "$GITHUB_OUTPUT"
          echo "::notice::${INSTALL_SCRIPT} took ${ELAPSED}s (rc=${RC})"

          # 装完实际落了什么版本。故意放在计时区间外，且永不致命。
          python - <<'PROBE' > /tmp/after.txt 2>&1 || true
          import importlib
          names = "torch torch_npu numpy triton fla fla_npu transformers llamafactory deepspeed omegaconf pytest".split()
          for n in names:
              try:
                  print(f"{n}={getattr(importlib.import_module(n), '__version__', 'unknown')}")
              except Exception as e:
                  print(f"{n}=MISSING({type(e).__name__})")
          PROBE
          cat /tmp/after.txt

          exit "$RC"

      # 校验已在 ② 保证 train_script 存在，所以这里不再用 if 跳过，直接往下执行。
      - name: ⑤ Train (${{ inputs.model_type }} / ${{ inputs.framework }})
        id: train
        timeout-minutes: 240
        env:
          MODEL_HINT: ${{ inputs.train_model_path }}
          HF_REPO: ${{ steps.resolve.outputs.hf_repo }}
          SP_IN: ${{ inputs.train_sp_size }}
          EP_IN: ${{ inputs.train_ep_size }}
          SEQ_LEN: ${{ inputs.train_seq_len }}
          FINETUNING_TYPE: ${{ inputs.train_finetuning_type }}
          RUNNER_LABEL: ${{ inputs.runner_label }}
          MODEL_TYPE: ${{ inputs.model_type }}
          TRAIN_SCRIPT: ${{ steps.resolve.outputs.train_script }}
        run: |
          set -uo pipefail
          set +e

          # 卡数直接取 runner 标签的尾缀（-2 / -4 / -8），避免与 yaml 里的 sp_size 不匹配。
          NPUS_PER_NODE="${RUNNER_LABEL##*-}"
          case "$NPUS_PER_NODE" in
            ''|*[!0-9]*) NPUS_PER_NODE=2 ;;
          esac
          export NPUS_PER_NODE
          echo "cards=${NPUS_PER_NODE} (from ${RUNNER_LABEL})"

          # --- 卷身份：前几次 run 落到过两份不同的 SFS，命中与否取决于它 ---
          uuid=$(findmnt -nT /root/.cache -o SOURCE 2>/dev/null | sed -n '1p' | cut -d. -f1)
          echo "sfs_uuid=${uuid:-?}"

          # --- 模型目录探测 ---------------------------------------------------
          # 目录 inode 大小说明不了任何问题（实测 22~499 字节），hub 形态的
          # snapshots/<sha>/ 里还全是软链，所以统一用「config.json + safetensors 总量」
          # 判定，并顺带把 bytes/shards 带出来复用。-L 必须加，否则 du 只数软链本身。
          probe() {
            [ -f "$1/config.json" ] || return 1
            _b=$(timeout 180 du -sbL "$1" 2>/dev/null | awk '{print $1}')
            _s=$(timeout 120 find "$1" -maxdepth 2 -name '*.safetensors' 2>/dev/null | wc -l)
            [ "${_b:-0}" -gt 3000000000 ] 2>/dev/null && [ "${_s:-0}" -gt 0 ] || return 1
            echo "${_b} ${_s}"
          }

          if [ -z "$MODEL_HINT" ] && [ "$HF_REPO" = "-" ]; then
            echo "::error::$MODEL_TYPE 没登记 hf_repo（映射表第 5 列为 '-'），必须显式传 train_model_path"
            exit 1
          fi
          # modelscope 会把 '.' 转义成 '___'，两种目录名都试。
          MS=$(printf '%s' "$HF_REPO" | sed 's/\./___/g')

          MODEL=""; BYTES=0; SHARDS=0; HIT=no
          for c in ${MODEL_HINT:+"$MODEL_HINT"} \
                   "/root/.cache/models/$HF_REPO" "/root/.cache/models/$MS" \
                   "/root/.cache/modelscope/hub/models/$HF_REPO" \
                   "/root/.cache/modelscope/hub/models/$MS" \
                   "/root/.cache/modelscope/hub/$HF_REPO" \
                   "$HF_HOME"/hub/models--${HF_REPO//\//--}/snapshots/* ; do
            [ -d "$c" ] || continue
            if r=$(probe "$c") ; then
              MODEL=$c; BYTES=${r% *}; SHARDS=${r#* }; HIT=yes
              echo "HIT  $c  bytes=$BYTES shards=$SHARDS"
              break
            fi
            echo "miss $c"
          done

          if [ -z "$MODEL" ] ; then
            MODEL="/root/.cache/models/$HF_REPO"
            echo "::notice::model MISS on sfs=${uuid:-?}; downloading $HF_REPO"
            mkdir -p "$MODEL"
            # hf-mirror 偶发 Cloudflare 5xx（521 Unassigned = 源站不可达），而
            # huggingface_hub 只重试 408/429，所以这里自己退避重试。
            # 注意：local_dir 模式每次尝试都从头下载（内部写进程唯一的临时文件），
            # 重试代价是整个模型体积；max_workers=4 避免把镜像压垮。
            cat > /tmp/hf_download.py <<'PY'
          import os

          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id=os.environ["REPO_ID"],
              local_dir=os.environ["MODEL_DIR"],
              max_workers=4,
          )
          PY
            ok=no
            for attempt in 1 2 3 ; do
              echo "--- download attempt ${attempt}/3 ---"
              if REPO_ID="$HF_REPO" MODEL_DIR="$MODEL" python /tmp/hf_download.py ; then
                ok=yes; break
              fi
              W=$(( attempt * 30 ))
              echo "attempt ${attempt} failed; retrying in ${W}s"
              sleep "$W"
            done
            if [ "$ok" != yes ] ; then
              echo "::error::从 ${HF_ENDPOINT} 下载 $HF_REPO 连续失败 3 次（镜像侧 5xx 时重跑即可）"
              exit 1
            fi
            r=$(probe "$MODEL") || { echo "::error::model incomplete at $MODEL"; exit 1; }
            BYTES=${r% *}; SHARDS=${r#* }
          fi
          echo "model: $MODEL  bytes=$BYTES  shards=$SHARDS"

          # --- 并行策略 ----------------------------------------------
          # 仓库里的 yaml（bailing_v3/sft.yaml 是 sp2/ep8，要 16 卡）不能改，所以这里
          # 按实际卡数收敛成一份派生配置写到 /tmp，再用 TT_CONFIG 指过去：其余字段
          # （mtp / z_loss / mf...）原样保留。
          test -f "$TRAIN_SCRIPT" || { echo "::error::missing $TRAIN_SCRIPT"; exit 1; }
          D=$(dirname "$TRAIN_SCRIPT")
          # 取脚本里 TT_CONFIG 的默认表达式，把 $(dirname "$0") / ${SCRIPT_DIR} 展开。
          SRC=$(sed -n 's/^TT_CONFIG=\${TT_CONFIG:-\(.*\)}$/\1/p' "$TRAIN_SCRIPT" | head -1)
          SRC=$(printf '%s' "$SRC" | sed -e "s|\$(dirname \"\$0\")|$D|g" \
                                        -e "s|\${SCRIPT_DIR}|$D|g" -e 's|^"||; s|"$||')
          [ -f "$SRC" ] || SRC=""
          [ -n "$SRC" ] || echo "::warning::$TRAIN_SCRIPT 没有配套 yaml，将生成最小配置"

          # 读 yaml 里的 sp/ep 作基准（缺省 1/1）。
          read -r SP EP < <(python3 - "$SRC" <<'PY' 2>/dev/null || echo '1 1'
          import sys, yaml
          pp = ((yaml.safe_load(open(sys.argv[1], encoding="utf-8")) or {})
                  .get("engine_config", {}) or {}).get("parallel_plan", {}) or {}
          print(pp.get("sp_size", 1), pp.get("ep_size", 1))
          PY
          )
          W=$NPUS_PER_NODE
          [ "$SP_IN" = "auto" ] || SP=$(( SP_IN + 0 ))
          [ "$EP_IN" = "auto" ] || EP=$(( EP_IN + 0 ))
          OLD="sp=${SP} ep=${EP}"
          # sp 必须整除 world；ep 与 sp 不能超过 world 且必须整除 world。
          while [ "$SP" -gt 1 ] && [ $(( W % SP )) -ne 0 ]; do SP=$(( SP / 2 )); done
          [ "$SP" -ge 1 ] 2>/dev/null || SP=1
          MAX_EP=$(( W / SP )); [ "$MAX_EP" -lt 1 ] && MAX_EP=1
          [ "$EP" -gt "$MAX_EP" ] && EP=$MAX_EP
          while [ "$EP" -gt 1 ] && [ $(( W % EP )) -ne 0 ]; do EP=$(( EP / 2 )); done
          [ "$EP" -ge 1 ] 2>/dev/null || EP=1

          TT=""
          if [ -n "$SRC" ] ; then
            TT="/tmp/tt_${MODEL_TYPE}.yaml"
            python3 - "$SRC" "$TT" "$SP" "$EP" <<'PY'
          import sys, yaml
          src, dst, sp, ep = sys.argv[1], sys.argv[2], int(sys.argv[3]), int(sys.argv[4])
          doc = yaml.safe_load(open(src, encoding="utf-8")) or {}
          eng = doc.setdefault("engine_config", {}) or {}
          pp = eng.setdefault("parallel_plan", {}) or {}
          pp["sp_size"], pp["ep_size"] = sp, ep
          with open(dst, "w", encoding="utf-8") as f:
              yaml.safe_dump(doc, f, sort_keys=False, allow_unicode=True)
          PY
          else
            TT="/tmp/tt_${MODEL_TYPE}.yaml"
            printf 'engine_config:\n  parallel_plan:\n    sp_size: %s\n    ep_size: %s\n' "$SP" "$EP" > "$TT"
          fi
          echo "train script: $TRAIN_SCRIPT"
          echo "cards=$W  parallel: ${OLD} -> sp=$SP ep=$EP  (tt_config=$TT)"

          export MODEL NPUS_PER_NODE SEQ_LEN FINETUNING_TYPE TT_CONFIG="$TT"

          START=$(date +%s)
          bash "$TRAIN_SCRIPT" 2>&1 | tee /tmp/train.log
          RC=${PIPESTATUS[0]}
          ELAPSED=$(( $(date +%s) - START ))

          LAST=$(grep -oE "'loss': [0-9.]+" /tmp/train.log | tail -1)
          echo "::notice::train rc=${RC} in ${ELAPSED}s; hit=${HIT}; ${LAST:-no loss logged}"

          printf 'rc=%s\nelapsed=%s\ncache_hit=%s\nsfs_uuid=%s\nshards=%s\nmodel_size=%s\nsp_size=%s\nep_size=%s\n' \
            "$RC" "$ELAPSED" "$HIT" "${uuid:-?}" "$SHARDS" "$(( BYTES / 1048576 )) MiB" "$SP" "$EP" >> "$GITHUB_OUTPUT"
          exit "$RC"


      - name: ⑥ Summary
        if: always()
        env:
          MODEL_TYPE: ${{ inputs.model_type }}
          FRAMEWORK: ${{ inputs.framework }}
          RUN_DIR: ${{ steps.resolve.outputs.run_dir }}
          INSTALL_SCRIPT: ${{ steps.resolve.outputs.install_script }}
          RESOLVED_TRAIN: ${{ steps.resolve.outputs.train_script }}
          TORCHTURBO_S: ${{ steps.torchturbo.outputs.elapsed }}
          TORCHTURBO_RC: ${{ steps.torchturbo.outputs.rc }}
          LF_DEPS_S: ${{ steps.lf_deps.outputs.elapsed }}
          LF_DEPS_RC: ${{ steps.lf_deps.outputs.rc }}
          TRAIN_S: ${{ steps.train.outputs.elapsed }}
          TRAIN_RC: ${{ steps.train.outputs.rc }}
          TRAIN_HIT: ${{ steps.train.outputs.cache_hit }}
          TRAIN_SFS: ${{ steps.train.outputs.sfs_uuid }}
          TRAIN_SHARDS: ${{ steps.train.outputs.shards }}
          TRAIN_SIZE: ${{ steps.train.outputs.model_size }}
          TRAIN_SP: ${{ steps.train.outputs.sp_size }}
          TRAIN_EP: ${{ steps.train.outputs.ep_size }}
        run: |
          set -uo pipefail
          TOTAL=$(( ${TORCHTURBO_S:-0} + ${LF_DEPS_S:-0} + ${TRAIN_S:-0} ))
          fmt() { awk -v s="${1:-0}" 'BEGIN{printf "%d min %02d s", s/60, s%60}'; }

          {
            echo "## ${MODEL_TYPE} / ${FRAMEWORK} on \`${{ inputs.runner_label }}\`"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| image | \`${{ inputs.image }}\` |"
            echo "| run_dir | \`${RUN_DIR}\` |"
            echo "| install / train | \`${INSTALL_SCRIPT}\` / \`${RESOLVED_TRAIN:-<none>}\` |"
            echo "| model cache | **${TRAIN_HIT:-?}** (sfs \`${TRAIN_SFS:-?}\`) |"
            echo "| shards / size | ${TRAIN_SHARDS:-?} / ${TRAIN_SIZE:-?} |"
            echo "| parallel (sp/ep) | \`${TRAIN_SP:-?}/${TRAIN_EP:-?}\` |"
            echo ""
            echo "| phase | seconds | human | rc |"
            echo "|---|---|---|---|"
            echo "| ③ torchturbo \`-e .[dev]\` | \`${TORCHTURBO_S:-n/a}\` | $(fmt "${TORCHTURBO_S}") | \`${TORCHTURBO_RC:-n/a}\` |"
            echo "| ④ \`${INSTALL_SCRIPT}\` | \`${LF_DEPS_S:-n/a}\` | $(fmt "${LF_DEPS_S}") | \`${LF_DEPS_RC:-n/a}\` |"
            echo "| ⑤ train | \`${TRAIN_S:-n/a}\` | $(fmt "${TRAIN_S}") | \`${TRAIN_RC:-n/a}\` |"
            echo "| **total** | \`${TOTAL}\` | **$(fmt "${TOTAL}")** | |"
            echo ""
            echo "### model_type → 启动脚本映射（model_type / run_dir / lf / swift / hf_repo）"
            echo ""
            echo '```'
            grep -v '^\s*#' .github/workflows/model_map.tsv 2>/dev/null | sed '/^\s*$/d' || echo "(map missing)"
            echo '```'
            echo ""
            echo "### Versions after install"
            echo ""
            echo '```'
            cat /tmp/after.txt 2>/dev/null || echo "(probe failed)"
            echo '```'
            echo ""
            echo "### 训练尾部"
            echo ""
            echo '```'
            tail -40 /tmp/train.log 2>/dev/null || echo "(no train log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 注解是唯一匿名可读的输出通道，关键数字也放这里。
          echo "::notice title=smoke ${MODEL_TYPE}::sfs=${TRAIN_SFS:-?} cache_hit=${TRAIN_HIT:-?} shards=${TRAIN_SHARDS:-?} size=${TRAIN_SIZE:-?} train_s=${TRAIN_S:-n/a} train_rc=${TRAIN_RC:-n/a}"
          if [ "${TRAIN_RC:-1}" != "0" ]; then
            echo "::error title=train failed::rc=${TRAIN_RC:-n/a}; see the train tail in the job summary"
          fi
