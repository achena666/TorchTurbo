name: NPU Smoke (llamafactory env)

# Measures how long it takes to build a llamafactory environment on top of the L1 base
# image. The install script is invoked as-is, never copied inline, so CI always measures
# the same commands training will run.
#
# An optional ④ stage then runs a real Qwen3.5-2B gsm8k SFT. It is off by default, so the
# default deliverable is still only the timing of `scripts/runs/<model>/install_lf_deps.sh`.
#
# container.image is mandatory: the base image lives in a private SWR repo, so the runner
# has to pull it as its own root filesystem.

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'Runner label (must match Settings -> Actions -> Runners)'
        required: true
        default: 'linux-aarch64-a3-800i-2'
        type: choice
        options:
          - linux-aarch64-a3-800i-2
          - linux-aarch64-a3-800i-4
          - linux-aarch64-a3-800i-8
          - linux-aarch64-a3-800i-16
      image:
        description: 'L1 base image; pin with repo@sha256:... for strict reproducibility'
        required: true
        default: 'swr.cn-north-12.myhuaweicloud.com/ascend/torchturbo_npu:base-latest'
      model_type:
        description: '模型：取 src/torchturbo/models 里 @register_model 的名字，映射表见 scripts/runs/model_map.tsv'
        required: true
        default: 'qwen3_5'
        type: choice
        options:
          - qwen3_5
          - qwen3_5_moe
          - qwen3_5_moe_text
          - bailing_hybrid
          - bailing_moe_v3_vl
          - deepseek_v4
          - kimi_k25
          - llada2_moe
          - qwen4_exp
          - qwen3_moe
          - glm_moe_dsa
      framework:
        description: '训练框架；决定用 lf_* 还是 swift_* 启动脚本'
        required: true
        default: 'lf'
        type: choice
        options:
          - lf
          - swift
      # ---- 以下为可选的训练 stage；不开启时行为与原来完全一致 ----
      train:
        description: '环境装完后是否真跑一次 Qwen3.5-2B 训练'
        required: true
        default: false
        type: boolean
      train_model_path:
        description: '可选：显式指定模型目录；留空则自动探测下面几个缓存落点'
        required: false
        default: ''
        type: string
      train_seq_len:
        description: 'cutoff_len'
        required: true
        default: '1024'
        type: string
      train_finetuning_type:
        description: '微调方式'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - lora

# Separate group from npu-smoke.yml, but still serialized per pool: NPUs cannot be shared.
concurrency:
  group: npu-smoke-lf-${{ inputs.runner_label }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  # hf-mirror 在 pod 内可达（200），huggingface.co 是 503，必须走镜像。
  HF_ENDPOINT: 'https://hf-mirror.com'
  HF_HOME: '/root/.cache/huggingface'

jobs:
  lf-env:
    name: lf-env (${{ inputs.model_type }}/${{ inputs.framework }} on ${{ inputs.runner_label }})
    runs-on: ${{ inputs.runner_label }}

    # Image pull (~30 min) + torchturbo (~1 min) + lf deps (~20 min) + a full-epoch 2B
    # SFT. The last one dominates and is unbounded, hence the generous ceiling; step ④
    # carries its own limit so a hung training run cannot eat the whole budget.
    timeout-minutes: 300

    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ secrets.SWR_USERNAME }}
        password: ${{ secrets.SWR_PASSWORD }}
      options: --user root

    defaults:
      run:
        shell: bash

    steps:
      - name: ① Checkout
        uses: actions/checkout@v4

      - name: ② model_type → 启动脚本映射
        id: resolve
        env:
          MODEL_TYPE: ${{ inputs.model_type }}
          FRAMEWORK: ${{ inputs.framework }}
        run: |
          set -uo pipefail
          MAP=scripts/runs/model_map.tsv
          MODEL_TYPE="${MODEL_TYPE:-}"
          FRAMEWORK="${FRAMEWORK:-lf}"
          test -f "$MAP" || { echo "::error::missing $MAP"; exit 1; }

          echo "=== 映射表 $MAP ==="
          grep -v '^\s*#' "$MAP" | sed '/^\s*$/d'

          # 1) 注册表漂移检查：model_map.tsv 必须覆盖代码里 @register_model 的全部名字。
          #    用 python3 的 re，不依赖任何三方包（这张表要在装依赖之前就能读）。
          python3 - "$MAP" <<'PY'
          import glob, re, sys

          registered = set()
          for path in glob.glob("src/torchturbo/models/*/model.py"):
              src = open(path, encoding="utf-8").read()
              registered.update(re.findall(r'@register_model\(\s*["\']([^"\']+)["\']', src))

          mapped = set()
          for line in open(sys.argv[1], encoding="utf-8"):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              mapped.add(line.split()[0])

          missing = sorted(registered - mapped)
          unknown = sorted(mapped - registered)
          print(f"registered={len(registered)} mapped={len(mapped)}")
          if missing:
              print("::error::注册了但映射表未收录:", ", ".join(missing))
          if unknown:
              print("::warning::映射表里有未注册的名字:", ", ".join(unknown))
          sys.exit(1 if missing else 0)
          PY
          DRIFT=$?

          # 2) 解析当前 model_type
          ROW=$(awk -v m="$MODEL_TYPE" '$1==m && $0 !~ /^\s*#/ {print; exit}' "$MAP")
          if [ -z "$ROW" ]; then
            echo "::error::model_type '$MODEL_TYPE' 不在 $MAP 里；可选项："
            awk '$0 !~ /^\s*#/ && NF {printf "  %s\n", $1}' "$MAP"
            exit 1
          fi
          set -- $ROW
          RUN_DIR=$2
          case "$FRAMEWORK" in
            lf)    LAUNCHERS=$3 ;;
            swift) LAUNCHERS=$4 ;;
            *)     echo "::error::unknown framework $FRAMEWORK"; exit 1 ;;
          esac

          echo
          echo "model_type=$MODEL_TYPE  framework=$FRAMEWORK  run_dir=$RUN_DIR  launchers=$LAUNCHERS"

          # 3) 依赖安装脚本：优先按框架选，退回到通用的 install_lf_deps.sh
          INSTALL=""
          if [ "$RUN_DIR" != "-" ]; then
            for c in "scripts/runs/$RUN_DIR/install_${FRAMEWORK}_deps.sh" \
                     "scripts/runs/$RUN_DIR/install_lf_deps.sh"; do
              [ -f "$c" ] && { INSTALL="$c"; break; }
            done
          fi

          # 4) 训练脚本：取该框架列表里的第一个
          TRAIN=""
          if [ "$LAUNCHERS" != "-" ] && [ -n "$LAUNCHERS" ] && [ "$RUN_DIR" != "-" ]; then
            for l in $(echo "$LAUNCHERS" | tr ',' ' '); do
              [ -f "scripts/runs/$RUN_DIR/$l" ] && { TRAIN="scripts/runs/$RUN_DIR/$l"; break; }
            done
          fi

          echo "install_script=${INSTALL:-<none>}"
          echo "train_script=${TRAIN:-<none>}"
          if [ "$RUN_DIR" = "-" ]; then
            echo "::error::$MODEL_TYPE 在映射表里标记为暂不支持（run_dir=-），没有可用的依赖安装脚本"
            exit 1
          fi
          if [ -z "$INSTALL" ]; then
            echo "::error::$MODEL_TYPE 在 $FRAMEWORK 下没有依赖安装脚本（scripts/runs/$RUN_DIR/install_*_deps.sh 都不存在）"
            exit 1
          fi
          if [ "$TRAIN" = "" ]; then
            echo "::warning::$MODEL_TYPE 在 $FRAMEWORK 下没有启动脚本，训练 stage 会被跳过"
          fi

          echo "run_dir=$RUN_DIR" >> "$GITHUB_OUTPUT"
          echo "install_script=$INSTALL" >> "$GITHUB_OUTPUT"
          echo "train_script=$TRAIN" >> "$GITHUB_OUTPUT"
          echo "launchers=${LAUNCHERS}" >> "$GITHUB_OUTPUT"
          echo "drift=${DRIFT}" >> "$GITHUB_OUTPUT"

      - name: ③ Install torchturbo (same command as npu-smoke.yml)
        id: torchturbo
        run: |
          set -uo pipefail

          # Which index pip will actually use. ARG PIP_INDEX_URL only applies at build
          # time (ARG is not baked into the image), so inside the pod the source comes
          # from the pod's own pip config / env. Printed before the timer starts.
          echo "--- pip source ---"
          python -m pip config list 2>/dev/null || true
          env | grep -iE '^(PIP_|.*_PROXY=)' || echo "(no PIP_* / proxy env)"

          echo "--- already satisfied before install ---"
          python -m pip list 2>/dev/null \
            | grep -iE '^(torch|torch[-_]npu|numpy|triton|omegaconf|PyYAML|pytest|safetensors|pluggy|iniconfig|pygments)\b' \
            || true

          START=$(date +%s)
          # No -q on purpose: the Collecting/Downloading lines are the only direct evidence
          # of whether anything was fetched or everything was already in the image.
          # --no-build-isolation: [build-system].requires lists torch, without this flag pip
          # downloads a full torch wheel just to run setuptools.
          python -m pip install --no-cache-dir --no-build-isolation -e ".[dev]" 2>&1 | tee /tmp/turbo.log
          RC=${PIPESTATUS[0]}
          ELAPSED=$(( $(date +%s) - START ))

          echo "--- what pip actually did ---"
          grep -E '^(Collecting|Downloading|Using cached|Installing collected|Requirement already satisfied)' \
            /tmp/turbo.log | sed 's/ (from .*//' || echo "(no pip action lines)"

          echo "elapsed=${ELAPSED}" >> "$GITHUB_OUTPUT"
          echo "rc=${RC}" >> "$GITHUB_OUTPUT"
          echo "::notice::torchturbo install took ${ELAPSED}s (rc=${RC})"
          exit "$RC"

      - name: ④ Install deps (${{ inputs.model_type }} / ${{ inputs.framework }})
        id: lf_deps
        env:
          MODEL_TYPE: ${{ inputs.model_type }}
          INSTALL_SCRIPT: ${{ steps.resolve.outputs.install_script }}
        run: |
          set -uo pipefail
          SCRIPT="$INSTALL_SCRIPT"
          test -f "$SCRIPT" || { echo "::error::missing $SCRIPT"; exit 1; }
          echo "model_type: $MODEL_TYPE"
          echo "script: $SCRIPT"
          echo "--- script content ---"
          cat "$SCRIPT"

          START=$(date +%s)
          bash "$SCRIPT" 2>&1 | tee /tmp/lf-deps.log
          RC=${PIPESTATUS[0]}
          ELAPSED=$(( $(date +%s) - START ))

          echo "rc=${RC}" >> "$GITHUB_OUTPUT"
          echo "elapsed=${ELAPSED}" >> "$GITHUB_OUTPUT"
          echo "::notice::${SCRIPT} took ${ELAPSED}s (rc=${RC})"

          # Record what actually landed. Deliberately outside the timed region above and
          # never fatal: this workflow's deliverable is the duration, not a pass/fail gate.
          python - <<'PROBE' > /tmp/after.txt 2>&1 || true
          import importlib
          for name in ("torch", "torch_npu", "numpy", "triton",
                       "fla", "fla_npu", "transformers", "llamafactory", "deepspeed",
                       "omegaconf", "pytest"):
              try:
                  module = importlib.import_module(name)
                  print(f"{name}={getattr(module, '__version__', 'unknown')}")
              except Exception as exc:
                  print(f"{name}=MISSING({type(exc).__name__})")
          PROBE
          cat /tmp/after.txt

          exit "$RC"

      # 只有显式勾选 train 时才会执行；不勾选时整个 step 直接 skipped，
      # 于是默认行为仍是原来的「只测安装耗时」。
      - name: ⑤ Train (${{ inputs.model_type }} / ${{ inputs.framework }})
        id: train
        if: ${{ inputs.train && steps.resolve.outputs.train_script != '' }}
        timeout-minutes: 240
        env:
          MODEL_HINT: ${{ inputs.train_model_path }}
          SEQ_LEN: ${{ inputs.train_seq_len }}
          FINETUNING_TYPE: ${{ inputs.train_finetuning_type }}
          RUNNER_LABEL: ${{ inputs.runner_label }}
          MODEL_TYPE: ${{ inputs.model_type }}
          TRAIN_SCRIPT: ${{ steps.resolve.outputs.train_script }}
        run: |
          set -uo pipefail
          set +e

          # 卡数直接取 runner 标签的尾缀（-2 / -4 / -8），避免与 yaml 里的 sp_size 不匹配。
          NPUS_PER_NODE="${RUNNER_LABEL##*-}"
          case "$NPUS_PER_NODE" in
            ''|*[!0-9]*) NPUS_PER_NODE=2 ;;
          esac
          export NPUS_PER_NODE
          echo "cards=${NPUS_PER_NODE} (from ${RUNNER_LABEL})"

          # --- 卷身份：前几次 run 落到过两份不同的 SFS，命中与否取决于它 ---
          uuid=$(findmnt -nT /root/.cache -o SOURCE 2>/dev/null | sed -n '1p' | cut -d. -f1)
          echo "sfs_uuid=${uuid:-?}"

          # --- 模型目录探测 ---------------------------------------------------
          # 只有目录 inode 大小说明不了任何问题（实测 22~499 字节），
          # hub 形态下 snapshots/ 里还全是软链。
          # 所以统一用「config.json 存在 + *.safetensors 总量 > 3 GB」判定，
          # 2B 的 bf16 权重约 4.5 GB。
          model_ok() {
            _d=$1
            [ -n "$_d" ] && [ -f "$_d/config.json" ] || return 1
            # -L 必须加：hub 形态的 snapshots/<sha>/ 里全是软链，
            # du 默认只统计软链本身（几十字节），会误判为未下载。
            _b=$(timeout 180 du -sbL "$_d" 2>/dev/null | awk '{print $1}')
            [ "${_b:-0}" -gt 3000000000 ] 2>/dev/null || return 1
            _s=$(timeout 120 find "$_d" -maxdepth 2 -name '*.safetensors' 2>/dev/null | wc -l)
            [ "$_s" -gt 0 ] || return 1
            return 0
          }

          # 候选（按优先级）。hub 形态要展开 snapshots/<sha>。
          # modelscope 会把 '.' 转义成 '___'，同时建一个原名的软链，两种都试。
          cands=""
          [ -n "$MODEL_HINT" ] && cands="$MODEL_HINT"
          cands="$cands
          /root/.cache/models/Qwen/Qwen3.5-2B
          /root/.cache/models/Qwen3.5-2B
          /root/.cache/modelscope/hub/models/Qwen/Qwen3.5-2B
          /root/.cache/modelscope/hub/models/Qwen/Qwen3___5-2B
          /root/.cache/modelscope/hub/Qwen/Qwen3.5-2B"

          # hub 形态：把每个 snapshot 子目录也当作候选
          for h in /root/.cache/huggingface/hub/models--Qwen--Qwen3.5-2B/snapshots ; do
            [ -d "$h" ] || continue
            for snap in "$h"/* ; do
              [ -d "$snap" ] && cands="$cands
          $snap"
            done
          done

          MODEL=""
          while IFS= read -r c ; do
            c=$(printf '%s' "$c" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            [ -n "$c" ] || continue
            [ -d "$c" ] || { echo "  miss (absent): $c" ; continue ; }
            if model_ok "$c" ; then
              echo "  HIT: $c"
              MODEL="$c"
              break
            fi
            echo "  miss (incomplete): $c"
          done <<EOF
          $cands
          EOF

          if [ -n "$MODEL" ] ; then
            cache_hit=yes
            echo "::notice::model HIT on sfs=${uuid:-?}: $MODEL ($(du -shL "$MODEL" 2>/dev/null | awk '{print $1}'))"
          else
            cache_hit=no
            # 全都不中才下载；落在 plain 目录，避免 hub 软链形态被误判。
            MODEL=/root/.cache/models/Qwen/Qwen3.5-2B
            echo "::notice::model MISS on sfs=${uuid:-?}; downloading Qwen/Qwen3.5-2B via ${HF_ENDPOINT:-https://hf-mirror.com}"
            mkdir -p "$MODEL"
            MODEL_DIR="$MODEL" python - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          # local_dir 直写目标目录，这样模型只存在一份，不额外占 HF_HUB_CACHE 的空间。
          print(snapshot_download(
              repo_id="Qwen/Qwen3.5-2B",
              local_dir=os.environ["MODEL_DIR"],
              max_workers=8,
          ))
          PY
            if [ $? -ne 0 ]; then
              echo "::error::snapshot_download failed"
              exit 1
            fi
          fi

          bytes=$(timeout 180 du -sbL "$MODEL" 2>/dev/null | awk '{print $1}')
          bytes=${bytes:-0}
          shard=$(timeout 120 find "$MODEL" -maxdepth 2 -name '*.safetensors' 2>/dev/null | wc -l)
          echo "model: $MODEL  bytes=${bytes} shards=${shard}"
          if [ "$bytes" -lt 3000000000 ] 2>/dev/null || [ "$shard" -eq 0 ]; then
            echo "::error::model incomplete at $MODEL (bytes=${bytes}, shards=${shard})"
            exit 1
          fi

          # --- tt_config ---
          # 优先级：外部显式传入 > 启动脚本同目录的 <脚本名>.yaml > /tmp 生成。
          # qwen3_5_dense / qwen3_5_moe 都自带 lf_text_sft.yaml，直接复用它们，
          # 不要用 CI 里臆造的并行配置覆盖仓库里的正式配置。
          test -f "$TRAIN_SCRIPT" || { echo "::error::missing $TRAIN_SCRIPT"; exit 1; }
          echo "train script: $TRAIN_SCRIPT"
          TT=""
          if [ -n "${TT_CONFIG:-}" ] && [ -f "${TT_CONFIG}" ]; then
            TT="$TT_CONFIG"
            echo "using provided TT_CONFIG=$TT"
          else
            SIBLING="${TRAIN_SCRIPT%.sh}.yaml"
            if [ -f "$SIBLING" ]; then
              TT="$SIBLING"
              echo "using sibling TT_CONFIG=$TT"
            else
              # 没有配套 yaml 时兜底生成一份最小配置。
              # sp_size 必须能整除 world_size（backend.py: world_size % sp_size）。
              if [ $(( NPUS_PER_NODE % 2 )) -eq 0 ]; then SP=2; else SP=1; fi
              TT=/tmp/tt_${MODEL_TYPE}.yaml
              cat > "$TT" <<'YAML'
          engine_config:
            parallel_plan:
              sp_size: 2
              ep_size: 1
            backend_config:
              cpu_offload:
                enabled: false
          YAML
              # 按实际卡数改写 sp_size（yaml 模板里写的是 2）
              sed -i "s/sp_size: 2/sp_size: ${SP}/" "$TT"
              echo "generated TT_CONFIG=$TT (sp_size=${SP}, ep_size=1)"
            fi
          fi
          sed -n '1,25p' "$TT"

          START=$(date +%s)
          MODEL="$MODEL" TT_CONFIG="$TT" NPUS_PER_NODE="$NPUS_PER_NODE" \
            SEQ_LEN="$SEQ_LEN" FINETUNING_TYPE="$FINETUNING_TYPE" \
            bash "$TRAIN_SCRIPT" 2>&1 | tee /tmp/train.log
          RC=${PIPESTATUS[0]}
          ELAPSED=$(( $(date +%s) - START ))

          echo "--- loss 行 ---"
          grep -oE "'loss': [0-9.]+" /tmp/train.log | sed -n '1,20p' || echo "(no loss lines)"
          LAST=$(grep -oE "'loss': [0-9.]+" /tmp/train.log | tail -1 || true)
          echo "::notice::train rc=${RC} in ${ELAPSED}s; hit=${cache_hit}; ${LAST:-no loss logged}"

          echo "rc=${RC}" >> "$GITHUB_OUTPUT"
          echo "elapsed=${ELAPSED}" >> "$GITHUB_OUTPUT"
          echo "cache_hit=${cache_hit}" >> "$GITHUB_OUTPUT"
          echo "sfs_uuid=${uuid:-?}" >> "$GITHUB_OUTPUT"
          echo "shards=${shard}" >> "$GITHUB_OUTPUT"
          echo "model_size=$(du -shL "$MODEL" 2>/dev/null | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          exit "$RC"


      - name: ⑥ Summary
        if: always()
        env:
          MODEL_TYPE: ${{ inputs.model_type }}
          FRAMEWORK: ${{ inputs.framework }}
          RUN_DIR: ${{ steps.resolve.outputs.run_dir }}
          INSTALL_SCRIPT: ${{ steps.resolve.outputs.install_script }}
          RESOLVED_TRAIN: ${{ steps.resolve.outputs.train_script }}
          LAUNCHERS: ${{ steps.resolve.outputs.launchers }}
          TORCHTURBO_S: ${{ steps.torchturbo.outputs.elapsed }}
          TORCHTURBO_RC: ${{ steps.torchturbo.outputs.rc }}
          LF_DEPS_S: ${{ steps.lf_deps.outputs.elapsed }}
          LF_DEPS_RC: ${{ steps.lf_deps.outputs.rc }}
          TRAIN_S: ${{ steps.train.outputs.elapsed }}
          TRAIN_RC: ${{ steps.train.outputs.rc }}
          TRAIN_HIT: ${{ steps.train.outputs.cache_hit }}
          TRAIN_SFS: ${{ steps.train.outputs.sfs_uuid }}
          TRAIN_SHARDS: ${{ steps.train.outputs.shards }}
          TRAIN_SIZE: ${{ steps.train.outputs.model_size }}
          TRAIN_ENABLED: ${{ inputs.train }}
        run: |
          set -uo pipefail
          TOTAL=$(( ${TORCHTURBO_S:-0} + ${LF_DEPS_S:-0} + ${TRAIN_S:-0} ))
          fmt() { awk -v s="${1:-0}" 'BEGIN{printf "%d min %02d s", s/60, s%60}'; }

          {
            echo "## llamafactory env on base image"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| runner | \`${{ inputs.runner_label }}\` |"
            echo "| image | \`${{ inputs.image }}\` |"
            echo "| model_type | \`${MODEL_TYPE}\` |"
            echo "| framework | \`${FRAMEWORK}\` |"
            echo "| run_dir | \`${RUN_DIR}\` |"
            echo "| launchers | \`${LAUNCHERS}\` |"
            echo "| install script | \`${INSTALL_SCRIPT}\` |"
            echo "| train script | \`${RESOLVED_TRAIN:-<none>}\` |"
            echo "| train stage | ${TRAIN_ENABLED} |"
            if [ "${TRAIN_ENABLED}" = "true" ]; then
              echo "| model cache | **${TRAIN_HIT:-?}** |"
              echo "| SFS uuid | \`${TRAIN_SFS:-?}\` |"
              echo "| shards / size | ${TRAIN_SHARDS:-?} / ${TRAIN_SIZE:-?} |"
            fi
            echo ""
            echo "### Timing (excludes image pull)"
            echo ""
            echo "| phase | seconds | human | rc |"
            echo "|---|---|---|---|"
            echo "| ③ torchturbo \`-e .[dev]\` | \`${TORCHTURBO_S:-n/a}\` | $(fmt "${TORCHTURBO_S}") | \`${TORCHTURBO_RC:-n/a}\` |"
            echo "| ④ \`${INSTALL_SCRIPT}\` | \`${LF_DEPS_S:-n/a}\` | $(fmt "${LF_DEPS_S}") | \`${LF_DEPS_RC:-n/a}\` |"
            if [ "${TRAIN_ENABLED}" = "true" ]; then
              echo "| ⑤ train | \`${TRAIN_S:-n/a}\` | $(fmt "${TRAIN_S}") | \`${TRAIN_RC:-n/a}\` |"
            fi
            echo "| **total** | \`${TOTAL}\` | **$(fmt "${TOTAL}")** | |"
            echo ""
            echo "### model_type → 启动脚本映射"
            echo ""
            echo '```'
            grep -v '^\s*#' scripts/runs/model_map.tsv 2>/dev/null | sed '/^\s*$/d' || echo "(map missing)"
            echo '```'
            echo ""
            echo "### Versions after install"
            echo ""
            echo '```'
            cat /tmp/after.txt 2>/dev/null || echo "(probe failed)"
            echo '```'
            if [ "${TRAIN_ENABLED}" = "true" ]; then
              echo ""
              echo "### 训练尾部"
              echo ""
              echo '```'
              tail -40 /tmp/train.log 2>/dev/null || echo "(no train log)"
              echo '```'
            fi
            echo ""
            echo "> Measurement only: no training, no base-image verification, no NPU checks."
            echo "> \`scripts/runs/<model>/install_lf_deps.sh\` is executed unmodified."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${TRAIN_ENABLED}" = "true" ]; then
            # 注解是唯一匿名可读的输出通道，关键数字也放这里。
            echo "::notice title=Qwen3.5-2B smoke::sfs=${TRAIN_SFS:-?} cache_hit=${TRAIN_HIT:-?} shards=${TRAIN_SHARDS:-?} size=${TRAIN_SIZE:-?} train_s=${TRAIN_S:-n/a} train_rc=${TRAIN_RC:-n/a}"
            if [ "${TRAIN_RC:-1}" != "0" ]; then
              echo "::error title=Qwen3.5-2B train failed::rc=${TRAIN_RC:-n/a}; see the train tail in the job summary"
            fi
          fi
