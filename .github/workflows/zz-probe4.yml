name: probe4

# 临时探针：验证 fromJSON 能否把 dispatch 的字符串输入变成合法 number。
on:
  workflow_dispatch:
    inputs:
      t_num:
        required: false
        default: 30
        type: number
      t_str:
        required: false
        default: '30'
        type: string

jobs:
  a_fromjson_num:
    name: a fromJSON + number 输入
    runs-on: ubuntu-22.04-arm
    timeout-minutes: ${{ fromJSON(inputs.t_num || 60) }}
    steps:
      - run: echo "a ran"

  b_fromjson_str:
    name: b fromJSON + string 输入
    runs-on: ubuntu-22.04-arm
    timeout-minutes: ${{ fromJSON(inputs.t_str || '60') }}
    steps:
      - run: echo "b ran"

  c_fromjson_default_only:
    name: c fromJSON 只吃默认值
    runs-on: ubuntu-22.04-arm
    timeout-minutes: ${{ fromJSON(inputs.t_str || '45') }}
    steps:
      - run: echo "c ran"
