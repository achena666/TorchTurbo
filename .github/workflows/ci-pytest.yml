name: pytest

# CPU 与 NPU 两条泳道的唯一实现，同时也是**手动入口**。差别只在「在哪跑」，不在「跑什么」：
#   container 任务：NPU pod / 自托管池，镜像里已经装好整套栈
#   hosted 任务：GH 托管 arm64，裸机 pip install
# 两者都调用 scripts/ci/pytest.sh —— 分片、marker 过滤、junit、汇总只写一份。
#
# 两种触发：
#   workflow_call      被 ci-gate-pr / ci-full 调用（默认值都是「CI 想耍的」）
#   workflow_dispatch  手动点名跑一个路径 / node id（默认值换成为「排查」方便的）
# 拆成两个文件时这两个默认值会互相打架，所以合成一个：dispatch 的默认只影响
# 手动跑，调用方永远显式传值。
#
# mode 只控制 marker：
#   cpu -> -m "not npu"
#   npu -> -m npu
# 没装 torch_npu 时 tests/conftest.py 会直接不收集那些文件（marker 过滤发生在
# 收集之后，光靠 -m 挡不住 import 期就崩的文件）。

on:
  workflow_call:
    inputs:
      mode:
        description: 'cpu 或 npu；只影响 marker 过滤'
        required: false
        default: 'cpu'
        type: string
      runner_label:
        description: 'Runner 标签；尾缀数字是卡数'
        required: true
        type: string
      use_container:
        description: 'true = 用镜像（NPU 必开）；false = 裸机 pip'
        required: false
        default: true
        type: boolean
      image:
        description: 'use_container=true 时必填'
        required: false
        default: ''
        type: string
      test_files:
        description: 'JSON 数组；空 = 全量'
        required: false
        default: '[]'
        type: string
      test_path:
        description: '单个 path / node id；非空则忽略 test_files 与 shard（手动排查用）'
        required: false
        default: ''
        type: string
      shard:
        description: '"0/3" 形式；空 = 不切'
        required: false
        default: ''
        type: string
      pytest_args:
        description: '额外 pytest 参数（按空格拆是有意的）'
        required: false
        default: '-v --durations=20'
        type: string
      transformers_spec:
        description: '额外的 transformers 约束；默认钉住 5.5.4（见下方注释）'
        required: false
        default: 'transformers==5.5.4'
        type: string
      timeout_minutes:
        description: 'job 硬上限，只拦卡死'
        required: false
        default: 60
        type: number
    secrets:
      SWR_USERNAME:
        required: false
      SWR_PASSWORD:
        required: false

  # 手动入口。不写 test_files / shard：手动跑的意义就是「点名一个路径」或者
  # 「全跑一遍」，不是重现某次分片。
  workflow_dispatch:
    inputs:
      mode:
        description: '跑哪一类：npu 需要真实卡，cpu 是纯 python 逻辑'
        required: true
        default: 'npu'
        type: choice
        options:
          - npu
          - cpu
      test_path:
        description: 'pytest 目标：目录 / 文件 / node id；填 - 表示整条泳道（留空会回落成本默认值）'
        required: false
        default: 'tests/ops/npu'
        type: string
      runner_label:
        description: 'Runner 标签（尾缀数字是卡数）'
        required: true
        default: 'linux-aarch64-a3-800i-2'
        type: choice
        # 手动入口也要能点名 CPU 池，否则「不带容器跑一遍」根本没法验证。
        options:
          - linux-aarch64-a3-800i-2
          - linux-aarch64-a3-800i-4
          - linux-aarch64-a3-800i-8
          - linux-aarch64-a3-800i-16
          - linux-aarch64-cpu-4
          - linux-aarch64-cpu-24
          - ubuntu-22.04-arm
      image:
        description: 'L1 基础镜像；用 repo@sha256:... 可严格复现'
        required: true
        default: 'swr.cn-north-12.myhuaweicloud.com/ascend/torchturbo_npu:base-latest'
        type: string
      use_container:
        description: 'true = 用镜像（NPU 必开）；false = 裸机 pip'
        required: true
        default: true
        type: boolean
      pytest_args:
        description: '额外 pytest 参数（按空格拆）'
        required: false
        default: '-v --durations=20'
        type: string
      transformers_spec:
        description: '额外的 transformers 约束；默认钉住 5.5.4（见下方注释）'
        required: false
        default: 'transformers==5.5.4'
        type: string
      timeout_minutes:
        description: 'job 硬上限（手动跑给宽一点）'
        required: false
        default: 90
        type: number

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  CI_SCRIPTS: ${{ github.workspace }}/scripts/ci
  RESULT_JSON: /tmp/ci-result.json

jobs:
  # ---------------------------------------------------------------- 容器内
  container:
    name: pytest-${{ inputs.mode }}（容器 · ${{ inputs.runner_label }}）
    if: ${{ inputs.use_container }}
    runs-on: ${{ inputs.runner_label }}
    # `|| 60` 是兜底；外面必须包 fromJSON：dispatch 触发的 number 输入实际是
    # 字符串（"30"），直接给 timeout-minutes 会让 GitHub **静默丢弃整个 job**
    # （不是报错，是 run 里看不到这个 job）。详见 docs/ci/README.md。
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || 60) }}
    # 这里**不要**加 job 级 concurrency。曾经按 runner_label 分过组，结果
    # cancel-in-progress: false 并没带来排队：「同一个组里 pending 的 job
    # 只保留最后一个」。ci-full 的 5 个 L1 分片中 2/3/4 在创建 1 s 后全部
    # cancelled，只剩 2 个在跑 —— group 必须按「能不能共用»划，而分片恰恰
    # 是要并行的。串行本来就不需要它：self-hosted runner 忙时，下一个 job
    # 天然在 queued 里等。

    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ secrets.SWR_USERNAME }}
        password: ${{ secrets.SWR_PASSWORD }}
      options: --user root

    defaults:
      run:
        shell: bash

    steps:
      - name: ① 检出
        uses: actions/checkout@v4

      # 结果文件在任何可能失败的步骤之前就建好，这样「② 就挂了」的 run 也有摘要。
      - name: ② 先行校验
        env:
          MODE: ${{ inputs.mode }}
          RUNNER_LABEL: ${{ inputs.runner_label }}
          IMAGE: ${{ inputs.image }}
          TEST_FILES: ${{ inputs.test_files }}
        run: |
          set -uo pipefail
          python3 "$CI_SCRIPTS/result.py" init --file "$RESULT_JSON" \
            kind=pytest model_type="pytest-$MODE" mode="$MODE" \
            runner_label="$RUNNER_LABEL" image="$IMAGE"

          # 装上之前先记一份 torch，装完比对：被换掉的 torch 会让测试全红，
          # 而且看起来像代码 bug。
          python3 "$CI_SCRIPTS/env.py" capture --file /tmp/torch-before.json || true

          uname -m; nproc; free -h | head -2; df -h / | tail -1; python -V
          echo "files: ${TEST_FILES}"

      - name: ②b NPU 自检（仅 npu 泳道）
        if: ${{ inputs.mode == 'npu' }}
        run: |
          set -uo pipefail
          # 用 bash 通配数设备，不用 `ls | wc -l`：actionlint 会按 shellcheck
          # SC2012 判红（ls 解析文件名不安全），而设备名恰恰是安全的 —— 与其
          # 加一行 disable，不如直接不用 ls。
          shopt -s nullglob
          davinci=(/dev/davinci*)
          if [ "${#davinci[@]}" -eq 0 ]; then
            echo "::error::no /dev/davinci*, NPUs not mapped into the pod"
            exit 1
          fi
          echo "davinci count: ${#davinci[@]}"
          npu-smi info 2>/dev/null | head -12 || true
          START=$(date +%s); set +e
          python3 "$CI_SCRIPTS/env.py" verify
          RC=$?
          python3 "$CI_SCRIPTS/result.py" phase --file "$RESULT_JSON" \
            --name '②b NPU 自检' --seconds "$(( $(date +%s) - START ))" --rc "$RC"
          exit "$RC"

      - name: ③ 安装 torchturbo
        env:
          TRANSFORMERS_SPEC: ${{ inputs.transformers_spec }}
        run: |
          set -uo pipefail
          START=$(date +%s)
          # `.[test]`：extras 里是测试真正 import 的那几个包（einops /
          # transformers / huggingface_hub / pillow / peft）。它们必须在
          # pyproject 里写一份，否则两条泳道迟早装成两套。
          # --no-build-isolation：[build-system].requires 里有 torch，
          # 不开这个 pip 会为了跑 setuptools 再下一个完整 torch。
          python -m pip install --no-cache-dir --no-build-isolation -e ".[test]" 2>&1 \
            | tee /tmp/turbo.log
          RC=${PIPESTATUS[0]}
          # pin 必须放在 `.[test]` **之后**：extras 里 transformers 无约束，
          # 跟它一起解会装到最新版（镜像里就是这么漂到 5.22 的）。
          # 单独再装一次才能真的把它拉回来。
          if [ "$RC" -eq 0 ] && [ -n "${TRANSFORMERS_SPEC}" ]; then
            python -m pip install --no-cache-dir "${TRANSFORMERS_SPEC}" 2>&1 \
              | tee -a /tmp/turbo.log
            RC=${PIPESTATUS[0]}
          fi
          ELAPSED=$(( $(date +%s) - START ))
          # 把装完的实际版本打出来：这一行是「pin 到底生没生效」的唯一证据，
          # 没有它就只能等到 26 个用例变红才发现又漂了。
          python -c "import transformers; print('transformers =', transformers.__version__)" || true
          [ "$RC" -eq 0 ] && { python3 "$CI_SCRIPTS/env.py" check --file /tmp/torch-before.json || RC=1; }
          python3 "$CI_SCRIPTS/result.py" phase --file "$RESULT_JSON" \
            --name '③ torchturbo 安装' --seconds "$ELAPSED" --rc "$RC"
          exit "$RC"

      - name: ④ pytest
        env:
          MODE: ${{ inputs.mode }}
          TEST_FILES: ${{ inputs.test_files }}
          TEST_PATH: ${{ inputs.test_path }}
          SHARD: ${{ inputs.shard }}
          PYTEST_ARGS: ${{ inputs.pytest_args }}
        run: bash "$CI_SCRIPTS/pytest.sh"

      - name: ⑤ 摘要
        if: always()
        run: |
          set -uo pipefail
          python3 "$CI_SCRIPTS/result.py" report --file "$RESULT_JSON" \
            --train-log /tmp/pytest.log --junit /tmp/pytest.xml >> "$GITHUB_STEP_SUMMARY" || true
          python3 "$CI_SCRIPTS/result.py" notice --file "$RESULT_JSON" \
            --model-type "pytest-${{ inputs.mode }}" || true

  # ---------------------------------------------------------------- 裸机
  hosted:
    name: pytest-${{ inputs.mode }}（裸机 · ${{ inputs.runner_label }}）
    if: ${{ !inputs.use_container }}
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || 60) }}
    # concurrency 与上面的容器 job 同理：会杀掉并行的分片，不加。

    defaults:
      run:
        shell: bash

    steps:
      - name: ① 检出
        uses: actions/checkout@v4

      - name: ② 准备 python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: ③ 安装 torchturbo
        env:
          TRANSFORMERS_SPEC: ${{ inputs.transformers_spec }}
        run: |
          set -uo pipefail
          python3 "$CI_SCRIPTS/result.py" init --file "$RESULT_JSON" \
            kind=pytest model_type="pytest-${{ inputs.mode }}" \
            mode='${{ inputs.mode }}' runner_label='${{ inputs.runner_label }}'

          START=$(date +%s)
          # 先单独装 torch：GH 托管机没有预装，而下面 extras 里好几个包会
          # 声明对 torch 的依赖，一起解会让 pip 顺带装一份 GPU 版（几百 MB）。
          python -m pip install torch 2>&1 | tee /tmp/turbo.log
          # `-e ".[test]"`：extras 里是测试真正 import 的那几个包，两条泳道
          # （镜像 / 裸机）必须装同一套，否则同一个测试一边绿一边红。
          # pyproject 里的 torch>=2.10.0 刚才已满足，不会重新下载。
          python -m pip install --no-build-isolation -e ".[test]" 2>&1 | tee -a /tmp/turbo.log
          RC=${PIPESTATUS[0]}
          # pin 放在 `.[test]` 之后（与容器泳道同理）：extras 里 transformers
          # 无约束，一起解会装到最新版。
          if [ "$RC" -eq 0 ] && [ -n "${TRANSFORMERS_SPEC}" ]; then
            python -m pip install "${TRANSFORMERS_SPEC}" 2>&1 | tee -a /tmp/turbo.log
            RC=${PIPESTATUS[0]}
          fi
          python -c "import transformers; print('transformers =', transformers.__version__)" || true

          python3 "$CI_SCRIPTS/result.py" phase --file "$RESULT_JSON" \
            --name '③ torchturbo 安装' --seconds "$(( $(date +%s) - START ))" --rc "$RC"
          exit "$RC"

      - name: ④ pytest
        env:
          MODE: ${{ inputs.mode }}
          TEST_FILES: ${{ inputs.test_files }}
          TEST_PATH: ${{ inputs.test_path }}
          SHARD: ${{ inputs.shard }}
          PYTEST_ARGS: ${{ inputs.pytest_args }}
        run: bash "$CI_SCRIPTS/pytest.sh"

      - name: ⑤ 摘要
        if: always()
        run: |
          set -uo pipefail
          python3 "$CI_SCRIPTS/result.py" report --file "$RESULT_JSON" \
            --train-log /tmp/pytest.log --junit /tmp/pytest.xml >> "$GITHUB_STEP_SUMMARY" || true
          python3 "$CI_SCRIPTS/result.py" notice --file "$RESULT_JSON" \
            --model-type "pytest-${{ inputs.mode }}" || true
