name: NPU Smoke Test

# Runs the pytest target from `test_path` against the L1 base image from image-ci.yml on
# real NPU hardware (see .github/workflows/scripts/verify_env.py for the stack checks).
#
# container.image is mandatory: Ascend maps /dev/davinci* via the container runtime, so a
# host-level job cannot reach the NPUs (npu-probe.yml). The SWR repo is private, hence
# credentials.

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'Runner label (must match Settings -> Actions -> Runners)'
        required: true
        default: 'linux-aarch64-a3-800i-2'
        type: choice
        options:
          - linux-aarch64-a3-800i-2
          - linux-aarch64-a3-800i-4
          - linux-aarch64-a3-800i-8
          - linux-aarch64-a3-800i-16
      image:
        description: 'L1 base image; pin with repo@sha256:... for strict reproducibility'
        required: true
        default: 'swr.cn-north-12.myhuaweicloud.com/ascend/torchturbo_npu:base-latest'
      test_path:
        description: 'pytest target: path, file or node id'
        required: true
        default: 'tests/ops/npu'
      pytest_args:
        description: 'Extra pytest arguments (space separated)'
        required: false
        default: '-v --durations=20'
      transformers_spec:
        description: 'Extra transformers constraint; leave empty to keep the version shipped in the image'
        required: false
        default: ''

# Serialize per runner pool: the NPUs cannot be shared.
concurrency:
  group: npu-smoke-${{ inputs.runner_label }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  smoke:
    name: smoke (${{ inputs.runner_label }})
    runs-on: ${{ inputs.runner_label }}

    # Pull ~6 GiB image over SWR (~4 MiB/s, up to 30 min) + install + tests
    timeout-minutes: 90

    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ secrets.SWR_USERNAME }}
        password: ${{ secrets.SWR_PASSWORD }}
      options: --user root

    defaults:
      run:
        shell: bash

    steps:
      - name: ① Checkout
        uses: actions/checkout@v4

      - name: ② Verify environment and NPU
        run: |
          set -uo pipefail
          echo "runner: ${{ inputs.runner_label }} | image: ${{ inputs.image }}"
          uname -m; nproc; free -h | head -2; df -h / | tail -1; python -V; head -3 /etc/os-release

          echo "--- preinstalled packages ---"
          python -m pip list 2>/dev/null \
            | grep -iE '^(torch|torch[-_]npu|triton|triton[-_]ascend|flash-linear-attention|flash-linear-attention-npu|py-spy|numpy|setuptools|wheel|transformers|pytest|safetensors|omegaconf|npu[-_]ops[-_]transformer)\b' \
            || true

          echo "--- NPU devices ---"
          ls /dev/davinci* >/dev/null 2>&1 || { echo "::error::no /dev/davinci*, NPUs not mapped into the pod"; exit 1; }
          echo "davinci count: $(ls /dev/davinci* | wc -l)"
          npu-smi info 2>/dev/null | head -15 || echo "npu-smi unavailable"

          echo "--- runtime stack ---"
          python .github/workflows/scripts/verify_env.py

      - name: ③ Install torchturbo
        env:
          TRANSFORMERS_SPEC: ${{ inputs.transformers_spec }}
        run: |
          set -euo pipefail
          BEFORE=$(python -c "import torch; print(torch.__version__)")

          # pyproject is the single source of deps, so this cannot drift. omegaconf is the
          # only one missing from the image and it only needs PyYAML, so nothing else moves.
          # --no-build-isolation: [build-system].requires lists torch, without this flag pip
          # downloads a full torch wheel just to run setuptools.
          # numpy is not constrained here on purpose: nothing in this resolution pulls it,
          # and a constraint would install numpy into an image that lacks it. verify_env.py
          # checks numpy instead.
          ARGS=(-e ".[dev]")
          if [ -n "${TRANSFORMERS_SPEC}" ]; then
            ARGS+=("${TRANSFORMERS_SPEC}")
          fi
          python -m pip install --no-cache-dir -q --no-build-isolation "${ARGS[@]}"

          AFTER=$(python -c "import torch; print(torch.__version__)")
          echo "torch before: ${BEFORE}"
          echo "torch after : ${AFTER}"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "--- torch/numpy inventory after install ---"
            python -m pip list 2>/dev/null | grep -iE '^(torch|torch[-_]npu|numpy|triton)\b' || true
            python -c "import torch, torch_npu; print('torch file:', torch.__file__); print('torch_npu file:', torch_npu.__file__)" || true
            echo "::error::torch was replaced (${BEFORE} -> ${AFTER}), NPU stack is no longer trusted"
            exit 1
          fi

          python -c "import torchturbo; print('torchturbo ok:', torchturbo.__file__)"
          python -c "import torch_npu; print('torch_npu still ok:', torch_npu.__version__)"

      - name: ④ Run tests
        id: pytest
        env:
          TEST_PATH: ${{ inputs.test_path }}
          PYTEST_ARGS: ${{ inputs.pytest_args }}
        run: |
          set -uo pipefail
          echo "target : ${TEST_PATH}"
          echo "args   : ${PYTEST_ARGS}"
          echo "--- collected ---"
          python -m pytest "${TEST_PATH}" ${PYTEST_ARGS} --collect-only -q 2>&1 | tail -20 || true

          echo "--- run ---"
          set +e
          # shellcheck disable=SC2086
          python -m pytest "${TEST_PATH}" ${PYTEST_ARGS} \
            --junitxml=/tmp/pytest.xml 2>&1 | tee /tmp/pytest.log
          RC=${PIPESTATUS[0]}
          echo "rc=${RC}" >> "$GITHUB_OUTPUT"
          echo "::notice::pytest exit code ${RC}"
          exit "$RC"

      - name: ⑤ Summary
        if: always()
        env:
          PYTEST_RC: ${{ steps.pytest.outputs.rc }}
        run: |
          set -uo pipefail
          {
            echo "## NPU Smoke Test"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| runner | \`${{ inputs.runner_label }}\` |"
            echo "| image | \`${{ inputs.image }}\` |"
            echo "| test target | \`${{ inputs.test_path }}\` |"
            echo "| pytest args | \`${{ inputs.pytest_args }}\` |"
            echo "| pytest rc | \`${PYTEST_RC:-n/a}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          python .github/workflows/scripts/junit_summary.py /tmp/pytest.xml \
            >> "$GITHUB_STEP_SUMMARY"
