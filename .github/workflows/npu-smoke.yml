name: NPU Smoke Test

# Runs pytest against the L1 base image from image-ci.yml on real NPU hardware.
#
# This file is only the entry point: it declares the inputs and a concurrency
# group, and hands the body to ci-npu-pytest.yml. The environment checks
# (`verify_env.py`) live in scripts/ci next to everything else that used to be a
# heredoc here, so they can be run locally.
#
# container.image is mandatory: Ascend maps /dev/davinci* via the container
# runtime, so a host-level job cannot reach the NPUs. The SWR repo is private,
# hence the credentials.

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'Runner label (must match Settings -> Actions -> Runners)'
        required: true
        default: 'linux-aarch64-a3-800i-2'
        type: choice
        options:
          - linux-aarch64-a3-800i-2
          - linux-aarch64-a3-800i-4
          - linux-aarch64-a3-800i-8
          - linux-aarch64-a3-800i-16
      image:
        description: 'L1 base image; pin with repo@sha256:... for strict reproducibility'
        required: true
        default: 'swr.cn-north-12.myhuaweicloud.com/ascend/torchturbo_npu:base-latest'
      test_path:
        description: 'pytest target: path, file or node id'
        required: true
        default: 'tests/ops/npu'
      pytest_args:
        description: 'Extra pytest arguments (space separated)'
        required: false
        default: '-v --durations=20'
      transformers_spec:
        description: 'Extra transformers constraint; leave empty to keep the version shipped in the image'
        required: false
        default: ''

# Serialize per runner pool: the NPUs cannot be shared. Declared here rather than
# in the called workflow, because concurrency cannot depend on a called
# workflow's inputs.
concurrency:
  group: npu-smoke-${{ inputs.runner_label }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ inputs.runner_label }})
    uses: ./.github/workflows/ci-npu-pytest.yml
    with:
      runner_label: ${{ inputs.runner_label }}
      image: ${{ inputs.image }}
      test_path: ${{ inputs.test_path }}
      pytest_args: ${{ inputs.pytest_args }}
      transformers_spec: ${{ inputs.transformers_spec }}
    secrets:
      SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
      SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
