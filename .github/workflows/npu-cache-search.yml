name: NPU Cache Search

# 目的：在 NPU runner 的 /root/.cache 共享卷里，搜索 Qwen3.5 系列模型/数据集是否已缓存。
#
# 安全约束（前两次探针踩过的坑，务必保留）：
#   1. /root/.cache 是大容量共享 NFS（39T），**禁止递归 du**（会 D 态挂死，SIGKILL 都杀不掉）
#   2. 禁止 `| head`（提前关闭管道 → SIGPIPE → GHA 的 -e -o pipefail 直接 exit 141）
#      一律用 `sed -n '1,Np'` 截断
#   3. 所有遍历命令都要带 -maxdepth 或 timeout，且 step 级设 timeout-minutes
#   4. 诊断型 step 用 `set +e`，个别子命令失败不中断整个实验

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'Runner 标签'
        required: true
        default: 'linux-aarch64-a3-800i-2'
        type: choice
        options:
          - linux-aarch64-a3-800i-0
          - linux-aarch64-a3-800i-2
          - linux-aarch64-a3-800i-4
          - linux-aarch64-a3-800i-8
      image:
        description: 'container.image'
        required: true
        default: 'swr.cn-north-12.myhuaweicloud.com/ascend/torchturbo_npu:base-latest'
      pattern:
        description: '搜索关键词（-iname 大小写不敏感）'
        required: true
        default: 'qwen'
        type: string
      maxdepth:
        description: 'find 最大深度（从 /root/.cache 起算，建议 4）'
        required: true
        default: '4'
        type: string

concurrency:
  group: npu-cache-search-${{ inputs.runner_label }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  search:
    name: cache-search (${{ inputs.runner_label }})
    runs-on: ${{ inputs.runner_label }}
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ secrets.SWR_USERNAME }}
        password: ${{ secrets.SWR_PASSWORD }}
      options: --user root
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: ① 卷身份与容量
        timeout-minutes: 3
        run: |
          set +e
          echo "runner : ${{ inputs.runner_label }}"
          echo "pattern: ${{ inputs.pattern }}   maxdepth: ${{ inputs.maxdepth }}"
          echo "--- 本次 pod 挂的是哪个 SFS 实例（跨 run 比对用）---"
          findmnt -nT /root/.cache -o SOURCE,FSTYPE 2>/dev/null | sed -n '1p'
          findmnt -nT /root/.cache -o OPTIONS 2>/dev/null | sed -n '1p' \
            | grep -o 'addr=[0-9.]*' | sed -n '1p'
          echo "--- 容量（df 是 O(1)，不遍历）---"
          df -h /root/.cache 2>/dev/null
          df -i /root/.cache 2>/dev/null

      - name: ② 精确查找目标路径
        timeout-minutes: 5
        run: |
          set +e
          # 先直接判几个最可能的落点，命中就是 O(1)
          for p in \
            /root/.cache/models \
            /root/.cache/datasets \
            /root/.cache/huggingface/hub \
            /root/.cache/huggingface/datasets \
            /root/.cache/modelscope ; do
            printf '%-44s ' "$p"
            if [ -d "$p" ]; then echo "EXISTS"; else echo "ABSENT"; fi
          done

          echo
          echo "=== 常见缓存落点下的 Qwen 相关条目 ==="
          for p in /root/.cache/models /root/.cache/datasets /root/.cache/huggingface/hub \
                   /root/.cache/huggingface/datasets /root/.cache/modelscope ; do
            [ -d "$p" ] || continue
            echo "--- $p ---"
            # 只读一层；用 sed 截断，绝不用 head
            timeout 60 ls -1 "$p" 2>/dev/null | sed -n '1,200p' | grep -iE "${{ inputs.pattern }}" \
              | sed 's/^/    HIT  /'
            n=$(timeout 60 ls -1 "$p" 2>/dev/null | sed -n '1,5000p' | wc -l)
            echo "    (该目录共 ${n} 个直接子项)"
          done

      - name: ③ 有界 find（只在缓存候选目录内，深度受限）
        timeout-minutes: 10
        run: |
          set +e
          D='${{ inputs.maxdepth }}'
          P='${{ inputs.pattern }}'
          : > /tmp/hits.txt

          # 第 1 层：/root/.cache 的直接子项（单次 ls，成本极低），
          # 覆盖“有人把模型直接放在卷根”的情况。
          echo "=== /root/.cache 直接子项中匹配 '${P}' 的 ==="
          timeout 60 ls -1 /root/.cache 2>/dev/null | sed -n '1,5000p' \
            | grep -i "${P}" | sed 's/^/ROOT\//' >> /tmp/hits.txt

          # 第 2 层：只在已知的缓存目录里 find，避免遍历 ccache/bazel/conda
          # 这类海量小文件目录（整卷 find 会慢甚至超时）。
          echo "=== 候选缓存目录内 find（maxdepth ${D}）==="
          for root in /root/.cache/models /root/.cache/datasets \
                      /root/.cache/huggingface /root/.cache/modelscope ; do
            [ -d "$root" ] || { echo "$root : ABSENT，跳过"; continue; }
            echo "--- $root ---"
            timeout 180 find "$root" -maxdepth "${D}" -iname "*${P}*" \
                -printf '%y %10s  %TY-%Tm-%Td %TH:%TM  %p\n' 2>/dev/null \
              >> /tmp/hits.txt
            echo "    (rc=$? ; 0=成功 124=超时)"
          done

          total=$(wc -l < /tmp/hits.txt)
          echo
          echo "命中条目总数: ${total}"
          echo "--- 前 300 条 ---"
          sed -n '1,300p' /tmp/hits.txt

          echo
          echo "=== 顶层各缓存目录的规模概览（单层 ls，不递归）==="
          for p in models datasets huggingface modelscope ; do
            d="/root/.cache/${p}"
            [ -d "$d" ] || { echo "/root/.cache/${p} : ABSENT"; continue; }
            n=$(timeout 60 ls -1 "$d" 2>/dev/null | sed -n '1,5000p' | wc -l)
            echo "/root/.cache/${p} : ${n} 个直接子项"
            timeout 60 ls -1 "$d" 2>/dev/null | sed -n '1,40p' | sed 's/^/    /'
          done

      - name: ④ 顺手检查 gsm8k 与 omni 预热脚本
        timeout-minutes: 5
        run: |
          set +e
          echo "=== gsm8k 是否已缓存 ==="
          timeout 120 find /root/.cache/models /root/.cache/datasets \
              /root/.cache/huggingface/datasets \
              -maxdepth 4 -iname '*gsm8k*' -printf '%y %10s  %p\n' 2>/dev/null \
            | sed -n '1,50p'
          echo "(无输出 = 未缓存)"

          echo
          echo "=== 基础设施自带的 HF 预热脚本（有就直接复用）==="
          if [ -f /root/.cache/omni-hf-preload.sh ]; then
            sed -n '1,100p' /root/.cache/omni-hf-preload.sh
          else
            echo "(absent)"
          fi

      - name: ⑤ Summary
        if: always()
        timeout-minutes: 3
        run: |
          set +e
          uuid=$(findmnt -nT /root/.cache -o SOURCE 2>/dev/null | sed -n '1p' | cut -d. -f1)
          addr=$(findmnt -nT /root/.cache -o OPTIONS 2>/dev/null | sed -n '1p' | grep -o 'addr=[0-9.]*' | sed -n '1p')
          cap=$(df -h /root/.cache 2>/dev/null | awk 'NR==2{print $2" 总 / "$3" 已用 / "$4" 可用"}')
          total=$(wc -l < /tmp/hits.txt 2>/dev/null || echo 0)
          q35=$(grep -ic 'qwen3[._-]*5' /tmp/hits.txt 2>/dev/null || echo 0)

          {
            echo "## NPU Cache Search — \`${{ inputs.pattern }}\`"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| runner | \`${{ inputs.runner_label }}\` |"
            echo "| SFS UUID | \`${uuid:-?}\` |"
            echo "| 挂载地址 | \`${addr:-?}\` |"
            echo "| 容量 | ${cap:-?} |"
            echo "| pattern | \`${{ inputs.pattern }}\` |"
            echo "| maxdepth | \`${{ inputs.maxdepth }}\` |"
            echo "| 命中总数 | **${total}** |"
            echo "| 其中 Qwen3.5 | **${q35}** |"
            echo ""
            if [ "${q35:-0}" -gt 0 ] 2>/dev/null; then
              echo "### ✅ 已缓存 Qwen3.5（前 30 条）"
              echo ""
              echo '```'
              grep -i 'qwen3[._-]*5' /tmp/hits.txt | sed -n '1,30p'
              echo '```'
            else
              echo "### ❌ 未发现 Qwen3.5 缓存"
            fi
            echo ""
            echo "> 完整命中列表见第 ③ 步日志。"
            echo "> 若 UUID 与历史不同，说明本次 pod 挂到了另一份 SFS，未命中不代表别处没有。"
          } >> "$GITHUB_STEP_SUMMARY"
