name: CI · main 全量

# main 上不选测：走全量。PR 的选择器可能漏，这里是那道兜底。
#
# 每晚也跑一次：上游依赖、镜像、外部数据集变化只有到全量才暴露。
# 全量的价值不在「更快」，而在「一定会跑到」。

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 19 * * *'      # UTC 19:00 = 北京时间 03:00
  workflow_dispatch:
    inputs:
      with_e2e:
        description: '是否跑全部 E2E 画像'
        required: false
        default: true
        type: boolean

# 全量**不设 workflow 级 concurrency**。
# 初衷是「新 push 不打断正在跑的全量」（中途取消会留下半个 checkpoint）。
# 但 cancel-in-progress: false 会把它排成 pending，而实测这条队列会***锁死***：
# 连续 push 几下之后，run 一直是 pending、jobs=0，前面那些 pending 已被 cancel，
# 组里已经没有任何在跑的 run 也不会恢复；再 dispatch 一个新 run 同样卡住。
# 「不取消」这个目标不需要 concurrency —— 没有 concurrency 就不会有 cancel。
# 代价是两次全量可能并行，但 L2b 的 8 卡 pod 本来就会被 runner 队列拦住。

permissions:
  contents: read
  actions: read          # gate 的计时步骤要读 run 的 created_at / run_started_at

jobs:
  select:
    name: 全量选择
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 10
    outputs:
      test_files: ${{ steps.pick.outputs.test_files }}
      shard_list: ${{ steps.pick.outputs.shard_list }}
      e2e: ${{ steps.pick.outputs.e2e }}
      image: ${{ steps.image.outputs.image }}
      summary: ${{ steps.pick.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 全量
        id: pick
        env:
          WITH_E2E: ${{ github.event_name != 'workflow_dispatch' || inputs.with_e2e }}
        run: |
          set -uo pipefail
          EXTRA=(--force-all)
          [ "$WITH_E2E" = "true" ] && EXTRA+=(--e2e-all)
          python3 scripts/ci/affected.py --changed-from git --base-ref "${BASE_REF:-origin/main}" \
            "${EXTRA[@]}" --output /tmp/sel.json --github-output "$GITHUB_OUTPUT"
          python3 scripts/ci/affected.py --self-test

      # 与 PR 门禁同一套解析：先看人工覆盖（vars.BASE_IMAGE_TAG）。
      # 同样**暂不消费** base-image-ref artifact，用固定链接。
      - name: 解析镜像引用
        id: image
        env:
          OVERRIDE: ${{ vars.BASE_IMAGE_TAG }}
        run: |
          set -uo pipefail
          REF=$(python3 scripts/ci/image.py resolve \
            --override "$OVERRIDE" \
            --fallback 'swr.cn-north-12.myhuaweicloud.com/ascend/torchturbo_npu:base-latest')
          echo "image=$REF" >> "$GITHUB_OUTPUT"
          echo "镜像：$REF"

  l0:
    name: L0 静态检查
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --quiet pyyaml
          python3 scripts/ci/check_static.py
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
      # hadolint 用 arm64 二进制，不用镜像：hadolint/hadolint 只有 amd64。
      # --failure-threshold error 只拦解析类问题，不拦钉版本之类的风格告警。
      - name: hadolint
        run: |
          set -uo pipefail
          case "$(uname -m)" in
            aarch64|arm64) HARCH=arm64 ;;
            x86_64|amd64)  HARCH=x86_64 ;;
            *) echo "::error::unsupported arch $(uname -m)"; exit 1 ;;
          esac
          curl -sSfL -o /tmp/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-$HARCH"
          chmod +x /tmp/hadolint
          /tmp/hadolint --failure-threshold error docker/npu/Dockerfile_aarch64

  l1:
    name: L1 CPU（${{ matrix.shard }}）
    needs: select
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shard_list) }}
    uses: ./.github/workflows/ci-pytest.yml
    with:
      mode: cpu
      use_container: false
      runner_label: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
      test_files: ${{ needs.select.outputs.test_files }}
      shard: ${{ matrix.shard }}
      timeout_minutes: 40

  l2a:
    name: L2a NPU 特性
    needs: select
    uses: ./.github/workflows/ci-pytest.yml
    with:
      mode: npu
      use_container: true
      image: ${{ needs.select.outputs.image }}
      runner_label: ${{ vars.CI_NPU_RUNNER || 'linux-aarch64-a3-800i-2' }}
      test_files: '[]'
      timeout_minutes: 40
    secrets:
      SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
      SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}

  l2b:
    name: L2b E2E（${{ matrix.profile.model_type }}）
    needs: select
    if: needs.select.outputs.e2e != '[]'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.select.outputs.e2e) }}
    uses: ./.github/workflows/ci-train.yml
    with:
      runner_label: ${{ vars.CI_E2E_RUNNER || 'linux-aarch64-a3-800i-8' }}
      image: ${{ needs.select.outputs.image }}
      model_type: ${{ matrix.profile.model_type }}
      framework: lf
      trim_layers: ${{ matrix.profile.layers }}
      train_seq_len: '1024'
      train_dataset: 'gsm8k'
      train_finetuning_type: 'full'
      timeout_minutes: 45
      train_timeout_minutes: 10
      fetch_timeout_seconds: 600
    secrets:
      SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
      SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}

  gate:
    name: gate
    needs: [select, l0, l1, l2a, l2b]
    if: always()
    runs-on: ${{ vars.CI_CPU_RUNNER || 'ubuntu-22.04-arm' }}
    timeout-minutes: 10
    steps:
      # 必须先检出：gate.py 在 scripts/ci/，没有仓库目录就是 ENOENT。
      - uses: actions/checkout@v4

      # 排队与执行分开报：只看总和无法区分「该扩容」和「该优化步骤」。
      - name: 计时
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/gate.py timing

      - name: 判定
        env:
          R_SEL: ${{ needs.select.result }}
          R_L0: ${{ needs.l0.result }}
          R_L1: ${{ needs.l1.result }}
          R_L2A: ${{ needs.l2a.result }}
          R_L2B: ${{ needs.l2b.result }}
          SUMMARY: ${{ needs.select.outputs.summary }}
        run: python3 scripts/ci/gate.py judge --mode full
