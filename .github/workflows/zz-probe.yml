name: probe

# 临时探针：确认 workflow_dispatch 下「有 container 的 job + inputs 守卫」会不会
# 被 GitHub 直接不创建。验证完立即删除。
on:
  workflow_dispatch:
    inputs:
      use_container:
        required: false
        default: true
        type: boolean
      image:
        required: false
        default: 'alpine:3.20'
        type: string

jobs:
  a_container_literal:
    name: a 容器 无if 字面量镜像
    runs-on: ubuntu-22.04-arm
    container:
      image: alpine:3.20
    steps:
      - run: echo "a ran"

  b_container_inputs_guard:
    name: b 容器 inputs 守卫 字面量镜像
    if: ${{ inputs.use_container }}
    runs-on: ubuntu-22.04-arm
    container:
      image: alpine:3.20
    steps:
      - run: echo "b ran"

  c_container_image_inputs:
    name: c 容器 inputs 镜像
    runs-on: ubuntu-22.04-arm
    container:
      image: ${{ inputs.image }}
    steps:
      - run: echo "c ran"

  d_hosted_guard:
    name: d 裸机 反向守卫
    if: ${{ !inputs.use_container }}
    runs-on: ubuntu-22.04-arm
    steps:
      - run: echo "d ran"
