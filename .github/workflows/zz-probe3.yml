name: probe3

# 临时探针：二分 timeout-minutes 表达式 / number 输入声明。
on:
  workflow_dispatch:
    inputs:
      timeout_minutes:
        required: false
        default: 30
        type: number
      use_container:
        required: false
        default: true
        type: boolean

jobs:
  p_no_timeout:
    name: p 容器 无timeout
    runs-on: ubuntu-22.04-arm
    container:
      image: alpine:3.20
    steps:
      - run: echo "p ran"

  q_number_input_in_run:
    name: q 容器 用number输入但无timeout
    runs-on: ubuntu-22.04-arm
    container:
      image: alpine:3.20
    steps:
      - run: echo "q ran timeout=${{ inputs.timeout_minutes }}"

  r_timeout_only:
    name: r 裸机 只有timeout表达式
    runs-on: ubuntu-22.04-arm
    timeout-minutes: ${{ inputs.timeout_minutes || 60 }}
    steps:
      - run: echo "r ran"
