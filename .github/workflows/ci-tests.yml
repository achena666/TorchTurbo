name: CI / tests

# Single entry point for all test lanes. One input set, one dispatch form.
#
#   kind=cpu-unit    cpu-unit-tests   hosted arm64, bare metal       0 cards
#   kind=npu-unit    npu-unit-tests   self-hosted pool, image        2 cards
#   kind=npu-model   npu-model-tests  training stack + one step      8 cards
#
# The two unit lanes differ only in where they run, not in what they run, so
# they share this file. kind replaces the old use_container flag: cpu-unit is
# always bare metal, npu-unit always containerised, so the invalid pairing
# cannot be expressed.
#
# npu-model only forwards to ci-tests-model.yml. That file has no dispatch --
# keeping a single manual entry point is what stops the two default sets from
# drifting apart.

on:
  workflow_call:
    inputs:
      # ---------------------------------------------------------------- common
      kind:
        description: 'cpu-unit / npu-unit / npu-model'
        required: false
        default: 'npu-unit'
        type: string
      runner_label:
        description: 'Runner label; trailing number is the card count'
        required: true
        type: string
      image:
        description: 'Image for unit lanes / base image for the model lane'
        required: false
        default: ''
        type: string
      timeout_minutes:
        description: 'Job hard limit'
        required: false
        default: 60
        type: number

      # ------------------------------------------------------------------ unit
      test_files:
        description: 'JSON array; empty = everything'
        required: false
        default: '[]'
        type: string
      test_path:
        description: 'Single path / node id; overrides test_files and shard'
        required: false
        default: ''
        type: string
      shard:
        description: '"0/3" form; empty = no sharding'
        required: false
        default: ''
        type: string
      pytest_args:
        description: 'Extra pytest args (split on spaces on purpose)'
        required: false
        default: '-v --durations=20'
        type: string
      transformers_spec:
        description: 'Extra transformers constraint; empty = image default'
        required: false
        default: ''
        type: string

      # ----------------------------------------------------------------- model
      model_type:
        description: '@register_model name, key of model_map.json models'
        required: false
        default: 'qwen3_5'
        type: string
      framework:
        description: 'lf or swift'
        required: false
        default: 'lf'
        type: string
      train_model_path:
        description: 'Explicit model dir; empty = look up hf_repo'
        required: false
        default: ''
        type: string
      hf_repo_override:
        description: 'Override the hf_repo field of model_map.json'
        required: false
        default: ''
        type: string
      trim_layers:
        description: 'Keep the first N layers; 0 = full download'
        required: false
        default: 0
        type: number
      train_seq_len:
        required: false
        default: '1024'
        type: string
      train_dataset:
        required: false
        default: 'gsm8k'
        type: string
      train_finetuning_type:
        required: false
        default: 'full'
        type: string
      train_sp_size:
        description: 'auto = narrow the repo value to the card count'
        required: false
        default: 'auto'
        type: string
      train_ep_size:
        required: false
        default: 'auto'
        type: string
      diag:
        description: 'Put scripts/ci/diag on PYTHONPATH'
        required: false
        default: true
        type: boolean
      strict:
        description: 'true = model fetch timeout fails; false = skip and pass'
        required: false
        default: false
        type: boolean
      train_timeout_minutes:
        description: 'Hard limit for one training step'
        required: false
        default: 10
        type: number
      fetch_timeout_seconds:
        description: 'Model fetch timeout; on timeout the lane is skipped'
        required: false
        default: 600
        type: number
    secrets:
      SWR_USERNAME:
        required: false
      SWR_PASSWORD:
        required: false
    outputs:
      skip_reason:
        description: 'Non-empty when npu-model did not really train'
        value: ${{ jobs.npu_model_tests.outputs.skip_reason }}

  # Manual entry. Defaults favour debugging; callers always pass values explicitly.
  workflow_dispatch:
    inputs:
      kind:
        description: 'Which lane'
        required: true
        default: 'npu-unit'
        type: choice
        options:
          - cpu-unit
          - npu-unit
          - npu-model
      runner_label:
        description: 'Runner label (trailing number is the card count)'
        required: true
        default: 'linux-aarch64-a3-800i-2'
        type: choice
        options:
          - linux-aarch64-a3-800i-2
          - linux-aarch64-a3-800i-4
          - linux-aarch64-a3-800i-8
          - linux-aarch64-a3-800i-16
          - linux-aarch64-cpu-4
          - linux-aarch64-cpu-24
          - ubuntu-22.04-arm
      image:
        description: 'Base image; use repo@sha256:... for an exact repro'
        required: false
        default: 'swr.cn-north-12.myhuaweicloud.com/ascend/torchturbo_npu:base-latest'
        type: string
      test_path:
        description: 'unit only: dir / file / node id; "-" means the whole lane'
        required: false
        default: '-'
        type: string
      pytest_args:
        description: 'unit only: extra pytest args'
        required: false
        default: '-v --durations=20'
        type: string
      transformers_spec:
        description: 'unit only: extra transformers constraint'
        required: false
        default: ''
        type: string
      model_type:
        description: 'model only: @register_model name'
        required: false
        default: 'qwen3_5'
        type: choice
        options:
          - qwen3_5
          - qwen3_5_moe
          - qwen3_5_moe_text
          - bailing_hybrid
          - bailing_moe_v3_vl
          - deepseek_v4
          - kimi_k25
          - llada2_moe
          - qwen4_exp
          - qwen3_moe
          - glm_moe_dsa
      framework:
        description: 'model only: lf or swift launch scripts'
        required: false
        default: 'lf'
        type: choice
        options:
          - lf
          - swift
      trim_layers:
        description: 'model only: keep the first N layers, 0 = full'
        required: false
        default: 0
        type: number
      train_dataset:
        description: 'model only: dataset key from dataset/dataset_info.json'
        required: false
        default: 'gsm8k'
        type: string
      train_seq_len:
        description: 'model only: cutoff_len'
        required: false
        default: '1024'
        type: string
      train_finetuning_type:
        description: 'model only: finetuning type'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - lora
      strict:
        description: 'model only: true = model fetch timeout fails'
        required: false
        default: true
        type: boolean
      timeout_minutes:
        description: 'Job hard limit (manual runs get more room)'
        required: false
        default: 300
        type: number

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  CI_SCRIPTS: ${{ github.workspace }}/scripts/ci
  RESULT_JSON: /tmp/ci-result.json

jobs:
  cpu_unit_tests:
    name: cpu-unit-tests (bare metal / ${{ inputs.runner_label }})
    if: ${{ inputs.kind == 'cpu-unit' }}
    runs-on: ${{ inputs.runner_label }}
    # fromJSON is required: a number input arrives as a string and GitHub
    # silently drops the whole job if timeout-minutes gets one.
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || 60) }}
    # No job-level concurrency: within a group only the last pending job is
    # kept, which cancelled 3 of 5 shards in an earlier run.

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        env:
          TRANSFORMERS_SPEC: ${{ inputs.transformers_spec }}
        run: |
          set -uo pipefail
          python3 "$CI_SCRIPTS/result.py" init --file "$RESULT_JSON" \
            kind=pytest model_type="pytest-${{ inputs.kind }}" \
            mode='${{ inputs.kind }}' runner_label='${{ inputs.runner_label }}'

          START=$(date +%s)
          # Install torch first: the extras below declare torch deps, and
          # resolving them together pulls a full CUDA build.
          python -m pip install torch 2>&1 | tee /tmp/turbo.log
          RC=${PIPESTATUS[0]}
          # Same extras as the container lane, otherwise the same test is green
          # on one lane and red on the other.
          if [ "$RC" -eq 0 ]; then
            python -m pip install --no-build-isolation -e ".[test]" 2>&1 | tee -a /tmp/turbo.log
            RC=${PIPESTATUS[0]}
          fi
          if [ "$RC" -eq 0 ] && [ -n "${TRANSFORMERS_SPEC}" ]; then
            python -m pip install "${TRANSFORMERS_SPEC}" 2>&1 | tee -a /tmp/turbo.log
            RC=${PIPESTATUS[0]}
          fi
          # Print the real version: the image gets transformers transitively,
          # so without this line drift only shows up as a batch of red tests.
          python -c "import transformers; print('transformers =', transformers.__version__)" || true

          python3 "$CI_SCRIPTS/result.py" phase --file "$RESULT_JSON" \
            --name 'install' --seconds "$(( $(date +%s) - START ))" --rc "$RC"
          exit "$RC"

      - name: pytest
        env:
          MODE: cpu
          TEST_FILES: ${{ inputs.test_files }}
          TEST_PATH: ${{ inputs.test_path }}
          SHARD: ${{ inputs.shard }}
          PYTEST_ARGS: ${{ inputs.pytest_args }}
        run: bash "$CI_SCRIPTS/pytest.sh"

      - name: summary
        if: always()
        run: |
          set -uo pipefail
          python3 "$CI_SCRIPTS/result.py" report --file "$RESULT_JSON" \
            --train-log /tmp/pytest.log --junit /tmp/pytest.xml >> "$GITHUB_STEP_SUMMARY" || true
          python3 "$CI_SCRIPTS/result.py" notice --file "$RESULT_JSON" \
            --model-type "pytest-${{ inputs.kind }}" || true

  npu_unit_tests:
    name: npu-unit-tests (container / ${{ inputs.runner_label }})
    if: ${{ inputs.kind == 'npu-unit' }}
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || 60) }}

    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ secrets.SWR_USERNAME }}
        password: ${{ secrets.SWR_PASSWORD }}
      options: --user root

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # Build the result file before anything can fail, so a run that dies in
      # this step still renders a summary.
      - name: preflight
        env:
          KIND: ${{ inputs.kind }}
          RUNNER_LABEL: ${{ inputs.runner_label }}
          IMAGE: ${{ inputs.image }}
          TEST_FILES: ${{ inputs.test_files }}
        run: |
          set -uo pipefail
          python3 "$CI_SCRIPTS/result.py" init --file "$RESULT_JSON" \
            kind=pytest model_type="pytest-$KIND" mode="$KIND" \
            runner_label="$RUNNER_LABEL" image="$IMAGE"

          # Snapshot torch before installing; a swapped torch turns every test
          # red and looks like a code bug.
          python3 "$CI_SCRIPTS/env.py" capture --file /tmp/torch-before.json || true

          uname -m; nproc; free -h | head -2; df -h / | tail -1; python -V
          echo "files: ${TEST_FILES}"

      - name: npu self-check
        run: |
          set -uo pipefail
          # Glob instead of `ls | wc -l`: shellcheck SC2012 flags ls parsing.
          shopt -s nullglob
          davinci=(/dev/davinci*)
          if [ "${#davinci[@]}" -eq 0 ]; then
            echo "::error::no /dev/davinci*, NPUs not mapped into the pod"
            exit 1
          fi
          echo "davinci count: ${#davinci[@]}"
          npu-smi info 2>/dev/null | head -12 || true
          START=$(date +%s); set +e
          python3 "$CI_SCRIPTS/env.py" verify
          RC=$?
          python3 "$CI_SCRIPTS/result.py" phase --file "$RESULT_JSON" \
            --name 'npu self-check' --seconds "$(( $(date +%s) - START ))" --rc "$RC"
          exit "$RC"

      - name: install
        env:
          TRANSFORMERS_SPEC: ${{ inputs.transformers_spec }}
        run: |
          set -uo pipefail
          ARGS=(-e ".[test]")
          [ -n "${TRANSFORMERS_SPEC}" ] && ARGS+=("${TRANSFORMERS_SPEC}")
          START=$(date +%s)
          # --no-build-isolation: [build-system].requires contains torch, and
          # pip would otherwise download a full torch just to run setuptools.
          python -m pip install --no-cache-dir --no-build-isolation "${ARGS[@]}" 2>&1 \
            | tee /tmp/turbo.log
          RC=${PIPESTATUS[0]}
          ELAPSED=$(( $(date +%s) - START ))
          python -c "import transformers; print('transformers =', transformers.__version__)" || true
          [ "$RC" -eq 0 ] && { python3 "$CI_SCRIPTS/env.py" check --file /tmp/torch-before.json || RC=1; }
          python3 "$CI_SCRIPTS/result.py" phase --file "$RESULT_JSON" \
            --name 'install' --seconds "$ELAPSED" --rc "$RC"
          exit "$RC"

      - name: pytest
        env:
          MODE: npu
          TEST_FILES: ${{ inputs.test_files }}
          TEST_PATH: ${{ inputs.test_path }}
          SHARD: ${{ inputs.shard }}
          PYTEST_ARGS: ${{ inputs.pytest_args }}
        run: bash "$CI_SCRIPTS/pytest.sh"

      - name: summary
        if: always()
        run: |
          set -uo pipefail
          python3 "$CI_SCRIPTS/result.py" report --file "$RESULT_JSON" \
            --train-log /tmp/pytest.log --junit /tmp/pytest.xml >> "$GITHUB_STEP_SUMMARY" || true
          python3 "$CI_SCRIPTS/result.py" notice --file "$RESULT_JSON" \
            --model-type "pytest-${{ inputs.kind }}" || true

  # Forwarding only; the implementation lives in ci-tests-model.yml.
  npu_model_tests:
    name: npu-model-tests (${{ inputs.model_type }}/${{ inputs.framework }})
    if: ${{ inputs.kind == 'npu-model' }}
    uses: ./.github/workflows/ci-tests-model.yml
    with:
      runner_label: ${{ inputs.runner_label }}
      image: ${{ inputs.image }}
      model_type: ${{ inputs.model_type }}
      framework: ${{ inputs.framework }}
      train_model_path: ${{ inputs.train_model_path }}
      hf_repo_override: ${{ inputs.hf_repo_override }}
      trim_layers: ${{ inputs.trim_layers }}
      train_seq_len: ${{ inputs.train_seq_len }}
      train_dataset: ${{ inputs.train_dataset }}
      train_finetuning_type: ${{ inputs.train_finetuning_type }}
      train_sp_size: ${{ inputs.train_sp_size }}
      train_ep_size: ${{ inputs.train_ep_size }}
      diag: ${{ inputs.diag }}
      strict: ${{ inputs.strict }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
      train_timeout_minutes: ${{ inputs.train_timeout_minutes }}
      fetch_timeout_seconds: ${{ inputs.fetch_timeout_seconds }}
    secrets:
      SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
      SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
