[build-system]
requires = ["setuptools", "torch"]
build-backend = "setuptools.build_meta"

[project]
name = "torchturbo"
version = "0.1.0"
description = "A supernode-native post-training engine for large language and vision models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11.0"
dependencies = [
    "torch>=2.10.0",
    "omegaconf>=2.3.0",
    "PyYAML>=6.0",
    "safetensors>=0.4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.6.9",
]
test = [
    "pytest>=7.0",
    # 测试里直接 import 的。把它们写在这里而不是散在 workflow 的 pip 列表里，
    # 是因为 CI 两条泳道（镜像 / 裸机）必须装同一套，漏一个就是 collection error。
    "einops",
    "transformers",
    "huggingface_hub",
    "pillow",
    "peft",
]

[tool.hatch.build.targets.wheel]
packages = ["src/torchturbo"]
